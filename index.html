<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brand Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f0f0;
  --bg2:#e8e8e8;
  --white:#ffffff;
  --border:#c8c8c8;
  --border2:#b0b0b0;
  --text:#1a1a1a;
  --text2:#505050;
  --muted:#888888;
  --accent:#2563eb;
  --accent-l:#eff6ff;
  --accent-d:#1d4ed8;
  --green:#16a34a;
  --green-l:#f0fdf4;
  --red:#dc2626;
  --red-l:#fef2f2;
  --yellow:#d97706;
  --yellow-l:#fffbeb;
  --r:4px;
  --font:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --topbar-h:52px;
  --nav-h:58px;
  --sidebar-w:200px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100%;font-size:13px;line-height:1.5;}
button,select,input,textarea{font-family:var(--font);font-size:13px;}
img{max-width:100%;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--border2);}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.auth-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:28px 24px;width:100%;max-width:400px;}
.brand-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.brand-mark{width:32px;height:32px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;letter-spacing:-.3px;}
.brand-name{font-size:18px;font-weight:700;letter-spacing:-.3px;color:var(--text);}
.auth-hint{font-size:12px;color:var(--muted);margin-bottom:22px;padding-left:42px;}
.auth-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;}
.auth-tab{flex:1;padding:8px 12px;border:none;background:none;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
.auth-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* FORMS */
.fg{margin-bottom:12px;}
.fl{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
.fc{width:100%;background:var(--white);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:var(--r);font-size:13px;transition:border-color .15s;-webkit-appearance:none;}
.fc:focus{outline:none;border-color:var(--accent);}
.fc::placeholder{color:var(--muted);}
.fc[disabled]{opacity:.5;cursor:not-allowed;background:var(--bg);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fhint{font-size:11px;color:var(--muted);margin-top:3px;}
.f-static{padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-weight:600;color:var(--text2);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 14px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .12s;white-space:nowrap;}
.btn:active{opacity:.85;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover:not(:disabled){background:var(--accent-d);}
.btn-green{background:var(--green);color:#fff;}.btn-green:hover:not(:disabled){background:#15803d;}
.btn-red{background:var(--red);color:#fff;}.btn-red:hover:not(:disabled){background:#b91c1c;}
.btn-ghost{background:var(--white);border:1px solid var(--border);color:var(--text2);}.btn-ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-xs{padding:3px 8px;font-size:11px;}
.btn-block{width:100%;justify-content:center;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

/* ALERTS */
.alert{padding:9px 11px;border-radius:var(--r);font-size:12px;margin-bottom:11px;display:none;line-height:1.4;border-left:3px solid;}
.alert.show{display:block;}
.alert-err{background:var(--red-l);color:var(--red);border-color:var(--red);}
.alert-info{background:var(--yellow-l);color:var(--yellow);border-color:var(--yellow);}
.alert-ok{background:var(--green-l);color:var(--green);border-color:var(--green);}

/* APP SHELL */
#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:200;height:var(--topbar-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;}
.tb-logo{display:flex;align-items:center;gap:8px;}
.tb-mark{width:24px;height:24px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.tb-name{font-size:14px;font-weight:700;color:var(--text);}
.tb-spacer{flex:1;}
.tb-right{display:flex;align-items:center;gap:6px;}
.tb-username{font-size:12px;font-weight:500;color:var(--text2);}
@media(max-width:480px){.tb-username{display:none;}}
.av{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;border:1px solid var(--border);}
.logout-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:4px 9px;cursor:pointer;font-size:11px;font-weight:600;transition:all .12s;}
.logout-btn:hover{border-color:var(--red);color:var(--red);}
.notif-btn{position:relative;background:none;border:1px solid var(--border);width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .12s;color:var(--text2);}
.notif-btn:hover{border-color:var(--accent);}
.notif-dot{position:absolute;top:3px;right:3px;width:7px;height:7px;background:var(--red);border-radius:50%;border:1px solid var(--white);}

/* SIDEBAR */
.sidebar{display:none;position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--sidebar-w);background:var(--white);border-right:1px solid var(--border);padding:10px 8px;overflow-y:auto;z-index:100;}
.snav-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:6px 8px 3px;}
.snav-btn{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:7px 8px;cursor:pointer;color:var(--text2);font-size:12px;font-weight:500;text-align:left;margin-bottom:1px;transition:all .12s;}
.snav-btn:hover{background:var(--bg);color:var(--text);}
.snav-btn.active{background:var(--accent-l);color:var(--accent);font-weight:700;}
.snav-ico{font-size:14px;width:18px;text-align:center;flex-shrink:0;}
.snav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center;}
@media(min-width:768px){.sidebar{display:block;}.bnav{display:none!important;}.main-wrap{margin-left:var(--sidebar-w);}}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--white);border-top:1px solid var(--border);display:flex;padding:4px 6px calc(4px + env(safe-area-inset-bottom));}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;cursor:pointer;padding:4px 2px;color:var(--muted);font-size:9px;font-weight:600;position:relative;}
.bnav-btn.active{color:var(--accent);}
.bnav-ico{font-size:18px;line-height:1.2;}
.bnav-bdg{position:absolute;top:1px;right:10px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 4px;min-width:15px;text-align:center;}

/* CONTENT */
.main-wrap{padding-bottom:calc(var(--nav-h) + 8px);}
@media(min-width:768px){.main-wrap{padding-bottom:20px;}}
.page{max-width:860px;margin:0 auto;padding:16px 12px;}
@media(min-width:600px){.page{padding:20px 18px;}}

/* CARD */
.card{background:var(--white);border:1px solid var(--border);padding:16px;}
.card+.card{margin-top:12px;}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}

/* SECTION */
.section-hd{margin-bottom:16px;}
.page-title{font-size:16px;font-weight:700;letter-spacing:-.2px;}
.page-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.hd-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
@media(min-width:500px){.stats-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:800px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:var(--white);border:1px solid var(--border);padding:12px 14px;}
.stat-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px;}
.stat-val{font-size:22px;font-weight:700;letter-spacing:-.3px;font-family:var(--mono);}
.stat-s{font-size:10px;color:var(--muted);margin-top:2px;}

/* WEEK NAV */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.wk-btn{background:var(--white);border:1px solid var(--border);color:var(--text);padding:6px 11px;cursor:pointer;font-size:12px;font-weight:600;transition:all .12s;}
.wk-btn:hover{border-color:var(--accent);color:var(--accent);}
.wk-lbl{flex:1;font-size:12px;font-weight:600;color:var(--text2);}
.wk-tag{display:inline-flex;padding:2px 8px;background:var(--accent-l);color:var(--accent);font-size:10px;font-weight:700;border:1px solid #bfdbfe;}
.wk-tag.next{background:var(--yellow-l);color:var(--yellow);border-color:#fde68a;}

/* CALENDAR */
.cal-list{display:flex;flex-direction:column;gap:8px;}
.cal-day{background:var(--white);border:1px solid var(--border);}
.cal-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--border);}
.cal-hd.today-hd{background:var(--accent-l);border-bottom-color:#bfdbfe;}
.cal-hd-l{display:flex;align-items:center;gap:8px;}
.cal-num{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:1px solid var(--border);flex-shrink:0;background:var(--white);}
.cal-num.today{background:var(--accent);color:#fff;border-color:var(--accent);}
.cal-day-name{font-size:13px;font-weight:600;}
.cal-day-date{font-size:10px;color:var(--muted);}
.cal-slots{padding:6px 10px;display:flex;flex-direction:column;gap:5px;}
.cal-empty{padding:10px 12px;text-align:center;font-size:12px;color:var(--muted);}

/* SLOT */
.slot{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:border-color .12s;border-left-width:3px;}
.slot:hover{border-color:var(--accent);}
.slot.s-pending{border-left-color:var(--yellow);}
.slot.s-approved{border-left-color:var(--green);}
.slot.s-rejected{border-left-color:var(--red);opacity:.65;}
.slot.s-active{border-left-color:var(--accent);background:var(--accent-l);}
.slot-body{flex:1;min-width:0;}
.slot-loc{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot-type{font-size:10px;color:var(--muted);}
.slot-meta{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap;}
.slot-time{font-size:11px;color:var(--text2);font-family:var(--mono);}
.slot-sales-ct{font-size:11px;color:var(--green);font-weight:700;}
.slot-amb{font-size:10px;font-weight:700;}
.slot-st{font-size:10px;color:var(--muted);}
.live-tag{font-size:9px;font-weight:700;color:var(--accent);background:var(--white);border:1px solid var(--accent);padding:1px 5px;flex-shrink:0;}

/* MODAL */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;align-items:flex-end;justify-content:center;}
@media(min-width:600px){.modal-ov{align-items:center;}}
.modal-ov.open{display:flex;}
.modal{background:var(--white);border-top:1px solid var(--border);padding:18px 16px calc(16px + env(safe-area-inset-bottom));width:100%;max-height:90vh;overflow-y:auto;animation:slideUp .18s ease;}
@media(min-width:600px){.modal{border:1px solid var(--border);max-width:460px;padding:22px;animation:slideUp2 .16s ease;}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideUp2{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.modal-title{font-size:14px;font-weight:700;}
.modal-close{background:var(--bg);border:1px solid var(--border);color:var(--muted);width:26px;height:26px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s;}
.modal-close:hover{border-color:var(--red);color:var(--red);}

/* DETAIL */
.dbox{background:var(--bg);border:1px solid var(--border);padding:10px 12px;margin-bottom:12px;}
.drow{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:12px;}
.drow+.drow{border-top:1px solid var(--border);}
.dk2{color:var(--muted);flex-shrink:0;margin-right:10px;}
.dv{font-weight:600;text-align:right;}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;font-size:10px;font-weight:700;white-space:nowrap;border:1px solid;}
.badge::before{content:'';width:4px;height:4px;border-radius:50%;flex-shrink:0;}
.bdp{background:var(--yellow-l);color:var(--yellow);border-color:#fde68a;}.bdp::before{background:var(--yellow);}
.bda{background:var(--green-l);color:var(--green);border-color:#bbf7d0;}.bda::before{background:var(--green);}
.bdr{background:var(--red-l);color:var(--red);border-color:#fecaca;}.bdr::before{background:var(--red);}
.bdx{background:var(--accent-l);color:var(--accent);border-color:#bfdbfe;}.bdx::before{background:var(--accent);}

/* TIMER */
.timer-card{background:var(--accent);color:#fff;padding:16px;margin-bottom:14px;border-left:4px solid var(--accent-d);}
.tc-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;opacity:.75;margin-bottom:3px;display:flex;align-items:center;gap:5px;}
.tc-dot{width:6px;height:6px;background:#ff6b6b;border-radius:50%;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.tc-loc{font-size:12px;font-weight:500;opacity:.85;margin-bottom:8px;}
.tc-timer{font-family:var(--mono);font-size:40px;font-weight:500;letter-spacing:1px;margin-bottom:12px;line-height:1;}
.tc-sc-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.tc-sc-val{font-family:var(--mono);font-size:20px;font-weight:700;}
.tc-sc-lbl{font-size:11px;opacity:.7;}
.tc-add-sale{width:100%;padding:9px;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:all .12s;margin-bottom:6px;}
.tc-add-sale:hover{background:rgba(255,255,255,.28);}
.tc-end{width:100%;padding:7px;border:none;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;}
.tc-end:hover{background:rgba(255,255,255,.18);}

/* SALE ITEMS */
.sale-item{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--bg);border:1px solid var(--border);margin-bottom:5px;}
.sale-receipt{width:38px;height:38px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;}
.sale-no-img{width:38px;height:38px;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;color:var(--muted);}
.sale-mech{font-size:12px;font-weight:700;}
.sale-meta{display:flex;align-items:center;gap:5px;margin-top:2px;}
.reg-tag{padding:1px 5px;font-size:10px;font-weight:700;border:1px solid;}
.reg-yes{background:var(--green-l);color:var(--green);border-color:#bbf7d0;}
.reg-no{background:var(--bg2);color:var(--muted);border-color:var(--border);}

/* PHOTO */
.photo-area{border:2px dashed var(--border2);padding:14px;text-align:center;cursor:pointer;transition:all .12s;position:relative;overflow:hidden;background:var(--bg);}
.photo-area:hover{border-color:var(--accent);}
.photo-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
#photo-preview{width:100%;max-height:140px;object-fit:cover;margin-top:8px;display:none;}

/* TOGGLE */
.toggle-row{display:flex;gap:6px;}
.tog-opt{flex:1;padding:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;text-align:center;font-size:12px;font-weight:700;transition:all .12s;color:var(--muted);}
.tog-opt.sel{border-color:var(--green);background:var(--green-l);color:var(--green);}

/* TABLE */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:420px;}
th{text-align:left;padding:7px 9px;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--border);background:var(--bg);white-space:nowrap;}
td{padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border:none;}
tbody tr:hover td{background:var(--bg);}
tr.clickable{cursor:pointer;}

/* MISC */
.qa-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.ap-row{padding:9px 0;border-bottom:1px solid var(--border);}
.ap-row:last-child{border:none;}
.ap-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.ap-title{font-size:12px;font-weight:700;}
.ap-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.ap-btns{display:flex;gap:5px;flex-shrink:0;}
.locked-bar{background:var(--yellow-l);border:1px solid #fde68a;border-left:3px solid var(--yellow);color:var(--yellow);padding:8px 11px;font-size:12px;margin-bottom:12px;}
.next-card{background:var(--white);border:1px solid var(--border);border-left:3px solid var(--accent);padding:12px;margin-bottom:12px;}
.acc-row{background:var(--white);border:1px solid var(--border);padding:12px;margin-bottom:8px;}
.acc-name{font-size:13px;font-weight:700;}
.acc-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.acc-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav-h) + 8px);left:50%;transform:translateX(-50%) translateY(12px);z-index:9999;background:var(--text);color:#fff;padding:8px 16px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;transition:all .24s;pointer-events:none;max-width:90vw;text-align:center;}
@media(min-width:768px){#toast{bottom:14px;}}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.tok{background:var(--text);}
#toast.terr{background:var(--red);}
#toast.twarn{background:var(--yellow);color:#fff;}
#toast.tgreen{background:var(--green);}

@media print{.topbar,.bnav,.sidebar,.btn,#toast,.modal-ov{display:none!important;}.main-wrap{margin:0!important;}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand-row"><div class="brand-mark">BT</div><div class="brand-name">Brand Tool</div></div>
    <div class="auth-hint">Platform dla ambasadorow marki</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">Logowanie</button>
      <button class="auth-tab" onclick="switchAuthTab('register')">Rejestracja</button>
    </div>
    <div id="auth-login-panel">
      <div id="login-err" class="alert alert-err"></div>
      <div class="fg"><label class="fl">E-mail</label><input type="email" class="fc" id="login-email" placeholder="twoj@email.pl" autocomplete="email"></div>

const ACCESS_CODE='TEAM2024';
const SHOP_TYPES=['Zabka','Biedronka','Lidl','Rossmann','Empik','Carrefour','Action','Media Markt','Inne','Akcja Lotna'];

let DB={
  users:[
    {id:'U1',firstName:'Kamila',lastName:'Kowalska',email:'koord@brand.pl',pass:'1234',role:'coordinator',svId:null,status:'active',color:'#2563eb',createdAt:Date.now()-9e8},

    {id:'U3',firstName:'Marta',lastName:'Wisniewska',email:'marta@brand.pl',pass:'1234',role:'ambassador',svId:'U1',status:'active',color:'#16a34a',createdAt:Date.now()-6e8},
    {id:'U4',firstName:'Piotr',lastName:'Zajac',email:'piotr@brand.pl',pass:'1234',role:'ambassador',svId:'U1',status:'active',color:'#d97706',createdAt:Date.now()-5e8},
  ],
  pendingAccounts:[],
  locations:[
    {id:'L1',address:'ul. Woloska 12, Warszawa',shopType:'Zabka',note:''},

  ],
  mechanisms:[
    {id:'M1',name:'Probka produktu',active:true},
    {id:'M2',name:'Karta lojalnosciowa',active:true},

};

const DAYS=['Poniedzialek','Wtorek','Sroda','Czwartek','Piatek','Sobota','Niedziela'];
function uid(){const id='X'+(DB.nextId++);save();return id;}
function getMon(off=0){const d=new Date(),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);const m=new Date(d);m.setDate(diff);m.setHours(0,0,0,0);m.setDate(m.getDate()+off*7);return m;}
function getWeek(off=0){const m=getMon(off);return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return d;});}
function dk(d){return d.toISOString().slice(0,10);}
function fmtD(d){return d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'});}
function isToday(d){return dk(d)===dk(new Date());}
function t2m(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function diffH(s,e){return(t2m(e)-t2m(s))/60;}
function fmtSec(s){return`${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`;}
function pad(n){return String(n).padStart(2,'0');}
function nowStr(){const n=new Date();return`${pad(n.getHours())}:${pad(n.getMinutes())}`;}
function getU(id){return DB.users.find(u=>u.id===id);}
function getL(id){return DB.locations.find(l=>l.id===id);}
function getM(id){return DB.mechanisms.find(m=>m.id===id);}
function fullName(u){return u?u.firstName+' '+u.lastName:'?';}
function ini(u){return u?(u.firstName[0]+u.lastName[0]).toUpperCase():'?';}
function slbl(s,active){if(active)return'Aktywna';return{pending:'Oczekuje',approved:'Zatwierdzona',rejected:'Odrzucona'}[s]||s;}
function sdc(s,active){return active?'x':s==='pending'?'p':s==='approved'?'a':'r';}
function bdcls(s,active){return active?'bdx':s==='pending'?'bdp':s==='approved'?'bda':'bdr';}
function canEditNextWeek(){return new Date().getDay()>=3;}

function toast(msg,type='ok'){const el=document.getElementById('toast');el.textContent=msg;el.className='show t'+type;clearTimeout(el._t);el._t=setTimeout(()=>el.className='',3200);}

let CU=null,weekOff=0,timerInt=null,saleRegVal=true,salePhotoData=null,currentPanel='';

/* AUTH */
function switchAuthTab(tab){
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('auth-login-panel').style.display=tab==='login'?'block':'none';
  document.getElementById('auth-register-panel').style.display=tab==='register'?'block':'none';
  if(tab==='register')populateSVSelect();
}
function populateSVSelect(){
  const sel=document.getElementById('reg-sv');if(!sel)return;
  const coords=DB.users.filter(u=>u.role==='coordinator'&&u.status==='active');
  sel.innerHTML=`<option value="">Wybierz koordynatora...</option>`+coords.map(c=>`<option value="${c.id}">${fullName(c)}</option>`).join('');
}
function doLogin(){
  const email=document.getElementById('login-email').value.trim().toLowerCase();
  const pass=document.getElementById('login-pass').value;
  const err=document.getElementById('login-err');
  err.className='alert alert-err';
  const u=DB.users.find(u=>u.email.toLowerCase()===email&&u.pass===pass);
  if(!u){err.innerHTML='Nieprawidlowy e-mail lub haslo';err.className='alert alert-err show';return;}
  if(u.status==='pending'){err.innerHTML='Konto czeka na zatwierdzenie przez koordynatora';err.className='alert alert-err show';return;}
  if(u.status==='blocked'){err.innerHTML='Konto zostalo zablokowane — skontaktuj sie z koordynatorem';err.className='alert alert-err show';return;}
  CU=u;
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.cssText='display:flex;flex-direction:column;';
  const av=document.getElementById('topbar-av');
  av.textContent=ini(CU);av.style.cssText=`background:${CU.color}18;color:${CU.color};border:1px solid ${CU.color}40`;
  document.getElementById('topbar-nm').textContent=fullName(CU);
  buildNav();updateNotifDot();
  showPanel(CU.role==='coordinator'?'coord-dashboard':'amb-dashboard');
}
function doRegister(){
  const first=document.getElementById('reg-first').value.trim();
  const last=document.getElementById('reg-last').value.trim();
  const email=document.getElementById('reg-email').value.trim().toLowerCase();
  const pass=document.getElementById('reg-pass').value;
  const svId=document.getElementById('reg-sv').value;
  const code=document.getElementById('reg-code').value.trim().toUpperCase();
  const err=document.getElementById('reg-err');const ok=document.getElementById('reg-ok');
  err.className='alert alert-err';ok.className='alert alert-ok';
  if(!first||!last){err.innerHTML='Podaj imie i nazwisko';err.className='alert alert-err show';return;}
  if(!email||!email.includes('@')){err.innerHTML='Podaj prawidlowy e-mail';err.className='alert alert-err show';return;}
  if(pass.length<6){err.innerHTML='Haslo musi miec min. 6 znakow';err.className='alert alert-err show';return;}
  if(!svId){err.innerHTML='Wybierz koordynatora';err.className='alert alert-err show';return;}
  if(code!==ACCESS_CODE){err.innerHTML='Nieprawidlowy kod dostepu';err.className='alert alert-err show';return;}
  if(DB.users.find(u=>u.email.toLowerCase()===email)){err.innerHTML='Ten e-mail jest juz zarejestrowany';err.className='alert alert-err show';return;}
  DB.pendingAccounts.push({id:'PA'+Date.now(),firstName:first,lastName:last,email,pass,role:'ambassador',svId,status:'pending',color:'#2563eb',createdAt:Date.now()});
  save();updateNotifDot();
  ok.innerHTML='Konto zostalo utworzone i czeka na zatwierdzenie przez koordynatora.';ok.className='alert alert-ok show';
  ['reg-first','reg-last','reg-email','reg-pass','reg-code'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
}
function logout(){
  CU=null;weekOff=0;if(timerInt){clearInterval(timerInt);timerInt=null;}
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('login-email').value='';
  document.getElementById('login-pass').value='';
  document.getElementById('login-err').className='alert alert-err';
}

/* NAV */
const AMB_TABS=[{id:'amb-dashboard',ico:'H',lbl:'Dashboard'},{id:'amb-actions',ico:'A',lbl:'Akcje'},{id:'amb-schedule',ico:'K',lbl:'Grafik'},{id:'amb-stats',ico:'S',lbl:'Statystyki'}];
const COORD_TABS=[{id:'coord-dashboard',ico:'H',lbl:'Dashboard'},{id:'coord-schedule',ico:'K',lbl:'Grafik'},{id:'coord-approvals',ico:'Z',lbl:'Zatwierdzenia'},{id:'coord-accounts',ico:'U',lbl:'Konta'},{id:'coord-team',ico:'T',lbl:'Zespol'},{id:'coord-mechanisms',ico:'M',lbl:'Mechanizmy'},{id:'coord-report',ico:'R',lbl:'Raport'}];

function showPanel(id){

  const renders={'amb-dashboard':renderAmbDashboard,'amb-actions':renderAmbActions,'amb-schedule':renderAmbSchedule,'amb-stats':renderAmbStats,'coord-dashboard':renderCoordDashboard,'coord-schedule':renderCoordSchedule,'coord-approvals':renderCoordApprovals,'coord-accounts':renderCoordAccounts,'coord-team':renderCoordTeam,'coord-mechanisms':renderCoordMechanisms,'coord-report':renderCoordReport,'notifications':renderNotifications};

}

/* CALENDAR */
function buildCalDay(day,idx,actions,isCoord,locked){
  const dateKey=dk(day);
  const todHd=isToday(day)?'today-hd':'';
  const todN=isToday(day)?'today':'';
  const mm=String(day.getMonth()+1).padStart(2,'0');
  const addFn=isCoord?`openCoordAddAction('${dateKey}')`:`openAddAction('${dateKey}')`;
  const addDis=(!isCoord&&(locked||actions.length>=2))?'disabled':'';
  let h=`<div class="cal-day"><div class="cal-hd ${todHd}"><div class="cal-hd-l"><div class="cal-num ${todN}">${day.getDate()}</div><div><div class="cal-day-name">${DAYS[idx]}</div><div class="cal-day-date">${mm}.${day.getFullYear()}</div></div></div><button class="btn btn-sm btn-primary" ${addDis} onclick="${addFn}">+ Dodaj</button></div>`;
  if(!actions.length){h+=`<div class="cal-empty">Brak akcji</div>`;}
  else{
    h+=`<div class="cal-slots">`;
    actions.forEach(a=>{
      const l=getL(a.locationId);const u=getU(a.ambassadorId);const active=a.startedAt&&!a.endedAt;const sc=sdc(a.status,active);const sales=(a.sales||[]).length;
      h+=`<div class="slot s-${sdc(a.status,active)}" onclick="openDetail('${a.id}')"><div class="slot-body"><div class="slot-loc">${l?.address||'?'}</div><div class="slot-type">${l?.shopType||''}</div><div class="slot-meta"><span class="slot-time">${a.startTime}–${a.endTime}</span>${sales>0?`<span class="slot-sales-ct">${sales} sprzedazy`:''}${isCoord?`<span class="slot-amb" style="color:${u?.color||'#666'}">${fullName(u)}</span>`:''}${sales>0?'</span>':''}<span class="slot-st">${slbl(a.status,active)}</span></div></div>${active?`<span class="live-tag">LIVE</span>`:''}</div>`;
    });
    h+=`</div>`;
  }
  return h+`</div>`;
}

/* AMB DASHBOARD */
function renderAmbDashboard(){
  const mine=DB.actions.filter(a=>a.ambassadorId===CU.id);
  const wkKeys=new Set(getWeek(0).map(dk));
  const tw=mine.filter(a=>wkKeys.has(a.date));
  const ph=tw.reduce((s,a)=>s+diffH(a.startTime,a.endTime),0);
  const sales=tw.reduce((s,a)=>s+(a.sales?.length||0),0);
  const approved=tw.filter(a=>a.status==='approved').length;
  const pending=tw.filter(a=>a.status==='pending').length;
  const rejected=tw.filter(a=>a.status==='rejected').length;
  const active=mine.find(a=>a.startedAt&&!a.endedAt);
  const todayKey=dk(new Date());
  const upcoming=mine.filter(a=>a.status==='approved'&&a.date>=todayKey&&!a.startedAt&&!a.endedAt).sort((a,b)=>a.date.localeCompare(b.date)||(t2m(a.startTime)-t2m(b.startTime)));
  const next=upcoming[0];
  let h=`<div class="section-hd"><div class="page-title">Witaj, ${CU.firstName}</div><div class="page-sub">Biezacy tydzien — ${fmtD(getWeek(0)[0])} – ${fmtD(getWeek(0)[6])}</div></div>`;
  if(active){h+=`<div id="ti-inject">${buildTimerCard(active.id)}</div>`;setTimeout(()=>startTimerUI(active.id),80);}
  if(!active&&next){
    const isNextToday=next.date===todayKey;
    const minsUntil=isNextToday?t2m(next.startTime)-t2m(nowStr()):-1;
    const canStart=isNextToday&&minsUntil<=30&&minsUntil>=-5;
    const loc=getL(next.locationId);
    h+=`<div class="next-card"><div style="font-size:12px;font-weight:700;margin-bottom:4px">Najblizsa akcja: ${next.date} o ${next.startTime}</div><div style="font-size:11px;color:var(--muted)">${loc?.shopType} — ${loc?.address?.split(',')[0]}</div><div style="margin-top:8px">${canStart?`<button class="btn btn-green btn-sm" onclick="startAction('${next.id}')">Rozpocznij akcje</button>`:`<span style="font-size:11px;color:var(--muted)">Start o ${next.startTime}</span>`}</div></div>`;
  }
  h+=`<div class="stats-grid"><div class="stat-card"><div class="stat-lbl">Zaplanowane h</div><div class="stat-val">${ph.toFixed(1)}</div></div><div class="stat-card"><div class="stat-lbl">Sprzedaze</div><div class="stat-val" style="color:var(--green)">${sales}</div></div><div class="stat-card"><div class="stat-lbl">Zatwierdzone</div><div class="stat-val" style="color:var(--green)">${approved}</div></div><div class="stat-card"><div class="stat-lbl">Oczekujace</div><div class="stat-val" style="color:var(--yellow)">${pending}</div><div class="stat-s">${rejected} odrzuconych</div></div></div>`;
  h+=`<div class="card"><div class="card-hd"><div class="card-title">Akcje tego tygodnia</div><button class="btn btn-ghost btn-sm" onclick="showPanel('amb-schedule')">Grafik</button></div>`;
  if(!tw.length){h+=`<div style="text-align:center;padding:18px;color:var(--muted);font-size:12px">Brak akcji w tym tygodniu</div>`;}
  else{tw.sort((a,b)=>a.date.localeCompare(b.date)||(t2m(a.startTime)-t2m(b.startTime))).forEach(a=>{const l=getL(a.locationId);const act=a.startedAt&&!a.endedAt;const sc=sdc(a.status,act);h+=`<div class="slot s-${sdc(a.status,act)}" style="margin-bottom:5px" onclick="openDetail('${a.id}')"><div class="slot-body"><div class="slot-loc">${l?.address||'?'}</div><div class="slot-meta"><span class="slot-time">${a.date} ${a.startTime}–${a.endTime}</span>${(a.sales?.length||0)>0?`<span class="slot-sales-ct">${a.sales.length} sprzedazy</span>`:''}<span class="slot-st">${slbl(a.status,act)}</span></div></div>${act?`<span class="live-tag">LIVE</span>`:''}<span class="badge ${bdcls(a.status,act)}">${slbl(a.status,act)}</span></div>`;});}
  return h+`</div>`;
}

/* AMB ACTIONS */
function renderAmbActions(){
  const mine=DB.actions.filter(a=>a.ambassadorId===CU.id);
  const todayKey=dk(new Date());
  const active=mine.find(a=>a.startedAt&&!a.endedAt);
  const upcoming=mine.filter(a=>a.status==='approved'&&a.date>=todayKey&&!a.endedAt).sort((a,b)=>a.date.localeCompare(b.date)||(t2m(a.startTime)-t2m(b.startTime)));
  const next=upcoming[0];
  let h=`<div class="section-hd"><div class="page-title">Moje akcje</div><div class="page-sub">Nadchodzace i aktywne</div></div>`;
  if(active){h+=`<div id="ti-inject">${buildTimerCard(active.id)}</div>`;setTimeout(()=>startTimerUI(active.id),80);}
  if(!active&&next){
    const isNextToday=next.date===todayKey;
    const minsUntil=isNextToday?t2m(next.startTime)-t2m(nowStr()):-1;
    const canStart=isNextToday&&minsUntil<=30;
    const loc=getL(next.locationId);
    h+=`<div class="card" style="margin-bottom:12px;border-left:3px solid var(--accent)"><div class="card-title">Najblizsa akcja</div><div style="font-size:13px;font-weight:700;margin-bottom:4px">${loc?.shopType||'?'} — ${loc?.address||'?'}</div><div style="font-size:11px;color:var(--muted);margin-bottom:10px">${next.date} &nbsp; ${next.startTime}–${next.endTime}${loc?.note?` — ${loc.note}`:''}</div>${canStart?`<div style="background:var(--green-l);border:1px solid #bbf7d0;border-left:3px solid var(--green);padding:8px 10px;margin-bottom:8px"><div style="font-size:12px;font-weight:700;color:var(--green)">Mozesz teraz rozpoczac akcje</div><div style="font-size:11px;color:var(--muted)">Okno startowe — 30 min przed godzina akcji</div></div><button class="btn btn-green btn-sm" onclick="startAction('${next.id}')">Rozpocznij akcje</button>`:`<div style="font-size:12px;color:var(--muted)">Start o ${next.startTime}</div>`}</div>`;
  }
  h+=`<div class="card"><div class="card-title">Wszystkie nadchodzace (${upcoming.length})</div>`;
  if(!upcoming.length)h+=`<div style="text-align:center;padding:18px;color:var(--muted);font-size:12px">Brak zaplanowanych akcji</div>`;
  upcoming.forEach(a=>{
    const l=getL(a.locationId);const isNextToday=a.date===todayKey;const mU=isNextToday?t2m(a.startTime)-t2m(nowStr()):-1;const cs=isNextToday&&mU<=30;
    h+=`<div class="slot s-approved" style="margin-bottom:5px" onclick="openDetail('${a.id}')"><div class="slot-body"><div class="slot-loc">${l?.shopType} — ${l?.address?.split(',')[0]}</div><div class="slot-meta"><span class="slot-time">${a.date} ${a.startTime}–${a.endTime}</span></div></div>${cs?`<button class="btn btn-green btn-xs" onclick="event.stopPropagation();startAction('${a.id}')">Start</button>`:''}`;
    h+=`</div>`;
  });

/* AMB SCHEDULE */
function renderAmbSchedule(){
  const days=getWeek(weekOff);const locked=weekOff===1&&!canEditNextWeek();
  let h=`<div class="section-hd hd-row"><div><div class="page-title">Moj grafik</div><div class="page-sub">${fmtD(days[0])} – ${fmtD(days[6])}</div></div></div>`;
  if(locked)h+=`<div class="locked-bar">Nastepny tydzien mozna planowac od srody biezacego tygodnia.</div>`;
  h+=`<div class="week-nav">${weekOff>0?`<button class="wk-btn" onclick="chgWk(-1)">Poprzedni</button>`:''}<span class="wk-lbl"><span class="wk-tag${weekOff===1?' next':''}">${weekOff===0?'Biezacy tydzien':'Nastepny tydzien'}</span></span>${weekOff<1?`<button class="wk-btn" onclick="chgWk(1)">Nastepny</button>`:''}</div><div class="cal-list">`;
  days.forEach((day,i)=>{const mine=DB.actions.filter(a=>a.ambassadorId===CU.id&&a.date===dk(day));h+=buildCalDay(day,i,mine,false,locked);});
  return h+`</div>`;
}
function chgWk(d){weekOff=Math.max(0,Math.min(1,weekOff+d));showPanel(CU.role==='coordinator'?'coord-schedule':'amb-schedule');}

/* AMB STATS */
function renderAmbStats(){
  const mine=DB.actions.filter(a=>a.ambassadorId===CU.id);
  const wk=new Set(getWeek(0).map(dk));const tw=mine.filter(a=>wk.has(a.date));
  const ph=tw.reduce((s,a)=>s+diffH(a.startTime,a.endTime),0);
  const rh=tw.filter(a=>a.endedAt).reduce((s,a)=>s+(a.endedAt-a.startedAt)/3600000,0);
  const sales=tw.reduce((s,a)=>s+(a.sales?.length||0),0);
  const active=mine.find(a=>a.startedAt&&!a.endedAt);
  let h=`<div class="section-hd"><div class="page-title">Statystyki</div><div class="page-sub">Biezacy tydzien</div></div>`;
  h+=`<div id="ti-inject">${active?buildTimerCard(active.id):''}</div>`;
  if(active)setTimeout(()=>startTimerUI(active.id),80);
  h+=`<div class="stats-grid"><div class="stat-card"><div class="stat-lbl">Plan h</div><div class="stat-val">${ph.toFixed(1)}</div></div><div class="stat-card"><div class="stat-lbl">Realiz. h</div><div class="stat-val" style="color:var(--green)">${rh.toFixed(1)}</div></div><div class="stat-card"><div class="stat-lbl">Sprzedaze</div><div class="stat-val" style="color:var(--green)">${sales}</div></div><div class="stat-card"><div class="stat-lbl">Wyplata</div><div class="stat-val" style="color:var(--yellow);font-size:18px">${(rh*25).toFixed(0)} zl</div></div></div>`;
  h+=`<div class="card"><div class="card-title">Historia akcji</div><div class="tw"><table><thead><tr><th>Data</th><th>Lokalizacja</th><th>Czas</th><th>Status</th><th>Sprzed.</th></tr></thead><tbody>`;
  const sorted=[...mine].sort((a,b)=>b.date.localeCompare(a.date));
  if(!sorted.length)h+=`<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:18px">Brak akcji</td></tr>`;
  sorted.slice(0,25).forEach(a=>{const l=getL(a.locationId);const act=a.startedAt&&!a.endedAt;h+=`<tr class="clickable" onclick="openDetail('${a.id}')"><td style="font-family:var(--mono)">${a.date}</td><td><div style="font-weight:600">${l?.shopType||'?'}</div><div style="font-size:10px;color:var(--muted)">${l?.address?.split(',')[0]||''}</div></td><td style="font-family:var(--mono)">${a.startTime}–${a.endTime}</td><td><span class="badge ${bdcls(a.status,act)}">${slbl(a.status,act)}</span></td><td style="color:var(--green);font-weight:700">${a.sales?.length||0}</td></tr>`;});
  return h+`</tbody></table></div></div>`;
}

function onLocChg(){const v=document.getElementById('al')?.value;const s=document.getElementById('nloc-sec');if(s)s.style.display=v==='__new__'?'block':'none';}
function submitAddAction(dateKey,ambId){
  const locSel=document.getElementById('al').value;
  const numV=document.getElementById('an').value;
  const s=document.getElementById('as').value;
  const e=document.getElementById('ae2').value;
  const err=document.getElementById('ae');const inf=document.getElementById('ai');
  err.className='alert alert-err';inf.className='alert alert-info';
  const h=diffH(s,e);
  if(h<1||h>4){err.innerHTML=`Akcja musi trwac min. 1h i maks. 4h (wpisano ${h.toFixed(1)}h)`;err.className='alert alert-err show';return;}
  if(t2m(e)<=t2m(s)){err.innerHTML='Godzina zakonczenia musi byc po starcie';err.className='alert alert-err show';return;}
  let locId=locSel;
  if(locSel==='__new__'){
    const addr=document.getElementById('nla')?.value.trim();const type=document.getElementById('nlt')?.value;const note=document.getElementById('nln')?.value.trim();
    if(!addr){err.innerHTML='Podaj adres lokalizacji';err.className='alert alert-err show';return;}
    locId=uid();DB.locations.push({id:locId,address:addr,shopType:type,note});
  }
  const conflict=DB.actions.find(a=>a.date===dateKey&&a.locationId===locId&&!(t2m(e)<=t2m(a.startTime)||t2m(s)>=t2m(a.endTime)));
  if(conflict){const u2=getU(conflict.ambassadorId);inf.innerHTML=`Brand Ambasador <strong>${fullName(u2)}</strong> pracuje na tym punkcie w godzinach <strong>${conflict.startTime}–${conflict.endTime}</strong>`;inf.className='alert alert-info show';}
  const existing=DB.actions.filter(a=>a.ambassadorId===ambId&&a.date===dateKey);
  if(existing.length>=2){err.innerHTML='Maks. 2 akcje dziennie';err.className='alert alert-err show';return;}
  DB.actions.push({id:uid(),ambassadorId:ambId,locationId:locId,date:dateKey,startTime:s,endTime:e,status:'pending',sales:[],actionNum:parseInt(numV),startedAt:null,endedAt:null,endReason:null});
  save();closeModal();toast('Akcja dodana — czeka na zatwierdzenie','tok');

}

function submitEndAction(actionId,earlyEnd){

    h+=`</div>`;

}

/* COORD REPORT */
function renderCoordReport(){
  const ambs=DB.users.filter(u=>u.role==='ambassador'&&u.status==='active');
  const days=getWeek(0);const wk=new Set(days.map(dk));
  let tH=0,tS=0,tP=0;
  const rows=ambs.map(u=>{const tw=DB.actions.filter(a=>a.ambassadorId===u.id&&wk.has(a.date));const rh=tw.filter(a=>a.endedAt).reduce((s,a)=>s+(a.endedAt-a.startedAt)/3600000,0);const s=tw.reduce((sv,a)=>sv+(a.sales?.length||0),0);const p=rh*25;tH+=rh;tS+=s;tP+=p;return{u,n:tw.length,rh,s,p};});
  let h=`<div class="section-hd hd-row"><div><div class="page-title">Raport tygodniowy</div><div class="page-sub">${fmtD(days[0])} – ${fmtD(days[6])}</div></div><div style="display:flex;gap:6px"><button class="btn btn-ghost btn-sm" onclick="exportExcel()">Pobierz Excel</button><button class="btn btn-ghost btn-sm" onclick="window.print()">Drukuj</button></div></div>`;
  h+=`<div class="stats-grid"><div class="stat-card"><div class="stat-lbl">Lacznie h</div><div class="stat-val">${tH.toFixed(1)}</div></div><div class="stat-card"><div class="stat-lbl">Sprzedaze</div><div class="stat-val" style="color:var(--green)">${tS}</div></div><div class="stat-card"><div class="stat-lbl">Wyplaty</div><div class="stat-val" style="color:var(--yellow);font-size:18px">${tP.toFixed(0)} zl</div></div><div class="stat-card"><div class="stat-lbl">Ambasadorzy</div><div class="stat-val">${ambs.length}</div></div></div>`;
  h+=`<div class="card"><div class="card-title">Podsumowanie zespolu</div><div class="tw"><table><thead><tr><th>Imie i nazwisko</th><th>Akcje</th><th>Godz.</th><th>Sprzedaze</th><th>Wyplata</th></tr></thead><tbody>`;
  rows.forEach(({u,n,rh,s,p})=>{h+=`<tr><td style="font-weight:700;color:${u.color}">${fullName(u)}</td><td style="font-family:var(--mono)">${n}</td><td style="font-family:var(--mono)">${rh.toFixed(1)}h</td><td style="color:var(--green);font-weight:700">${s}</td><td style="color:var(--yellow);font-weight:700">${p.toFixed(2)} zl</td></tr>`;});
  h+=`<tr style="background:var(--bg);font-weight:700"><td>RAZEM</td><td></td><td style="font-family:var(--mono)">${tH.toFixed(1)}h</td><td style="color:var(--green)">${tS}</td><td style="color:var(--yellow)">${tP.toFixed(2)} zl</td></tr></tbody></table></div></div>`;
  h+=`<div class="card" style="margin-top:12px"><div class="card-title">Sprzedaze wg mechanizmu</div><div class="tw"><table><thead><tr><th>Mechanizm</th><th>Sprzedaze</th><th>Zarejestrowani</th></tr></thead><tbody>`;
  DB.mechanisms.forEach(m=>{const cnt=DB.actions.reduce((s,a)=>s+(a.sales||[]).filter(sv=>sv.mechanismId===m.id&&wk.has(a.date)).length,0);const reg=DB.actions.reduce((s,a)=>s+(a.sales||[]).filter(sv=>sv.mechanismId===m.id&&sv.registered&&wk.has(a.date)).length,0);h+=`<tr><td style="font-weight:600">${m.name}</td><td style="color:var(--green);font-weight:700">${cnt}</td><td>${reg}</td></tr>`;});
  return h+`</tbody></table></div></div>`;
}

/* EXCEL */
function exportExcel(){
  if(typeof XLSX==='undefined'){toast('Biblioteka XLSX niedostepna','terr');return;}
  const wb=XLSX.utils.book_new();
  const actionRows=[['ID','Ambasador','E-mail','Data','Godz. od','Godz. do','Lokalizacja','Typ','Status','Sprzedaze','Godz. realiz.','Powod zakonczenia','Zrealizowana']];
  DB.actions.forEach(a=>{const u=getU(a.ambassadorId);const l=getL(a.locationId);const rh=a.endedAt&&a.startedAt?((a.endedAt-a.startedAt)/3600000).toFixed(2):'';actionRows.push([a.id,fullName(u),u?.email||'',a.date,a.startTime,a.endTime,l?.address||'',l?.shopType||'',slbl(a.status,false),(a.sales||[]).length,rh,a.endReason||'',a.endedAt?'TAK':'']);});
  const ws1=XLSX.utils.aoa_to_sheet(actionRows);ws1['!cols']=[{wch:12},{wch:22},{wch:28},{wch:12},{wch:9},{wch:9},{wch:36},{wch:14},{wch:14},{wch:10},{wch:13},{wch:24},{wch:12}];XLSX.utils.book_append_sheet(wb,ws1,'Grafik i akcje');
  const saleRows=[['ID','Data','Ambasador','Lokalizacja','Mechanizm','Zarejestrowany','Paragon']];
  DB.actions.forEach(a=>{const u=getU(a.ambassadorId);const l=getL(a.locationId);(a.sales||[]).forEach(s=>{const m=getM(s.mechanismId);saleRows.push([s.id,a.date,fullName(u),l?.address||'',m?.name||'',s.registered?'Tak':'Nie',s.receiptData?'Dodano':'Brak']);});});
  const ws2=XLSX.utils.aoa_to_sheet(saleRows);ws2['!cols']=[{wch:14},{wch:12},{wch:22},{wch:34},{wch:22},{wch:16},{wch:10}];XLSX.utils.book_append_sheet(wb,ws2,'Sprzedaze');
  const ambRows=[['ID','Imie','Nazwisko','E-mail','Koordynator','Status','Akcje','Sprzedaze']];
  DB.users.filter(u=>u.role==='ambassador').forEach(u=>{const sv=getU(u.svId);const acts=DB.actions.filter(a=>a.ambassadorId===u.id);ambRows.push([u.id,u.firstName,u.lastName,u.email,fullName(sv),u.status==='active'?'Aktywny':'Zablokowany',acts.length,acts.reduce((s,a)=>s+(a.sales?.length||0),0)]);});
  const ws3=XLSX.utils.aoa_to_sheet(ambRows);ws3['!cols']=[{wch:12},{wch:14},{wch:18},{wch:28},{wch:20},{wch:12},{wch:10},{wch:12}];XLSX.utils.book_append_sheet(wb,ws3,'Ambasadorzy');
  XLSX.writeFile(wb,`BrandTool_${new Date().toISOString().slice(0,10)}.xlsx`);toast('Plik Excel pobrany','tgreen');
}

/* NOTIFICATIONS */
function renderNotifications(){
  const pendingAcc=CU.role==='coordinator'?DB.pendingAccounts.filter(p=>p.svId===CU.id):[];
  const rejected=CU.role==='ambassador'?DB.actions.filter(a=>a.ambassadorId===CU.id&&a.status==='rejected'):[];
  let h=`<div class="section-hd"><div class="page-title">Powiadomienia</div></div>`;
  if(!pendingAcc.length&&!rejected.length){h+=`<div class="card" style="text-align:center;padding:28px;color:var(--muted)">Brak powiadomien</div>`;return h;}
  pendingAcc.forEach(p=>{h+=`<div class="card" style="margin-bottom:8px;border-left:3px solid var(--yellow)"><div style="font-size:12px;font-weight:700">Nowy ambasador chce dolaczyc</div><div style="font-size:11px;color:var(--muted);margin-top:3px">${p.firstName} ${p.lastName} — ${p.email}</div><div class="btn-row"><button class="btn btn-green btn-sm" onclick="approveAccount('${p.id}')">Zatwierdz</button><button class="btn btn-red btn-sm" onclick="rejectAccount('${p.id}')">Odrzuc</button></div></div>`;});
  rejected.forEach(a=>{const l=getL(a.locationId);h+=`<div class="card" style="margin-bottom:8px;border-left:3px solid var(--red)"><div style="font-size:12px;font-weight:700">Akcja odrzucona</div><div style="font-size:11px;color:var(--muted);margin-top:3px">${l?.shopType} — ${a.date} ${a.startTime}–${a.endTime}</div></div>`;});
  return h;
}

/* MODAL */
function openModal(){document.getElementById('modal-ov').classList.add('open');document.body.style.overflow='hidden';}
function closeModal(){document.getElementById('modal-ov').classList.remove('open');document.body.style.overflow='';}
function closeModalBg(e){if(e.target===document.getElementById('modal-ov'))closeModal();}

(function init(){
  const saved=loadDB();
  if(saved){
    DB=saved;
    if(!DB.users.find(u=>u.email==='koord@brand.pl'))DB.users.unshift({id:'U1',firstName:'Kamila',lastName:'Kowalska',email:'koord@brand.pl',pass:'1234',role:'coordinator',svId:null,status:'active',color:'#2563eb',createdAt:Date.now()-9e8});
  } else {
    const today=new Date();
    function dkN(n){const d=new Date(today);d.setDate(d.getDate()+n);return dk(d);}
    const day=today.getDay(),m=day===0?-6:1-day;
    [{a:'U2',l:'L1',dt:dkN(m),s:'09:00',e:'13:00',st:'approved'},{a:'U2',l:'L3',dt:dkN(m+1),s:'14:00',e:'17:00',st:'pending'},{a:'U3',l:'L2',dt:dkN(m),s:'10:00',e:'14:00',st:'approved'},{a:'U3',l:'L1',dt:dkN(m+2),s:'09:00',e:'12:00',st:'rejected'},{a:'U4',l:'L3',dt:dkN(m+1),s:'08:00',e:'12:00',st:'approved'},{a:'U4',l:'L2',dt:dkN(m+3),s:'13:00',e:'17:00',st:'pending'}].forEach(x=>DB.actions.push({id:uid(),ambassadorId:x.a,locationId:x.l,date:x.dt,startTime:x.s,endTime:x.e,status:x.st,sales:[],actionNum:1,startedAt:null,endedAt:null,endReason:null}));
    save();
  }
})();
