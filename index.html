<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brand Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs, addDoc, onSnapshot, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBLQeO5TuoOVR9aHHyLhXoRIk6gGwZ8BZE",
    authDomain: "brandtool.firebaseapp.com",
    projectId: "brandtool",
    storageBucket: "brandtool.firebasestorage.app",
    messagingSenderId: "1058941616073",
    appId: "1:1058941616073:web:b6108b5dab2afa8a21b218",
    measurementId: "G-ZH5N3FPGGF"
  };

  const FIREBASE_OK = firebaseConfig.apiKey !== "TWOJ_API_KEY";
  let app, db, auth;
  if (FIREBASE_OK) {
    app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    auth = getAuth(app);
  }

  let authSecondary = null;
  if (FIREBASE_OK) {
    try {
      const app2 = initializeApp(firebaseConfig, 'secondary');
      authSecondary = getAuth(app2);
    } catch(e) { authSecondary = null; }
  }

  window._FB = {
    ok: FIREBASE_OK, db, auth, authSecondary,
    doc, getDoc, setDoc, updateDoc, deleteDoc,
    collection, getDocs, addDoc, onSnapshot,
    query, where, serverTimestamp,
    signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged
  };

  window.dispatchEvent(new Event('firebase-ready'));
</script>

<style>
:root {
  --bg: #0f1117; --bg2: #161b27; --bg3: #1e2535; --white: #1a2033;
  --border: #252d3f; --border2: #2f3a52;
  --text: #e8eaf0; --text2: #9aa5be; --muted: #5a6480;
  --accent: #4f8ef7; --accent-l: #1a2a4a; --accent-d: #3a72d8;
  --green: #22c55e; --green-l: #0d2a1a;
  --red: #f05252; --red-l: #2a0f0f;
  --yellow: #f59e0b; --yellow-l: #2a1f07;
  --orange: #fb923c; --orange-l: #2a1507;
  --r: 6px; --font: 'DM Sans', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --topbar-h: 52px; --nav-h: 62px; --sidebar-w: 210px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100%;font-size:13px;line-height:1.5;}
button,select,input,textarea{font-family:var(--font);font-size:13px;}
img{max-width:100%;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);background-image:radial-gradient(ellipse at 20% 50%,#1a2a4a22 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,#0d2a1a22 0%,transparent 60%);}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:32px 28px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.5);}
.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.brand-mark{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;border-radius:8px;letter-spacing:-.3px;box-shadow:0 4px 12px rgba(79,142,247,.3);}
.brand-name{font-size:20px;font-weight:700;letter-spacing:-.5px;}
.brand-sub{font-size:12px;color:var(--muted);margin-bottom:26px;padding-left:48px;}
.auth-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:22px;gap:4px;}
.auth-tab{flex:1;padding:9px 12px;border:none;background:none;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
.auth-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* FORMS */
.fg{margin-bottom:14px;}
.fl{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.fc{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:var(--r);font-size:13px;transition:border-color .15s;-webkit-appearance:none;}
.fc:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,142,247,.15);}
.fc::placeholder{color:var(--muted);}
.fc option{background:var(--bg3);color:var(--text);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fhint{font-size:11px;color:var(--muted);margin-top:4px;}
.f-static{padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-weight:600;color:var(--text2);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .12s;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(79,142,247,.25);}.btn-primary:hover:not(:disabled){background:var(--accent-d);}
.btn-green{background:var(--green);color:#000;}.btn-green:hover:not(:disabled){filter:brightness(1.1);}
.btn-red{background:var(--red);color:#fff;}.btn-red:hover:not(:disabled){filter:brightness(1.1);}
.btn-ghost{background:var(--bg3);border:1px solid var(--border);color:var(--text2);}.btn-ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.btn-orange{background:var(--orange);color:#000;}.btn-orange:hover:not(:disabled){filter:brightness(1.1);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-xs{padding:4px 9px;font-size:11px;}
.btn-block{width:100%;justify-content:center;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}

/* ALERTS */
.alert{padding:10px 12px;border-radius:var(--r);font-size:12px;margin-bottom:12px;display:none;line-height:1.5;border-left:3px solid;}
.alert.show{display:block;}
.alert-err{background:var(--red-l);color:#f87171;border-color:var(--red);}
.alert-info{background:var(--yellow-l);color:var(--yellow);border-color:var(--yellow);}
.alert-ok{background:var(--green-l);color:var(--green);border-color:var(--green);}

/* APP SHELL */
#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:200;height:var(--topbar-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;}
.tb-logo{display:flex;align-items:center;gap:9px;}
.tb-mark{width:26px;height:26px;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;border-radius:6px;}
.tb-name{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.3px;}
.tb-spacer{flex:1;}
.tb-right{display:flex;align-items:center;gap:8px;}
.tb-username{font-size:12px;font-weight:500;color:var(--text2);}
@media(max-width:480px){.tb-username{display:none;}}
.av{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;border-radius:6px;border:1px solid var(--border);}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:5px 10px;cursor:pointer;font-size:11px;font-weight:600;border-radius:var(--r);transition:all .12s;}
.logout-btn:hover{border-color:var(--red);color:var(--red);}
.notif-btn{position:relative;background:var(--bg3);border:1px solid var(--border);width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .12s;color:var(--text2);border-radius:var(--r);}
.notif-btn:hover{border-color:var(--accent);color:var(--accent);}
.notif-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--red);border-radius:50%;border:1.5px solid var(--bg2);}
.fb-bar{background:var(--yellow-l);border-bottom:1px solid #3a2a07;padding:6px 16px;font-size:11px;color:var(--yellow);display:flex;align-items:center;gap:8px;}
.fb-bar.ok{background:var(--green-l);border-color:#0d2a1a;color:var(--green);}

/* SIDEBAR */
.sidebar{display:none;position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);padding:12px 8px;overflow-y:auto;z-index:100;}
.snav-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:8px 10px 4px;}
.snav-btn{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;padding:8px 10px;cursor:pointer;color:var(--text2);font-size:12px;font-weight:500;text-align:left;margin-bottom:2px;transition:all .12s;border-radius:var(--r);}
.snav-btn:hover{background:var(--bg3);color:var(--text);}
.snav-btn.active{background:var(--accent-l);color:var(--accent);font-weight:700;}
.snav-ico{font-size:10px;font-weight:700;width:22px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);letter-spacing:-.3px;font-family:var(--mono);}
.snav-btn.active .snav-ico{color:var(--accent);}
.snav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;min-width:18px;text-align:center;}
@media(min-width:768px){.sidebar{display:block;}.bnav{display:none!important;}.main-wrap{margin-left:var(--sidebar-w);}}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--bg2);border-top:1px solid var(--border);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom));}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;padding:5px 2px;color:var(--muted);font-size:9px;font-weight:600;position:relative;}
.bnav-btn.active{color:var(--accent);}
.bnav-ico{font-size:11px;font-weight:700;line-height:1.2;font-family:var(--mono);}
.bnav-bdg{position:absolute;top:2px;right:8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:20px;min-width:15px;text-align:center;}
.more-menu{display:none;position:fixed;bottom:calc(var(--nav-h) + 4px);right:8px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:6px;z-index:300;min-width:160px;box-shadow:0 -4px 20px rgba(0,0,0,.4);}
.more-menu.open{display:block;}
.more-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);border-radius:6px;transition:all .12s;position:relative;}
.more-item:hover,.more-item.active{background:var(--bg3);color:var(--accent);}
.more-item-ico{font-size:11px;font-weight:700;width:20px;text-align:center;font-family:var(--mono);color:var(--muted);}
.more-bdg{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:20px;}

/* CONTENT */
.main-wrap{padding-bottom:calc(var(--nav-h) + 10px);}
@media(min-width:768px){.main-wrap{padding-bottom:24px;}}
.page{max-width:880px;margin:0 auto;padding:18px 14px;}
@media(min-width:600px){.page{padding:24px 20px;}}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);padding:16px;border-radius:8px;}
.card+.card{margin-top:12px;}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);}

/* SECTION */
.section-hd{margin-bottom:18px;}
.page-title{font-size:17px;font-weight:700;letter-spacing:-.3px;}
.page-sub{font-size:12px;color:var(--muted);margin-top:3px;}
.hd-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
@media(min-width:500px){.stats-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:800px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:var(--bg2);border:1px solid var(--border);padding:14px 16px;border-radius:8px;}
.stat-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px;}
.stat-val{font-size:24px;font-weight:700;letter-spacing:-.5px;font-family:var(--mono);}
.stat-s{font-size:10px;color:var(--muted);margin-top:2px;}

/* WEEK NAV */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.wk-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 13px;cursor:pointer;font-size:12px;font-weight:600;border-radius:var(--r);transition:all .12s;}
.wk-btn:hover{border-color:var(--accent);color:var(--accent);}
.wk-lbl{flex:1;font-size:12px;font-weight:600;color:var(--text2);}
.wk-tag{display:inline-flex;padding:3px 9px;background:var(--accent-l);color:var(--accent);font-size:10px;font-weight:700;border:1px solid #1e3a6a;border-radius:20px;}
.wk-tag.next{background:var(--yellow-l);color:var(--yellow);border-color:#3a2a07;}

/* CALENDAR */
.cal-list{display:flex;flex-direction:column;gap:10px;}
.cal-day{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.cal-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--border);}
.cal-hd.today-hd{background:var(--accent-l);border-bottom-color:#1e3a6a;}
.cal-hd-l{display:flex;align-items:center;gap:10px;}
.cal-num{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:1px solid var(--border);flex-shrink:0;background:var(--bg2);border-radius:6px;}
.cal-num.today{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,142,247,.3);}
.cal-day-name{font-size:13px;font-weight:600;}
.cal-day-date{font-size:10px;color:var(--muted);}
.cal-slots{padding:8px 12px;display:flex;flex-direction:column;gap:6px;}
.cal-empty{padding:12px;text-align:center;font-size:12px;color:var(--muted);}

/* SLOT */
.slot{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--bg3);border:1px solid var(--border);cursor:pointer;transition:all .12s;border-left-width:3px;border-radius:6px;}
.slot:hover{border-color:var(--accent);background:var(--bg2);}
.slot.s-pending{border-left-color:var(--yellow);}
.slot.s-approved{border-left-color:var(--green);}
.slot.s-rejected{border-left-color:var(--red);opacity:.55;}
.slot.s-active{border-left-color:var(--accent);background:var(--accent-l);}
.slot-body{flex:1;min-width:0;}
.slot-loc{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot-type{font-size:10px;color:var(--muted);}
.slot-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap;}
.slot-time{font-size:11px;color:var(--text2);font-family:var(--mono);}
.slot-sales-ct{font-size:11px;color:var(--green);font-weight:700;}
.slot-amb{font-size:10px;font-weight:700;}
.slot-st{font-size:10px;color:var(--muted);}
.live-tag{font-size:9px;font-weight:700;color:var(--accent);background:var(--accent-l);border:1px solid #1e3a6a;padding:2px 6px;flex-shrink:0;border-radius:4px;animation:pulse-border 1.5s infinite;}
@keyframes pulse-border{0%,100%{opacity:1}50%{opacity:.6}}

/* MODAL */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);}
@media(min-width:600px){.modal-ov{align-items:center;}}
.modal-ov.open{display:flex;}
.modal{background:var(--bg2);border-top:1px solid var(--border);padding:20px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-height:92vh;overflow-y:auto;animation:slideUp .18s ease;border-radius:12px 12px 0 0;}
@media(min-width:600px){.modal{border:1px solid var(--border);border-radius:10px;max-width:520px;padding:24px;animation:fadeIn .16s ease;}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.modal-title{font-size:15px;font-weight:700;}
.modal-close{background:var(--bg3);border:1px solid var(--border);color:var(--muted);width:28px;height:28px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s;border-radius:var(--r);}
.modal-close:hover{border-color:var(--red);color:var(--red);}

/* DETAIL BOX */
.dbox{background:var(--bg3);border:1px solid var(--border);padding:12px 14px;margin-bottom:14px;border-radius:6px;}
.drow{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:12px;}
.drow+.drow{border-top:1px solid var(--border);}
.dk2{color:var(--muted);flex-shrink:0;margin-right:10px;}
.dv{font-weight:600;text-align:right;}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;font-size:10px;font-weight:700;white-space:nowrap;border:1px solid;border-radius:20px;}
.badge::before{content:'';width:4px;height:4px;border-radius:50%;flex-shrink:0;}
.bdp{background:var(--yellow-l);color:var(--yellow);border-color:#3a2a07;}.bdp::before{background:var(--yellow);}
.bda{background:var(--green-l);color:var(--green);border-color:#0d3a1a;}.bda::before{background:var(--green);}
.bdr{background:var(--red-l);color:var(--red);border-color:#3a0f0f;}.bdr::before{background:var(--red);}
.bdx{background:var(--accent-l);color:var(--accent);border-color:#1e3a6a;}.bdx::before{background:var(--accent);}
.bdo{background:var(--orange-l);color:var(--orange);border-color:#3a2007;}.bdo::before{background:var(--orange);}

/* TIMER */
.timer-card{background:linear-gradient(135deg,var(--accent-l),var(--bg3));border:1px solid #1e3a6a;border-left:4px solid var(--accent);padding:18px;margin-bottom:16px;border-radius:8px;}
.tc-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.tc-dot{width:7px;height:7px;background:var(--red);border-radius:50%;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.tc-loc{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:10px;}
.tc-timer{font-family:var(--mono);font-size:42px;font-weight:500;letter-spacing:2px;margin-bottom:14px;line-height:1;}
.tc-sc-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.tc-sc-val{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--green);}
.tc-sc-lbl{font-size:11px;color:var(--text2);}
.tc-action-btns{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.tc-add-sale{flex:1;padding:10px;border:1px solid var(--accent);background:var(--accent-l);color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;transition:all .12s;border-radius:var(--r);}
.tc-add-sale:hover{background:var(--accent);color:#fff;}
.tc-sampling-btn{flex:1;padding:10px;border:1px solid var(--orange);background:var(--orange-l);color:var(--orange);font-size:13px;font-weight:700;cursor:pointer;transition:all .12s;border-radius:var(--r);}
.tc-sampling-btn:hover{background:var(--orange);color:#000;}
.tc-end{width:100%;padding:8px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;border-radius:var(--r);}
.tc-end:hover{border-color:var(--red);color:var(--red);}

/* SALE ITEMS */
.sale-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg3);border:1px solid var(--border);margin-bottom:6px;border-radius:6px;}
.sale-receipt{width:40px;height:40px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;border-radius:4px;}
.sale-no-img{width:40px;height:40px;background:var(--bg2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;color:var(--muted);border-radius:4px;}
.sale-mech{font-size:12px;font-weight:700;}
.sale-meta{display:flex;align-items:center;gap:5px;margin-top:3px;}
.reg-tag{padding:2px 6px;font-size:10px;font-weight:700;border:1px solid;border-radius:4px;}
.reg-yes{background:var(--green-l);color:var(--green);border-color:#0d3a1a;}
.reg-no{background:var(--bg3);color:var(--muted);border-color:var(--border);}

/* PHOTO */
.photo-area{border:2px dashed var(--border2);padding:16px;text-align:center;cursor:pointer;transition:all .12s;position:relative;overflow:hidden;background:var(--bg3);border-radius:var(--r);}
.photo-area:hover{border-color:var(--accent);}
.photo-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
#photo-preview{width:100%;max-height:150px;object-fit:cover;margin-top:10px;display:none;border-radius:4px;}

/* TOGGLE */
.toggle-row{display:flex;gap:6px;}
.tog-opt{flex:1;padding:9px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;text-align:center;font-size:12px;font-weight:700;transition:all .12s;color:var(--muted);border-radius:var(--r);}
.tog-opt.sel{border-color:var(--green);background:var(--green-l);color:var(--green);}
.tog-opt.sel-red{border-color:var(--red);background:var(--red-l);color:var(--red);}

/* TABLE */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:440px;}
th{text-align:left;padding:8px 10px;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--bg3);white-space:nowrap;}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border:none;}
tbody tr:hover td{background:var(--bg3);}
tr.clickable{cursor:pointer;}

/* PRODUCT CARDS */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px;}
.prod-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:all .12s;position:relative;}
.prod-card:hover{border-color:var(--accent);transform:translateY(-1px);}
.prod-card.selected{border-color:var(--accent);background:var(--accent-l);}
.prod-card.expired{border-color:var(--red);opacity:.7;}
.prod-card.expiring-soon{border-color:var(--yellow);}
.prod-img{width:100%;height:70px;object-fit:contain;margin-bottom:8px;border-radius:4px;}
.prod-img-placeholder{width:100%;height:70px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:8px;background:var(--bg2);border-radius:4px;border:1px solid var(--border);}
.prod-name{font-size:11px;font-weight:700;margin-bottom:4px;line-height:1.3;}
.prod-brand{font-size:10px;color:var(--muted);margin-bottom:6px;}
.prod-stock{display:flex;align-items:center;justify-content:space-between;}
.prod-count{font-family:var(--mono);font-size:16px;font-weight:700;}
.prod-unit{font-size:10px;color:var(--muted);}
.stock-badge{position:absolute;top:6px;right:6px;font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;}
.sb-open{background:var(--green-l);color:var(--green);border:1px solid #0d3a1a;}
.sb-closed{background:var(--bg2);color:var(--muted);border:1px solid var(--border);}
.sb-expired{background:var(--red-l);color:var(--red);border:1px solid #3a0f0f;}
.sb-expiring{background:var(--yellow-l);color:var(--yellow);border:1px solid #3a2a07;}
.expiry-warn{font-size:10px;color:var(--yellow);margin-top:4px;}
.expiry-expired{font-size:10px;color:var(--red);margin-top:4px;}

/* STOCK PANEL */
.stock-section-title{font-size:12px;font-weight:700;color:var(--text2);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.5px;}
.stock-item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;}
.stock-item.open-pack{border-left:3px solid var(--green);}
.stock-item.closed-pack{border-left:3px solid var(--border2);}
.stock-item.expired-pack{border-left:3px solid var(--red);}
.stock-item.expiring-pack{border-left:3px solid var(--yellow);}
.si-icon{font-size:20px;flex-shrink:0;}
.si-info{flex:1;}
.si-name{font-size:12px;font-weight:700;}
.si-meta{font-size:10px;color:var(--muted);margin-top:2px;}
.si-right{text-align:right;}
.si-count{font-family:var(--mono);font-size:18px;font-weight:700;}
.si-total{font-size:10px;color:var(--muted);}
.progress-bar{width:100%;height:4px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden;}
.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s;}
.progress-fill.low{background:var(--yellow);}
.progress-fill.critical{background:var(--red);}

/* MISC */
.qa-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.ap-row{padding:10px 0;border-bottom:1px solid var(--border);}
.ap-row:last-child{border:none;}
.ap-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.ap-title{font-size:12px;font-weight:700;}
.ap-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.ap-btns{display:flex;gap:5px;flex-shrink:0;}
.locked-bar{background:var(--yellow-l);border:1px solid #3a2a07;border-left:3px solid var(--yellow);color:var(--yellow);padding:9px 12px;font-size:12px;margin-bottom:14px;border-radius:var(--r);}
.next-card{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);padding:14px;margin-bottom:14px;border-radius:8px;}
.acc-row{background:var(--bg2);border:1px solid var(--border);padding:14px;margin-bottom:10px;border-radius:8px;}
.acc-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

/* USER MANAGER */
.um-user{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.um-user:last-child{border:none;}
.um-info{flex:1;}
.um-name{font-size:13px;font-weight:700;}
.um-email{font-size:11px;color:var(--muted);margin-top:1px;}
.um-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.role-pill{padding:3px 9px;font-size:10px;font-weight:700;border-radius:20px;border:1px solid;}
.role-coordinator{background:#1a2a4a;color:var(--accent);border-color:#1e3a6a;}
.role-ambassador{background:var(--green-l);color:var(--green);border-color:#0d3a1a;}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav-h) + 10px);left:50%;transform:translateX(-50%) translateY(14px);z-index:9999;background:var(--bg3);color:var(--text);padding:9px 18px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4);opacity:0;transition:all .24s;pointer-events:none;max-width:90vw;text-align:center;border-radius:var(--r);border:1px solid var(--border);}
@media(min-width:768px){#toast{bottom:16px;}}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.terr{background:var(--red-l);border-color:var(--red);color:var(--red);}
#toast.twarn{background:var(--yellow-l);border-color:var(--yellow);color:var(--yellow);}
#toast.tgreen{background:var(--green-l);border-color:var(--green);color:var(--green);}

/* LOADING */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:10000;}
.loading-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:ldot .8s infinite alternate;}
@keyframes ldot{from{opacity:.2;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.loading-dots{display:flex;gap:6px;}
.loading-dots span:nth-child(2){animation-delay:.15s;}
.loading-dots span:nth-child(3){animation-delay:.3s;}

/* SAMPLING CARD */
.sampling-card{background:linear-gradient(135deg,var(--orange-l),var(--bg3));border:1px solid var(--orange);border-left:4px solid var(--orange);padding:14px;border-radius:8px;margin-bottom:10px;}
.sampling-card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--orange);margin-bottom:8px;}

@media(max-width:767px){
  .page{padding:12px 10px;}
  .hd-row{flex-direction:column;gap:8px;}
  .hd-row select.fc{width:100%!important;}
  .ap-top{flex-direction:column;gap:8px;}
  .ap-btns{flex-wrap:wrap;}
  .um-user{flex-wrap:wrap;gap:8px;}
  .um-controls{width:100%;justify-content:flex-start;}
  .tc-timer{font-size:30px;}
  .stat-val{font-size:19px;}
  .card{padding:12px;}
  .modal{max-height:88vh;}
  .drow{flex-wrap:wrap;gap:4px;}
  .dv{text-align:left;}
  .acc-btns{flex-direction:column;}
  .acc-btns .btn{width:100%;}
  .prod-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
}
@media(max-width:400px){
  .fr{grid-template-columns:1fr;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .tc-timer{font-size:26px;}
}
@media print{.topbar,.bnav,.sidebar,.btn,#toast,.modal-ov{display:none!important;}.main-wrap{margin:0!important;}}
</style>

<!-- APP -->

<script>
// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
const ADMIN_EMAIL = 'admin@mojafirma.pl';
const ADMIN_PASS  = 'admin123';
let RATE_PER_HOUR = 25;

// Definicje produktów
const ID_STICKS = [
  {id:'ID_RED',    name:'Red Tobacco',         brand:'iD', color:'#c0392b', emoji:'🔴', sticksPer:20 image: 'https://github.com/4Fawor/BrandTool/zdj/red.jpg'},
  {id:'ID_BRONZE', name:'Bronze Tobacco',       brand:'iD', color:'#a0522d', emoji:'🟤', sticksPer:20},
  {id:'ID_GOLD',   name:'Gold Tobacco',         brand:'iD', color:'#d4a017', emoji:'🟡', sticksPer:20},
  {id:'ID_SILVER', name:'Silver Tobacco',       brand:'iD', color:'#aaa',    emoji:'⚪', sticksPer:20},
  {id:'ID_POLAR',  name:'Polar Green',          brand:'iD', color:'#27ae60', emoji:'🟢', sticksPer:20},
  {id:'ID_PINK',   name:'Flora Pink',           brand:'iD', color:'#e91e8c', emoji:'🩷', sticksPer:20},
  {id:'ID_BLUE',   name:'Blue Tobacco',         brand:'iD', color:'#2980b9', emoji:'🔵', sticksPer:20},
];
const ISENZIA_INSERTS = [
  {id:'IS_ICE',   name:'ICE Menthol Crush',    brand:'iSenzia', color:'#00bcd4', emoji:'🧊', sticksPer:20},
  {id:'IS_POLAR', name:'Polar Menthol Crush',  brand:'iSenzia', color:'#4caf50', emoji:'🌿', sticksPer:20},
  {id:'IS_BERRY', name:'Forest Berry Crush',   brand:'iSenzia', color:'#9c27b0', emoji:'🫐', sticksPer:20},
  {id:'IS_PEACH', name:'Sunset Peach Crush',   brand:'iSenzia', color:'#ff9800', emoji:'🍑', sticksPer:20},
  {id:'IS_WATER', name:'Summer Watermelon',    brand:'iSenzia', color:'#f44336', emoji:'🍉', sticksPer:20},
];
const ALL_PRODUCTS = [...ID_STICKS, ...ISENZIA_INSERTS];
const PACK_EXPIRY_DAYS = 14;

const LS_KEY = 'brandtool_v4';
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem(LS_KEY);if(r)return JSON.parse(r);}catch(e){}return null;}

const SHOP_TYPES = ['Żabka','Biedronka','Lidl','Rossmann','Empik','Carrefour','Action','Media Markt','Inne','Akcja Lotna'];

let DB = {
  users: [],
  pendingAccounts: [],
  locations: [
    {id:'L1', address:'ul. Wołoska 12, Warszawa',    shopType:'Żabka',  note:''},
    {id:'L2', address:'Al. Jerozolimskie 44, Warszawa', shopType:'Biedronka', note:''},
    {id:'L3', address:'ul. Marszałkowska 5, Warszawa',  shopType:'Akcja Lotna', note:''},
  ],
  mechanisms: [
    {id:'M1', name:'Próbka produktu',  active:true},
    {id:'M2', name:'Karta lojalnościowa', active:true},
    {id:'M3', name:'Rejestracja aplikacji', active:true},
  ],
  actions: [],
  stock: [], // { id, userId, productId, packsTotal, openedPacks:[], closedPacks, openedAt?, expiresAt? }
  nextId: 100,
};

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
const DAYS = ['Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota','Niedziela'];
function uid(){const id='X'+(DB.nextId++);saveLocal();return id;}
function getMon(off=0){const d=new Date(),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);const m=new Date(d);m.setDate(diff);m.setHours(0,0,0,0);m.setDate(m.getDate()+off*7);return m;}
function getWeek(off=0){const m=getMon(off);return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return d;});}
function dk(d){return d.toISOString().slice(0,10);}
function fmtD(d){return d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'});}
function isToday(d){return dk(d)===dk(new Date());}
function t2m(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function diffH(s,e){return(t2m(e)-t2m(s))/60;}
function fmtSec(s){return`${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`;}
function pad(n){return String(n).padStart(2,'0');}
function nowStr(){const n=new Date();return`${pad(n.getHours())}:${pad(n.getMinutes())}`;}
function getU(id){return DB.users.find(u=>u.id===id);}
function getL(id){return DB.locations.find(l=>l.id===id);}
function getM(id){return DB.mechanisms.find(m=>m.id===id);}
function getProd(id){return ALL_PRODUCTS.find(p=>p.id===id);}
function fullName(u){return u?u.firstName+' '+u.lastName:'?';}
function ini(u){return u?(u.firstName[0]+u.lastName[0]).toUpperCase():'?';}
function slbl(s,active){if(active)return'Aktywna';return{pending:'Oczekuje',approved:'Zatwierdzona',rejected:'Odrzucona'}[s]||s;}
function sdc(s,active){return active?'x':s==='pending'?'p':s==='approved'?'a':'r';}
function bdcls(s,active){return active?'bdx':s==='pending'?'bdp':s==='approved'?'bda':'bdr';}
function canEditNextWeek(){return new Date().getDay()>=3;}
function toast(msg,type='ok'){const el=document.getElementById('toast');el.textContent=msg;el.className='show t'+type;clearTimeout(el._t);el._t=setTimeout(()=>el.className='',3200);}
function daysUntil(dateStr){const d=new Date(dateStr);const now=new Date();now.setHours(0,0,0,0);return Math.ceil((d-now)/(1000*60*60*24));}

let CU=null, weekOff=0, timerInt=null, saleRegVal=true, salePhotoData=null, currentPanel='';
let FIREBASE_MODE = false;

// ═══════════════════════════════════════════
// FIREBASE SYNC
// ═══════════════════════════════════════════
async function fbSave(coll, docId, data){
  if(!FIREBASE_MODE){saveLocal();return;}
  try{const {db,doc,setDoc}=window._FB;await setDoc(doc(db,coll,docId),data);}
  catch(e){console.error('FB save:',e);saveLocal();}
}
async function fbGet(collName){
  if(!FIREBASE_MODE)return null;
  try{const {db,collection,getDocs}=window._FB;const snap=await getDocs(collection(db,collName));return snap.docs.map(d=>({id:d.id,...d.data()}));}
  catch(e){console.error('FB get:',e);return null;}
}
async function fbDelete(collName,docId){
  if(!FIREBASE_MODE){saveLocal();return;}
  try{const {db,doc,deleteDoc}=window._FB;await deleteDoc(doc(db,collName,docId));}
  catch(e){console.error('FB del:',e);}
}
async function loadFromFirebase(){
  const [users,locations,mechanisms,actions,pending,stock]=await Promise.all([
    fbGet('users'),fbGet('locations'),fbGet('mechanisms'),
    fbGet('actions'),fbGet('pendingAccounts'),fbGet('stock')
  ]);
  if(users&&users.length) DB.users=users;
  if(locations&&locations.length) DB.locations=locations;
  if(mechanisms&&mechanisms.length) DB.mechanisms=mechanisms;
  if(actions) DB.actions=actions||[];
  if(pending) DB.pendingAccounts=pending||[];
  if(stock) DB.stock=stock||[];
  if(CU){const fresh=DB.users.find(u=>u.id===CU.id);if(fresh)Object.assign(CU,fresh);}
}
async function saveUser(u){await fbSave('users',u.id,u);saveLocal();}
async function saveAction(a){await fbSave('actions',a.id,a);saveLocal();}
async function saveLocation(l){await fbSave('locations',l.id,l);saveLocal();}
async function saveMechanism(m){await fbSave('mechanisms',m.id,m);saveLocal();}
async function savePending(p){await fbSave('pendingAccounts',p.id,p);saveLocal();}

function switchAuthTab(tab){
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('auth-login-panel').style.display=tab==='login'?'block':'none';
  document.getElementById('auth-register-panel').style.display=tab==='register'?'block':'none';
}

async function doLogin(){
  const email=document.getElementById('login-email').value.trim().toLowerCase();
  const pass=document.getElementById('login-pass').value;
  const err=document.getElementById('login-err');
  err.className='alert alert-err';
  if(FIREBASE_MODE){
    try{
      const {auth,signInWithEmailAndPassword,db,doc,getDoc}=window._FB;
      const cred=await signInWithEmailAndPassword(auth,email,pass);
      const uid=cred.user.uid;
      const snap=await getDoc(doc(db,'users',uid));
      if(!snap.exists()){err.innerHTML='Nie znaleziono profilu';err.className='alert alert-err show';return;}
      const uData={id:uid,...snap.data()};
      if(uData.status==='pending'){err.innerHTML='Konto czeka na zatwierdzenie';err.className='alert alert-err show';return;}
      if(uData.status==='blocked'){err.innerHTML='Konto zostało zablokowane';err.className='alert alert-err show';return;}
      CU=uData;
      await loadFromFirebase();
      enterApp();
    }catch(e){err.innerHTML='Nieprawidłowy e-mail lub hasło';err.className='alert alert-err show';}
  } else {
    const u=DB.users.find(u=>u.email.toLowerCase()===email&&u.pass===pass);
    if(!u){err.innerHTML='Nieprawidłowy e-mail lub hasło';err.className='alert alert-err show';return;}
    if(u.status==='pending'){err.innerHTML='Konto czeka na zatwierdzenie';err.className='alert alert-err show';return;}
    if(u.status==='blocked'){err.innerHTML='Konto zostało zablokowane';err.className='alert alert-err show';return;}
    CU=u;enterApp();
  }
}

async function doRegister(){
  const first=document.getElementById('reg-first').value.trim();
  const last=document.getElementById('reg-last').value.trim();
  const email=document.getElementById('reg-email').value.trim().toLowerCase();
  const pass=document.getElementById('reg-pass').value;
  const err=document.getElementById('reg-err'),ok=document.getElementById('reg-ok');
  err.className='alert alert-err';ok.className='alert alert-ok';
  if(!first||!last){err.innerHTML='Podaj imię i nazwisko';err.className='alert alert-err show';return;}
  if(!email||!email.includes('@')){err.innerHTML='Podaj prawidłowy e-mail';err.className='alert alert-err show';return;}
  if(pass.length<6){err.innerHTML='Hasło min. 6 znaków';err.className='alert alert-err show';return;}
  if(DB.users.find(u=>u.email.toLowerCase()===email)){err.innerHTML='E-mail już zarejestrowany';err.className='alert alert-err show';return;}
  if(DB.pendingAccounts.find(p=>p.email.toLowerCase()===email)){err.innerHTML='To konto już oczekuje';err.className='alert alert-err show';return;}
  const p={id:'PA'+Date.now(),firstName:first,lastName:last,email,pass,role:'ambassador',svId:null,status:'pending',color:'#4f8ef7',createdAt:Date.now()};
  DB.pendingAccounts.push(p);
  await savePending(p);
  updateNotifDot();
  ok.innerHTML='Konto utworzone — czeka na zatwierdzenie przez koordynatora.';
  ok.className='alert alert-ok show';
  ['reg-first','reg-last','reg-email','reg-pass'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
}

function enterApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.cssText='display:flex;flex-direction:column;';
  const av=document.getElementById('topbar-av');
  av.textContent=ini(CU);
  av.style.cssText=`background:${CU.color}22;color:${CU.color};border:1px solid ${CU.color}44`;
  document.getElementById('topbar-nm').textContent=fullName(CU);
  const bar=document.getElementById('fb-status-bar');
  if(FIREBASE_MODE){bar.innerHTML=`<div class="fb-bar ok">Firebase aktywny — dane synchronizowane</div>`;}
  else{bar.innerHTML=`<div class="fb-bar">Tryb demo — dane lokalne (localStorage)</div>`;}
  if(!CU.role)CU.role='ambassador';
  buildNav();updateNotifDot();
  showPanel(CU.role==='coordinator'?'coord-dashboard':'amb-dashboard');
}

async function logout(){
  CU=null;weekOff=0;
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  if(FIREBASE_MODE){try{await window._FB.signOut(window._FB.auth);}catch(e){}}
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('login-email').value='';
  document.getElementById('login-pass').value='';
  document.getElementById('login-err').className='alert alert-err';
}

function buildNav(){
  const tabs=CU.role==='coordinator'?COORD_TABS:AMB_TABS;
  const pAcc=DB.pendingAccounts.length;
  const pAct=DB.actions.filter(a=>a.status==='pending').length;
  const bnavTabs=tabs.slice(0,3);
  const moreTabs=tabs.slice(3);
  let bnavHtml=bnavTabs.map(t=>{const n=t.id==='coord-accounts'?pAcc:t.id==='coord-approvals'?pAct:0;const bdg=n>0?`<span class="bnav-bdg">${n}</span>`:'';return`<button class="bnav-btn" id="bn-${t.id}" onclick="showPanel('${t.id}')"><span class="bnav-ico">${t.ico}</span>${t.lbl}${bdg}</button>`;}).join('');
  if(moreTabs.length){const moreBadge=moreTabs.reduce((s,t)=>{if(t.id==='coord-accounts')return s+pAcc;if(t.id==='coord-approvals')return s+pAct;return s;},0);bnavHtml+=`<button class="bnav-btn" id="bn-more" onclick="toggleMoreMenu()"><span class="bnav-ico">...</span>Więcej${moreBadge>0?`<span class="bnav-bdg">${moreBadge}</span>`:''}</button>`;}
  document.getElementById('bnav').innerHTML=bnavHtml;
  let s=`<div class="snav-section">Menu</div>`;
  tabs.forEach(t=>{const n=t.id==='coord-accounts'?pAcc:t.id==='coord-approvals'?pAct:0;const bdg=n>0?`<span class="snav-badge">${n}</span>`:'';s+=`<button class="snav-btn" id="sn-${t.id}" onclick="showPanel('${t.id}')"><span class="snav-ico">${t.ico}</span>${t.lbl}${bdg}</button>`;});
  s+=`<div class="snav-section" style="margin-top:10px">Eksport</div>`;
  s+=`<button class="snav-btn" onclick="exportExcel()"><span class="snav-ico">XLS</span>Pobierz Excel</button>`;
  document.getElementById('sidebar').innerHTML=s;
}

function toggleMoreMenu(){
  const menu=document.getElementById('more-menu');if(!menu)return;
  if(menu.classList.contains('open')){menu.classList.remove('open');return;}
  const tabs=CU.role==='coordinator'?COORD_TABS:AMB_TABS;
  const moreTabs=tabs.slice(3);
  const pAcc=DB.pendingAccounts.length;
  const pAct=DB.actions.filter(a=>a.status==='pending').length;
  menu.innerHTML=moreTabs.map(t=>{const n=t.id==='coord-accounts'?pAcc:t.id==='coord-approvals'?pAct:0;const isActive=currentPanel===t.id;return`<div class="more-item${isActive?' active':''}" onclick="showPanel('${t.id}');closeMoreMenu()"><span class="more-item-ico">${t.ico}</span>${t.lbl}${n>0?`<span class="more-bdg">${n}</span>`:''}</div>`;}).join('');
  menu.classList.add('open');
  setTimeout(()=>document.addEventListener('click',closeMoreOnOutside,{once:true}),10);
}
function closeMoreMenu(){document.getElementById('more-menu')?.classList.remove('open');}
function closeMoreOnOutside(e){const menu=document.getElementById('more-menu');const btn=document.getElementById('bn-more');if(menu&&!menu.contains(e.target)&&e.target!==btn)menu.classList.remove('open');}

function setNav(id){
  document.querySelectorAll('.bnav-btn,.snav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('bn-'+id)?.classList.add('active');
  document.getElementById('sn-'+id)?.classList.add('active');
}
function updateNotifDot(){
  const count=DB.pendingAccounts.length;
  const dot=document.getElementById('notif-dot');
  if(dot)dot.style.display=count>0?'block':'none';
}
function showPanel(id){
  currentPanel=id;setNav(id);buildNav();updateNotifDot();

}

function getUserStock(userId){
  return DB.stock.filter(s=>s.userId===userId);
}
function getTotalByProduct(userId, productId){
  // total packs for this product
  return getUserStock(userId).filter(s=>s.productId===productId).reduce((sum,s)=>sum+(s.quantity||0),0);
}
function getOpenedPacks(userId){
  return DB.stock.filter(s=>s.userId===userId&&s.isOpen&&!s.isConsumed);
}
function getExpiringPacks(userId){
  const today=new Date();today.setHours(0,0,0,0);
  return getOpenedPacks(userId).filter(s=>{
    if(!s.expiresAt)return false;
    const days=daysUntil(s.expiresAt);
    return days<=3&&days>0;
  });
}
function getExpiredPacks(userId){
  return getOpenedPacks(userId).filter(s=>{
    if(!s.expiresAt)return false;
    return daysUntil(s.expiresAt)<=0;
  });
}
function stockSummary(userId){
  const myStock=getUserStock(userId);
  const byProduct={};
  ALL_PRODUCTS.forEach(p=>{
    const packs=myStock.filter(s=>s.productId===p.id);
    const openedPacks=packs.filter(s=>s.isOpen&&!s.isConsumed);
    const closedPacks=packs.filter(s=>!s.isOpen&&!s.isConsumed);
    const totalPacks=openedPacks.length+closedPacks.length;
    const totalSticks=closedPacks.length*p.sticksPer+openedPacks.reduce((s,pk)=>s+(pk.sticksLeft||p.sticksPer),0);
    if(totalPacks>0||true){
      byProduct[p.id]={product:p,openedPacks,closedPacks,totalPacks,totalSticks};
    }
  });
  return byProduct;
}

function renderAmbStock(){
  const summary=stockSummary(CU.id);
  const expiring=getExpiringPacks(CU.id);
  const expired=getExpiredPacks(CU.id);
  let h=`<div class="section-hd hd-row"><div><div class="page-title">Stany Magazynowe</div><div class="page-sub">Twoje zapasy produktów</div></div><button class="btn btn-primary btn-sm" onclick="openAddStockModal()">+ Dodaj zapasy</button></div>`;

  if(expired.length){
    h+=`<div style="background:var(--red-l);border:1px solid var(--red);border-left:3px solid var(--red);padding:10px 12px;font-size:12px;margin-bottom:14px;border-radius:var(--r);color:var(--red);font-weight:600">⚠️ ${expired.length} otwarta paczka przekroczyła termin ważności (${PACK_EXPIRY_DAYS} dni)!</div>`;
  }
  if(expiring.length){
    h+=`<div style="background:var(--yellow-l);border:1px solid var(--yellow);border-left:3px solid var(--yellow);padding:10px 12px;font-size:12px;margin-bottom:14px;border-radius:var(--r);color:var(--yellow)">⏰ ${expiring.length} paczka wkrótce wygaśnie!</div>`;
  }

  // Podsumowanie totalne
  const allStock=getUserStock(CU.id);
  const totalClosed=allStock.filter(s=>!s.isOpen&&!s.isConsumed).length;
  const totalOpen=allStock.filter(s=>s.isOpen&&!s.isConsumed).length;
  h+=`<div class="stats-grid" style="margin-bottom:16px">
    <div class="stat-card"><div class="stat-lbl">Łącznie paczek</div><div class="stat-val">${totalClosed+totalOpen}</div></div>
    <div class="stat-card"><div class="stat-lbl">Otwarte</div><div class="stat-val" style="color:var(--green)">${totalOpen}</div></div>
    <div class="stat-card"><div class="stat-lbl">Zamknięte</div><div class="stat-val">${totalClosed}</div></div>
  </div>`;

  // ID sticks section
  const idProds=ID_STICKS.map(p=>({...summary[p.id],product:p})).filter(x=>x.totalPacks>0);
  const isenziaProds=ISENZIA_INSERTS.map(p=>({...summary[p.id],product:p})).filter(x=>x.totalPacks>0);

  if(idProds.length===0&&isenziaProds.length===0){
    h+=`<div class="card" style="text-align:center;padding:32px;color:var(--muted)">Brak produktów w magazynie.<br><br><button class="btn btn-primary btn-sm" onclick="openAddStockModal()">+ Dodaj zapasy</button></div>`;
    return h;
  }

  if(idProds.length){
    h+=`<div class="stock-section-title">🚬 Wkłady iD (${idProds.reduce((s,x)=>s+x.totalPacks,0)} paczek)</div>`;
    h+=renderStockGrid(idProds);
  }
  if(isenziaProds.length){
    h+=`<div class="stock-section-title">🌿 Wkłady iSenzia (${isenziaProds.reduce((s,x)=>s+x.totalPacks,0)} paczek)</div>`;
    h+=renderStockGrid(isenziaProds);
  }

  // Otwarte paczki z terminami
  const openedAll=getOpenedPacks(CU.id);
  if(openedAll.length){
    h+=`<div class="stock-section-title">📦 Otwarte paczki</div>`;
    openedAll.sort((a,b)=>new Date(a.expiresAt||'9999')-new Date(b.expiresAt||'9999')).forEach(pack=>{
      const prod=getProd(pack.productId);
      const days=pack.expiresAt?daysUntil(pack.expiresAt):null;
      const isExpired=days!==null&&days<=0;
      const isExpiring=days!==null&&days>0&&days<=3;
      const cls=isExpired?'expired-pack':isExpiring?'expiring-pack':'open-pack';
      const pct=Math.round(((pack.sticksLeft||prod?.sticksPer||20)/(prod?.sticksPer||20))*100);
      h+=`<div class="stock-item ${cls}">
        <div class="si-icon">${prod?.emoji||'📦'}</div>
        <div class="si-info">
          <div class="si-name">${prod?.name||'?'}</div>
          <div class="si-meta">Otwarto: ${pack.openedAt||'?'}${pack.expiresAt?` — Termin: ${pack.expiresAt}`:''}</div>
          <div class="progress-bar"><div class="progress-fill${pct<30?' critical':pct<60?' low':''}" style="width:${pct}%"></div></div>
          ${isExpired?`<div class="expiry-expired">⚠️ Termin minął!</div>`:isExpiring?`<div class="expiry-warn">⏰ Wygasa za ${days} dni!</div>`:''}
        </div>
        <div class="si-right">
          <div class="si-count" style="color:${isExpired?'var(--red)':isExpiring?'var(--yellow)':'var(--green)'}">${pack.sticksLeft??prod?.sticksPer??20}</div>
          <div class="si-total">wkładów</div>
          <button class="btn btn-ghost btn-xs" style="margin-top:6px" onclick="openSamplingModal('${pack.id}')">Sampling</button>
        </div>
      </div>`;
    });
  }
  return h;
}

function renderStockGrid(items){
  let h=`<div class="prod-grid">`;
  items.forEach(({product,openedPacks,closedPacks,totalPacks,totalSticks})=>{
    const hasOpen=openedPacks.length>0;
    h+=`<div class="prod-card" onclick="openProductStockDetail('${product.id}')">
      <span class="stock-badge ${hasOpen?'sb-open':'sb-closed'}">${hasOpen?'Otwarta':'Zamknięta'}</span>
      <div class="prod-img-placeholder" style="background:${product.color}22;border-color:${product.color}44;font-size:30px">${product.emoji}</div>
      <div class="prod-name">${product.name}</div>
      <div class="prod-brand">${product.brand}</div>
      <div class="prod-stock">
        <div>
          <span class="prod-count" style="color:${product.color}">${totalPacks}</span>
          <span class="prod-unit"> paczek</span>
        </div>
        <span style="font-size:10px;color:var(--muted)">${totalSticks} wkł.</span>
      </div>
    </div>`;
  });
  return h+`</div>`;
}

function openProductStockDetail(productId){
  const prod=getProd(productId);
  const myStock=DB.stock.filter(s=>s.userId===CU.id&&s.productId===productId&&!s.isConsumed);
  const open=myStock.filter(s=>s.isOpen);
  const closed=myStock.filter(s=>!s.isOpen);
  document.getElementById('modal-ttl').textContent=`${prod.emoji} ${prod.name}`;
  let b=`<div class="dbox">
    <div class="drow"><span class="dk2">Marka</span><span class="dv">${prod.brand}</span></div>
    <div class="drow"><span class="dk2">Paczki łącznie</span><span class="dv">${myStock.length}</span></div>
    <div class="drow"><span class="dk2">Otwarte</span><span class="dv" style="color:var(--green)">${open.length}</span></div>
    <div class="drow"><span class="dk2">Zamknięte</span><span class="dv">${closed.length}</span></div>
  </div>`;
  if(closed.length){
    b+=`<div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px">ZAMKNIĘTE PACZKI</div>`;
    closed.forEach(pack=>{
      b+=`<div class="stock-item closed-pack" style="margin-bottom:6px">
        <div class="si-icon">${prod.emoji}</div>
        <div class="si-info"><div class="si-name">Paczka #${pack.id.slice(-4)}</div><div class="si-meta">${prod.sticksPer} wkładów</div></div>
        <div class="si-right">
          <button class="btn btn-orange btn-xs" onclick="openPackModal('${pack.id}')">Otwórz</button>
        </div>
      </div>`;
    });
  }
  if(open.length){
    b+=`<div style="font-size:11px;font-weight:700;color:var(--muted);margin:10px 0 8px">OTWARTE PACZKI</div>`;
    open.forEach(pack=>{
      const days=pack.expiresAt?daysUntil(pack.expiresAt):null;
      const isExpired=days!==null&&days<=0;
      const isExpiring=days!==null&&days>0&&days<=3;
      b+=`<div class="stock-item open-pack${isExpired?' expired-pack':isExpiring?' expiring-pack':''}" style="margin-bottom:6px">
        <div class="si-icon">${prod.emoji}</div>
        <div class="si-info">
          <div class="si-name">Paczka #${pack.id.slice(-4)}</div>
          <div class="si-meta">Otwarto: ${pack.openedAt||'?'} | Termin: ${pack.expiresAt||'?'}</div>
          ${isExpired?`<div class="expiry-expired">⚠️ Termin minął!</div>`:isExpiring?`<div class="expiry-warn">⏰ Za ${days} dni!</div>`:''}
        </div>
        <div class="si-right">
          <div class="si-count" style="color:var(--green)">${pack.sticksLeft??prod.sticksPer}</div>
          <div class="si-total">wkładów</div>
          <button class="btn btn-ghost btn-xs" style="margin-top:6px" onclick="closeModal();openSamplingModal('${pack.id}')">Sampling</button>
        </div>
      </div>`;
    });
  }
  b+=`<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="closeModal();openAddStockModal('${productId}')">+ Dodaj paczki</button><button class="btn btn-ghost btn-sm" onclick="closeModal()">Zamknij</button></div>`;
  document.getElementById('modal-body').innerHTML=b;
  openModal();
}

  openModal();
}

async function submitAddStock(){
  const productId=document.getElementById('stock-prod').value;
  const qty=parseInt(document.getElementById('stock-qty').value)||1;
  const prod=getProd(productId);
  if(!prod){toast('Wybierz produkt','terr');return;}
  for(let i=0;i<qty;i++){
    const s={id:uid(),userId:CU.id,productId,isOpen:false,isConsumed:false,sticksLeft:prod.sticksPer,openedAt:null,expiresAt:null,addedAt:dk(new Date())};

function openSamplingModal(packId){
  const pack=DB.stock.find(s=>s.id===packId);
  if(!pack){toast('Nie znaleziono paczki','terr');return;}
  const prod=getProd(pack.productId);
  if(!pack.isOpen){

  const sticksLeft=pack.sticksLeft??prod?.sticksPer??20;
  document.getElementById('modal-ttl').textContent='Sampling — '+prod?.name;
  document.getElementById('modal-body').innerHTML=`
    <div class="sampling-card">
      <div class="sampling-card-title">🎯 Sampling aktywny</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="font-size:36px">${prod?.emoji||'📦'}</div>
        <div>

          <div style="font-size:12px;color:var(--text2)">${prod?.brand}</div>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div style="font-family:var(--mono);font-size:28px;font-weight:700;color:var(--green)">${sticksLeft}</div>

      <select class="fc" id="sampling-count">
        ${Array.from({length:Math.min(sticksLeft,10)},(_,i)=>`<option value="${i+1}">${i+1} wkład${i===0?'':i<4?'y':'ów'}</option>`).join('')}
      </select>

  openModal();
}

async function confirmSampling(packId){
  const pack=DB.stock.find(s=>s.id===packId);
  if(!pack)return;
  const prod=getProd(pack.productId);
  const count=parseInt(document.getElementById('sampling-count').value)||1;
  const sticksLeft=pack.sticksLeft??prod?.sticksPer??20;
  pack.sticksLeft=Math.max(0,sticksLeft-count);
  if(pack.sticksLeft===0){pack.isConsumed=true;}
  await saveStock(pack);
  closeModal();
  toast(`Sampling: -${count} wkładów. Zostało: ${pack.sticksLeft}`,'tgreen');
  showPanel('amb-stock');
}

function buildCalDay(day,idx,actions,isCoord,locked){
  const dateKey=dk(day),todHd=isToday(day)?'today-hd':'',todN=isToday(day)?'today':'';
  const mm=String(day.getMonth()+1).padStart(2,'0');
  const addFn=isCoord?`openCoordAddAction('${dateKey}')`:`openAddAction('${dateKey}')`;
  const addDis=(!isCoord&&(locked||actions.length>=2))?'disabled':'';
  let h=`<div class="cal-day"><div class="cal-hd ${todHd}"><div class="cal-hd-l"><div class="cal-num ${todN}">${day.getDate()}</div><div><div class="cal-day-name">${DAYS[idx]}</div><div class="cal-day-date">${mm}.${day.getFullYear()}</div></div></div><button class="btn btn-sm btn-primary" ${addDis} onclick="${addFn}">+ Dodaj</button></div>`;
  if(!actions.length){h+=`<div class="cal-empty">Brak akcji</div>`;}
  else{
    h+=`<div class="cal-slots">`;
    actions.forEach(a=>{
      const l=getL(a.locationId),u=getU(a.ambassadorId),active=a.startedAt&&!a.endedAt,sales=(a.sales||[]).length;
      h+=`<div class="slot s-${sdc(a.status,active)}" onclick="openDetail('${a.id}')"><div class="slot-body"><div class="slot-loc">${l?.address||'?'}</div><div class="slot-type">${l?.shopType||''}</div><div class="slot-meta"><span class="slot-time">${a.startTime}–${a.endTime}</span>${sales>0?`<span class="slot-sales-ct">${sales} sprzed.</span>`:''}${isCoord?`<span class="slot-amb" style="color:${u?.color||'#888'}">${fullName(u)}</span>`:''}<span class="slot-st">${slbl(a.status,active)}</span></div></div>${active?`<span class="live-tag">LIVE</span>`:''}</div>`;
    });
    h+=`</div>`;
  }
  return h+`</div>`;
}

function onLocChg(){const v=document.getElementById('al')?.value;const s=document.getElementById('nloc-sec');if(s)s.style.display=v==='__new__'?'block':'none';}

async function submitAddAction(dateKey,ambId){
  const locSel=document.getElementById('al').value;
  const numV=document.getElementById('an').value;
  const s=document.getElementById('as').value;
  const e=document.getElementById('ae2').value;
  const err=document.getElementById('ae');const inf=document.getElementById('ai');
  err.className='alert alert-err';inf.className='alert alert-info';
  const h=diffH(s,e);
  if(h<1||h>4){err.innerHTML=`Akcja musi trwać min. 1h i maks. 4h (${h.toFixed(1)}h)`;err.className='alert alert-err show';return;}
  if(t2m(e)<=t2m(s)){err.innerHTML='Godzina zakończenia musi być po starcie';err.className='alert alert-err show';return;}
  let locId=locSel;
  if(locSel==='__new__'){const addr=document.getElementById('nla')?.value.trim();const type=document.getElementById('nlt')?.value;const note=document.getElementById('nln')?.value.trim();if(!addr){err.innerHTML='Podaj adres lokalizacji';err.className='alert alert-err show';return;}locId=uid();const newLoc={id:locId,address:addr,shopType:type,note};DB.locations.push(newLoc);await saveLocation(newLoc);}
  const conflict=DB.actions.find(a=>a.date===dateKey&&a.locationId===locId&&!(t2m(e)<=t2m(a.startTime)||t2m(s)>=t2m(a.endTime)));
  if(conflict){const u2=getU(conflict.ambassadorId);inf.innerHTML=`Uwaga: ${fullName(u2)} pracuje na tym punkcie w ${conflict.startTime}–${conflict.endTime}`;inf.className='alert alert-info show';}
  const existing=DB.actions.filter(a=>a.ambassadorId===ambId&&a.date===dateKey);
  if(existing.length>=2){err.innerHTML='Maks. 2 akcje dziennie';err.className='alert alert-err show';return;}
  const newAction={id:uid(),ambassadorId:ambId,locationId:locId,date:dateKey,startTime:s,endTime:e,status:'pending',sales:[],actionNum:parseInt(numV),startedAt:null,endedAt:null,endReason:null};
  DB.actions.push(newAction);await saveAction(newAction);
  closeModal();toast('Akcja dodana — czeka na zatwierdzenie','tok');
  showPanel(CU.role==='coordinator'?'coord-schedule':'amb-schedule');
}

function openDetail(actionId){
  const a=DB.actions.find(x=>x.id===actionId);if(!a)return;
  const l=getL(a.locationId),u=getU(a.ambassadorId),active=a.startedAt&&!a.endedAt;
  const isC=CU.role==='coordinator',isMine=a.ambassadorId===CU.id;
  const todayKey=dk(new Date());
  const minsUntil=a.date===todayKey?t2m(a.startTime)-t2m(nowStr()):-1;
  const canStart=isMine&&a.status==='approved'&&a.date===todayKey&&!a.startedAt&&minsUntil<=30;
  const salesHtml=(a.sales||[]).map(sv=>{const m=getM(sv.mechanismId);return`<div class="sale-item">${sv.receiptData?`<img src="${sv.receiptData}" class="sale-receipt" alt="paragon">`:`<div class="sale-no-img">📄</div>`}<div><div class="sale-mech">${m?.name||'?'}</div><div class="sale-meta"><span class="reg-tag ${sv.registered?'reg-yes':'reg-no'}">${sv.registered?'Zarejestrowany':'Niezarejestrowany'}</span></div></div></div>`;}).join('');
  document.getElementById('modal-ttl').textContent='Szczegóły akcji';
  document.getElementById('modal-body').innerHTML=`
    ${isC?`<div class="qa-row">${a.status!=='approved'?`<button class="btn btn-green btn-sm" onclick="setActionStatus('${a.id}','approved')">Zatwierdź</button>`:''} ${a.status!=='rejected'?`<button class="btn btn-red btn-sm" onclick="setActionStatus('${a.id}','rejected')">Odrzuć</button>`:''} <button class="btn btn-ghost btn-sm" onclick="openEditAction('${a.id}')">Edytuj</button> <button class="btn btn-ghost btn-sm" onclick="confirmDeleteAction('${a.id}')">Usuń</button></div>`:''}
    <div class="dbox">
      <div class="drow"><span class="dk2">Lokalizacja</span><span class="dv">${l?.shopType||'?'}</span></div>
      <div class="drow"><span class="dk2">Adres</span><span class="dv" style="font-size:11px">${l?.address||'?'}</span></div>
      ${l?.note?`<div class="drow"><span class="dk2">Uwagi</span><span class="dv" style="font-size:11px;color:var(--muted)">${l.note}</span></div>`:''}
      <div class="drow"><span class="dk2">Data</span><span class="dv" style="font-family:var(--mono)">${a.date}</span></div>
      <div class="drow"><span class="dk2">Godziny</span><span class="dv" style="font-family:var(--mono)">${a.startTime} – ${a.endTime}</span></div>
      <div class="drow"><span class="dk2">Ambasador</span><span class="dv" style="color:${u?.color||'inherit'}">${fullName(u)}</span></div>
      <div class="drow"><span class="dk2">Status</span><span class="badge ${bdcls(a.status,active)}">${slbl(a.status,active)}</span></div>
      <div class="drow"><span class="dk2">Sprzedaże</span><span class="dv" style="color:var(--green)">${(a.sales||[]).length}</span></div>
      ${a.endReason?`<div class="drow"><span class="dk2">Powód zakończenia</span><span class="dv" style="font-size:11px">${a.endReason}</span></div>`:''}
    </div>
    ${salesHtml?`<div style="margin-bottom:14px"><div class="card-title" style="margin-bottom:8px">Sprzedaże</div>${salesHtml}</div>`:''}
    ${canStart?`<button class="btn btn-green btn-block" style="margin-bottom:8px" onclick="startAction('${a.id}')">Rozpocznij akcję</button>`:''}
    ${isMine&&active?`<button class="btn btn-red btn-block" style="margin-bottom:8px" onclick="openEndActionModal('${a.id}')">■ Zakończ akcję</button>`:''}
    ${isMine&&active?`<button class="btn btn-primary btn-block" style="margin-bottom:8px" onclick="closeModal();showPanel('amb-actions')">Dodaj sprzedaż</button>`:''}
    ${!isC&&a.status==='pending'?`<button class="btn btn-ghost btn-block" style="margin-bottom:8px" onclick="confirmDeleteAction('${a.id}')">Usuń akcję</button>`:''}
    <button class="btn btn-ghost btn-block" onclick="closeModal()">Zamknij</button>`;
  openModal();
}

async function setActionStatus(id,st){
  const a=DB.actions.find(x=>x.id===id);
  if(a){a.status=st;await saveAction(a);}
  closeModal();toast(st==='approved'?'Akcja zatwierdzona':'Akcja odrzucona',st==='approved'?'tgreen':'terr');
  showPanel('coord-approvals');
}

async function confirmDeleteAction(id){
  if(!confirm('Usunąć tę akcję?'))return;
  await delAction(id);closeModal();toast('Usunięto','twarn');
  showPanel(CU.role==='coordinator'?'coord-schedule':'amb-schedule');
}

async function startAction(id){
  const a=DB.actions.find(x=>x.id===id);if(!a)return;
  a.startedAt=Date.now();await saveAction(a);
  closeModal();toast('Akcja rozpoczęta ▶','tgreen');showPanel('amb-actions');
}

function openEndActionModal(actionId){
  const a=DB.actions.find(x=>x.id===actionId);if(!a)return;
  const nw=nowStr();const earlyEnd=t2m(nw)<t2m(a.endTime);
  document.getElementById('modal-ttl').textContent='Zakończ akcję';
  document.getElementById('modal-body').innerHTML=`
    <div style="background:var(--yellow-l);border:1px solid #3a2a07;border-left:3px solid var(--yellow);padding:9px 12px;font-size:12px;margin-bottom:14px;border-radius:var(--r)">Planowe zakończenie: <strong>${a.endTime}</strong>${earlyEnd?` — <strong style="color:var(--yellow)">Kończysz wcześniej</strong>`:''}</div>
    ${earlyEnd?`<div class="fg"><label class="fl">Powód wcześniejszego zakończenia *</label><select class="fc" id="end-reason-sel"><option value="">Wybierz powód...</option><option>Osiągnięto cel sprzedażowy</option><option>Brak klientów</option><option>Problem z punktem sprzedaży</option><option>Choroba / złe samopoczucie</option><option>Decyzja koordynatora</option><option>Inne</option></select></div><div class="fg" id="end-other-wrap" style="display:none"><label class="fl">Opisz powód</label><input type="text" class="fc" id="end-reason-txt" placeholder="Wpisz powód..."></div>`:`<div class="fg"><label class="fl">Notatka (opcjonalna)</label><input type="text" class="fc" id="end-note" placeholder="np. plan zrealizowany"></div>`}
    <div class="btn-row"><button class="btn btn-red" style="flex:1" onclick="submitEndAction('${actionId}',${earlyEnd})">■ Tak, zakończ</button><button class="btn btn-ghost" onclick="closeModal()">Anuluj</button></div>`;
  document.getElementById('end-reason-sel')?.addEventListener('change',function(){const w=document.getElementById('end-other-wrap');if(w)w.style.display=this.value==='Inne'?'block':'none';});
  openModal();
}

async function submitEndAction(actionId,earlyEnd){
  const a=DB.actions.find(x=>x.id===actionId);if(!a)return;
  let reason='';
  if(earlyEnd){const sel=document.getElementById('end-reason-sel');if(!sel?.value){toast('Wybierz powód zakończenia','terr');return;}reason=sel.value==='Inne'?(document.getElementById('end-reason-txt')?.value||'Inne'):sel.value;}
  else{reason=document.getElementById('end-note')?.value||'';}
  a.endedAt=Date.now();a.endReason=reason;await saveAction(a);
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  closeModal();toast('Akcja zakończona','twarn');showPanel('amb-stats');
}

function openAddSaleModal(actionId){
  saleRegVal=true;salePhotoData=null;
  const mechs=DB.mechanisms.filter(m=>m.active);
  if(!mechs.length){toast('Brak aktywnych mechanizmów','terr');return;}
  document.getElementById('modal-ttl').textContent='Dodaj sprzedaż';
  document.getElementById('modal-body').innerHTML=`
    <div id="sale-err" class="alert alert-err"></div>
    <div class="fg"><label class="fl">Czy udała się sprzedaż?</label><div class="toggle-row"><div class="tog-opt sel" id="tog-yes" onclick="selSaleResult(true)">✓ Tak</div><div class="tog-opt" id="tog-no" onclick="selSaleResult(false)">✗ Nie</div></div></div>
    <div id="sale-details">
      <div class="fg"><label class="fl">Mechanizm sprzedaży</label><select class="fc" id="sale-mech"><option value="">Wybierz mechanizm...</option>${mechs.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div>
      <div class="fg"><label class="fl">Klient zarejestrowany?</label><div class="toggle-row"><div class="tog-opt sel" id="tog-reg-yes" onclick="selReg(true)">Tak</div><div class="tog-opt" id="tog-reg-no" onclick="selReg(false)">Nie</div></div></div>
      <div class="fg"><label class="fl">Zdjęcie paragonu</label>
        <div class="photo-area" id="photo-area"><input type="file" id="receipt-inp" accept="image/*" capture="environment" onchange="handlePhoto(event)">
        <div id="photo-ph" style="pointer-events:none"><div style="font-size:12px;font-weight:600;color:var(--text2)">📷 Zrób zdjęcie lub wybierz z galerii</div><div style="font-size:10px;color:var(--muted);margin-top:4px">Dotknij aby dodać</div></div>
        <img id="photo-preview" alt=""></div>
        <div class="fhint">Wymagane do zatwierdzenia sprzedaży</div>
      </div>
    </div>
    <div class="btn-row"><button class="btn btn-green" style="flex:1" onclick="submitSale('${actionId}')">Zapisz sprzedaż</button><button class="btn btn-ghost" onclick="closeModal()">Anuluj</button></div>`;
  openModal();
}

function selSaleResult(v){document.getElementById('tog-yes').className='tog-opt'+(v?' sel':'');document.getElementById('tog-no').className='tog-opt'+(!v?' sel':'');document.getElementById('sale-details').style.display=v?'block':'none';}
function selReg(v){saleRegVal=v;document.getElementById('tog-reg-yes').className='tog-opt'+(v?' sel':'');document.getElementById('tog-reg-no').className='tog-opt'+(!v?' sel':'');}
function handlePhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{salePhotoData=ev.target.result;const prev=document.getElementById('photo-preview');const ph=document.getElementById('photo-ph');if(prev){prev.src=salePhotoData;prev.style.display='block';}if(ph)ph.style.display='none';};r.readAsDataURL(f);}

async function submitSale(actionId){
  const mechId=document.getElementById('sale-mech')?.value;
  const err=document.getElementById('sale-err');err.className='alert alert-err';
  const sold=document.getElementById('tog-yes')?.classList.contains('sel');
  if(sold&&!mechId){err.innerHTML='Wybierz mechanizm sprzedaży';err.className='alert alert-err show';return;}
  if(sold&&!salePhotoData){err.innerHTML='Dodaj zdjęcie paragonu';err.className='alert alert-err show';return;}
  const a=DB.actions.find(x=>x.id===actionId);if(!a)return;
  if(!a.sales)a.sales=[];
  a.sales.push({id:uid(),mechanismId:mechId||null,registered:saleRegVal,receiptData:salePhotoData,sold,ts:Date.now()});
  await saveAction(a);
  closeModal();toast(`Sprzedaż zapisana. Łącznie: ${a.sales.length}`,'tgreen');showPanel('amb-actions');
}

function buildTimerCard(actionId){
  const a=DB.actions.find(x=>x.id===actionId);
  const l=getL(a?.locationId);
  const sc=(a.sales||[]).length;
  // Get open packs for sampling
  const openPacks=getOpenedPacks(a.ambassadorId||CU.id);
  return`<div class="timer-card">
    <div class="tc-lbl"><span class="tc-dot"></span>AKCJA W TOKU</div>
    <div class="tc-loc">${l?.shopType} — ${l?.address?.split(',')[0]} &nbsp; ${a.startTime}–${a.endTime}</div>
    <div class="tc-timer" id="tc-disp-${actionId}">00:00:00</div>
    <div class="tc-sc-row"><span class="tc-sc-lbl">Sprzedaże:</span><span class="tc-sc-val" id="tc-sales-${actionId}">${sc}</span></div>
    <div class="tc-action-btns">
      <button class="tc-add-sale" onclick="openAddSaleModal('${actionId}')">+ Sprzedaż</button>
      <button class="tc-sampling-btn" onclick="openSamplingFromTimer('${actionId}')">🎯 Sampling</button>
    </div>
    <button class="tc-end" onclick="openEndActionModal('${actionId}')">■ Zakończ akcję</button>
  </div>`;
}

function openSamplingFromTimer(actionId){
  const a=DB.actions.find(x=>x.id===actionId);if(!a)return;
  const ambId=a.ambassadorId||CU.id;
  const openPacks=getOpenedPacks(ambId);
  if(!openPacks.length){
    // No open packs — offer to open one
    document.getElementById('modal-ttl').textContent='Sampling — wybierz paczkę';
    const myStock=getUserStock(ambId).filter(s=>!s.isConsumed);
    const closedPacks=myStock.filter(s=>!s.isOpen);
    document.getElementById('modal-body').innerHTML=`
      <div style="background:var(--yellow-l);border:1px solid var(--yellow);border-left:3px solid var(--yellow);padding:10px 12px;font-size:12px;margin-bottom:14px;border-radius:var(--r);color:var(--yellow)">Nie masz żadnej otwartej paczki.</div>
      ${closedPacks.length?`<div style="font-size:12px;margin-bottom:10px">Otwórz nową paczkę:</div>${closedPacks.slice(0,5).map(p=>{const prod=getProd(p.productId);return`<div class="stock-item closed-pack" style="margin-bottom:8px"><div class="si-icon">${prod?.emoji||'📦'}</div><div class="si-info"><div class="si-name">${prod?.name||'?'}</div><div class="si-meta">${prod?.sticksPer||20} wkładów</div></div><button class="btn btn-orange btn-sm" onclick="closeModal();openPackModal('${p.id}')">Otwórz</button></div>`;}).join('')}`:'<div style="color:var(--muted);font-size:12px">Brak paczek w magazynie. Dodaj zapasy.</div>'}
      <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="closeModal()">Anuluj</button>`;
    openModal();return;
  }
  if(openPacks.length===1){openSamplingModal(openPacks[0].id);return;}
  // Multiple open packs — let user choose
  document.getElementById('modal-ttl').textContent='Sampling — wybierz paczkę';
  document.getElementById('modal-body').innerHTML=`
    <div style="font-size:12px;color:var(--text2);margin-bottom:12px">Wybierz paczkę do samplingu:</div>
    ${openPacks.map(pack=>{const prod=getProd(pack.productId);return`<div class="stock-item open-pack" style="margin-bottom:8px;cursor:pointer" onclick="closeModal();openSamplingModal('${pack.id}')"><div class="si-icon">${prod?.emoji||'📦'}</div><div class="si-info"><div class="si-name">${prod?.name||'?'}</div><div class="si-meta">Pozostało: ${pack.sticksLeft??prod?.sticksPer??20} wkładów${pack.expiresAt?` | Termin: ${pack.expiresAt}`:''}</div></div><span style="color:var(--accent);font-size:12px">Wybierz →</span></div>`;}).join('')}
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">Anuluj</button>`;
  openModal();
}

function checkTimer(){
  if(!CU)return;
  const active=DB.actions.find(a=>a.ambassadorId===CU.id&&a.startedAt&&!a.endedAt);
  if(!active)return;
  const tc=document.getElementById('ti-inject');if(!tc)return;
  tc.innerHTML=buildTimerCard(active.id);startTimerUI(active.id);
}

function startTimerUI(id){
  if(timerInt)clearInterval(timerInt);
  timerInt=setInterval(()=>{
    const a=DB.actions.find(x=>x.id===id);
    if(!a||!a.startedAt)return clearInterval(timerInt);
    const el=document.getElementById('tc-disp-'+id);
    if(el)el.textContent=fmtSec(Math.floor((Date.now()-a.startedAt)/1000));
    const sc=document.getElementById('tc-sales-'+id);
    if(sc)sc.textContent=(a.sales||[]).length;
  },1000);
}

function renderCoordDashboard(){
  const myAmbs=DB.users.filter(u=>u.role==='ambassador'&&u.status==='active');
  const pending=DB.actions.filter(a=>a.status==='pending');
  const activeNow=DB.actions.filter(a=>a.startedAt&&!a.endedAt);
  const todayActions=DB.actions.filter(a=>a.date===dk(new Date()));
  const pendingAcc=DB.pendingAccounts;

  const myActive=DB.actions.find(a=>a.ambassadorId===CU.id&&a.startedAt&&!a.endedAt);
  let h=`<div class="section-hd"><div class="page-title">Dashboard</div><div class="page-sub">Witaj, ${CU.firstName}</div></div>`;
  if(myActive){h+=`<div id="ti-inject">${buildTimerCard(myActive.id)}</div>`;setTimeout(()=>startTimerUI(myActive.id),80);}

  if(activeNow.length){
    h+=`<div class="card" style="margin-bottom:12px"><div class="card-title">Aktywne teraz (${activeNow.length})</div>`;
    activeNow.forEach(a=>{const u=getU(a.ambassadorId);const l=getL(a.locationId);const elapsed=Math.floor((Date.now()-a.startedAt)/1000);h+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)"><div class="av" style="background:${u?.color||'#4f8ef7'}22;color:${u?.color||'#4f8ef7'};border-color:${u?.color||'#4f8ef7'}44">${ini(u)}</div><div style="flex:1"><div style="font-size:12px;font-weight:700">${fullName(u)}</div><div style="font-size:11px;color:var(--muted)">${l?.shopType} — ${l?.address?.split(',')[0]}</div></div><div style="text-align:right"><div style="font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent)">${fmtSec(elapsed)}</div><div style="font-size:10px;color:var(--green)">${(a.sales||[]).length} sprzedaży</div></div></div>`;});

  if(pending.length){
    h+=`<div class="card"><div class="card-hd"><div class="card-title">Oczekuje (${pending.length})</div><button class="btn btn-ghost btn-sm" onclick="showPanel('coord-approvals')">Wszystkie →</button></div>`;
    pending.slice(0,5).forEach(a=>{const u=getU(a.ambassadorId);const l=getL(a.locationId);h+=`<div class="ap-row"><div class="ap-top"><div><div class="ap-title">${l?.shopType||'?'} — ${l?.address?.split(',')[0]||'?'}</div><div class="ap-sub" style="color:${u?.color}">${fullName(u)} — ${a.date} ${a.startTime}–${a.endTime}</div></div><div class="ap-btns"><button class="btn btn-green btn-xs" onclick="setActionStatus('${a.id}','approved')">✓</button><button class="btn btn-red btn-xs" onclick="setActionStatus('${a.id}','rejected')">✗</button></div></div></div>`;});

async function approveAccount(pendingId){
  const p=DB.pendingAccounts.find(x=>x.id===pendingId);if(!p)return;
  if(FIREBASE_MODE){
    try{
      const {authSecondary,createUserWithEmailAndPassword}=window._FB;
      const authToUse=authSecondary||window._FB.auth;
      const cred=await createUserWithEmailAndPassword(authToUse,p.email,p.pass);
      const uid=cred.user.uid;
      const newUser={id:uid,firstName:p.firstName,lastName:p.lastName,email:p.email,role:'ambassador',svId:p.svId||CU.id,status:'active',color:p.color||'#4f8ef7',createdAt:p.createdAt||Date.now()};
      DB.users.push(newUser);await saveUser(newUser);await delPending(pendingId);
    }catch(e){
      if(e.code==='auth/email-already-in-use'){
        const newUser={...p,id:'U'+Date.now(),status:'active',svId:p.svId||CU.id};delete newUser.pass;
        DB.users.push(newUser);await saveUser(newUser);await delPending(pendingId);
      }else{toast('Błąd: '+(e.message||e.code),'terr');return;}
    }
  }else{
    const newUser={...p,id:'U'+Date.now(),status:'active',svId:p.svId||CU.id};
    DB.users.push(newUser);await saveUser(newUser);await delPending(pendingId);
  }
  buildNav();updateNotifDot();
  toast(p.firstName+' '+p.lastName+' zatwierdzony','tgreen');showPanel('coord-accounts');
}

async function rejectAccount(pendingId){
  await delPending(pendingId);buildNav();updateNotifDot();
  toast('Konto odrzucone','terr');showPanel('coord-accounts');
}
