<style>
:root {
  /* ── DARK PALETTE ── */
  --bg:        #0f1117;
  --bg2:       #161b27;
  --bg3:       #1e2535;
  --white:     #1a2033;
  --border:    #252d3f;
  --border2:   #2f3a52;
  --text:      #e8eaf0;
  --text2:     #9aa5be;
  --muted:     #5a6480;
  --accent:    #4f8ef7;
  --accent-l:  #1a2a4a;
  --accent-d:  #3a72d8;
  --green:     #22c55e;
  --green-l:   #0d2a1a;
  --red:       #f05252;
  --red-l:     #2a0f0f;
  --yellow:    #f59e0b;
  --yellow-l:  #2a1f07;
  --r:         6px;
  --font:      'DM Sans', system-ui, sans-serif;
  --mono:      'JetBrains Mono', monospace;
  --topbar-h:  52px;
  --nav-h:     62px;
  --sidebar-w: 210px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100%;font-size:13px;line-height:1.5;}
button,select,input,textarea{font-family:var(--font);font-size:13px;}
img{max-width:100%;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}

/* ── AUTH ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);background-image:radial-gradient(ellipse at 20% 50%, #1a2a4a22 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, #0d2a1a22 0%, transparent 60%);}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:32px 28px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.5);}
.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.brand-mark{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;border-radius:8px;letter-spacing:-.3px;box-shadow:0 4px 12px rgba(79,142,247,.3);}
.brand-name{font-size:20px;font-weight:700;letter-spacing:-.5px;color:var(--text);}
.brand-sub{font-size:12px;color:var(--muted);margin-bottom:26px;padding-left:48px;}
.auth-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:22px;gap:4px;}
.auth-tab{flex:1;padding:9px 12px;border:none;background:none;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
.auth-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ── FORMS ── */
.fg{margin-bottom:14px;}
.fl{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.fc{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:var(--r);font-size:13px;transition:border-color .15s;-webkit-appearance:none;}
.fc:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,142,247,.15);}
.fc::placeholder{color:var(--muted);}
.fc option{background:var(--bg3);color:var(--text);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fhint{font-size:11px;color:var(--muted);margin-top:4px;}
.f-static{padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-weight:600;color:var(--text2);}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .12s;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(79,142,247,.25);}.btn-primary:hover:not(:disabled){background:var(--accent-d);box-shadow:0 4px 14px rgba(79,142,247,.35);}
.btn-green{background:var(--green);color:#000;}.btn-green:hover:not(:disabled){filter:brightness(1.1);}
.btn-red{background:var(--red);color:#fff;}.btn-red:hover:not(:disabled){filter:brightness(1.1);}
.btn-ghost{background:var(--bg3);border:1px solid var(--border);color:var(--text2);}.btn-ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-xs{padding:4px 9px;font-size:11px;}
.btn-block{width:100%;justify-content:center;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}

/* ── ALERTS ── */
.alert{padding:10px 12px;border-radius:var(--r);font-size:12px;margin-bottom:12px;display:none;line-height:1.5;border-left:3px solid;}
.alert.show{display:block;}
.alert-err{background:var(--red-l);color:#f87171;border-color:var(--red);}
.alert-info{background:var(--yellow-l);color:var(--yellow);border-color:var(--yellow);}
.alert-ok{background:var(--green-l);color:var(--green);border-color:var(--green);}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:200;height:var(--topbar-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;}
.tb-logo{display:flex;align-items:center;gap:9px;}
.tb-mark{width:26px;height:26px;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;border-radius:6px;}
.tb-name{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.3px;}
.tb-spacer{flex:1;}
.tb-right{display:flex;align-items:center;gap:8px;}
.tb-username{font-size:12px;font-weight:500;color:var(--text2);}
@media(max-width:480px){.tb-username{display:none;}}
.av{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;border-radius:6px;border:1px solid var(--border);}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:5px 10px;cursor:pointer;font-size:11px;font-weight:600;border-radius:var(--r);transition:all .12s;}
.logout-btn:hover{border-color:var(--red);color:var(--red);}
.notif-btn{position:relative;background:var(--bg3);border:1px solid var(--border);width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .12s;color:var(--text2);border-radius:var(--r);}
.notif-btn:hover{border-color:var(--accent);color:var(--accent);}
.notif-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--red);border-radius:50%;border:1.5px solid var(--bg2);}

/* ── FIREBASE STATUS BAR ── */
.fb-bar{background:var(--yellow-l);border-bottom:1px solid #3a2a07;padding:6px 16px;font-size:11px;color:var(--yellow);display:flex;align-items:center;gap:8px;}
.fb-bar.ok{background:var(--green-l);border-color:#0d2a1a;color:var(--green);}

/* ── SIDEBAR ── */
.sidebar{display:none;position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);padding:12px 8px;overflow-y:auto;z-index:100;}
.snav-section{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:8px 10px 4px;}
.snav-btn{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;padding:8px 10px;cursor:pointer;color:var(--text2);font-size:12px;font-weight:500;text-align:left;margin-bottom:2px;transition:all .12s;border-radius:var(--r);}
.snav-btn:hover{background:var(--bg3);color:var(--text);}
.snav-btn.active{background:var(--accent-l);color:var(--accent);font-weight:700;}
.snav-ico{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.snav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;min-width:18px;text-align:center;}
@media(min-width:768px){.sidebar{display:block;}.bnav{display:none!important;}.main-wrap{margin-left:var(--sidebar-w);}}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--bg2);border-top:1px solid var(--border);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom));}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;padding:5px 2px;color:var(--muted);font-size:9px;font-weight:600;position:relative;}
.bnav-btn.active{color:var(--accent);}
.bnav-ico{font-size:18px;line-height:1.2;}
.bnav-bdg{position:absolute;top:2px;right:8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:20px;min-width:15px;text-align:center;}

/* ── CONTENT ── */
.main-wrap{padding-bottom:calc(var(--nav-h) + 10px);}
@media(min-width:768px){.main-wrap{padding-bottom:24px;}}
.page{max-width:880px;margin:0 auto;padding:18px 14px;}
@media(min-width:600px){.page{padding:24px 20px;}}

/* ── CARD ── */
.card{background:var(--bg2);border:1px solid var(--border);padding:16px;border-radius:8px;}
.card+.card{margin-top:12px;}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);}

/* ── SECTION ── */
.section-hd{margin-bottom:18px;}
.page-title{font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--text);}
.page-sub{font-size:12px;color:var(--muted);margin-top:3px;}
.hd-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
@media(min-width:500px){.stats-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:800px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:var(--bg2);border:1px solid var(--border);padding:14px 16px;border-radius:8px;}
.stat-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px;}
.stat-val{font-size:24px;font-weight:700;letter-spacing:-.5px;font-family:var(--mono);}
.stat-s{font-size:10px;color:var(--muted);margin-top:2px;}

/* ── WEEK NAV ── */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.wk-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 13px;cursor:pointer;font-size:12px;font-weight:600;border-radius:var(--r);transition:all .12s;}
.wk-btn:hover{border-color:var(--accent);color:var(--accent);}
.wk-lbl{flex:1;font-size:12px;font-weight:600;color:var(--text2);}
.wk-tag{display:inline-flex;padding:3px 9px;background:var(--accent-l);color:var(--accent);font-size:10px;font-weight:700;border:1px solid #1e3a6a;border-radius:20px;}
.wk-tag.next{background:var(--yellow-l);color:var(--yellow);border-color:#3a2a07;}

/* ── CALENDAR ── */
.cal-list{display:flex;flex-direction:column;gap:10px;}
.cal-day{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.cal-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--border);}
.cal-hd.today-hd{background:var(--accent-l);border-bottom-color:#1e3a6a;}
.cal-hd-l{display:flex;align-items:center;gap:10px;}
.cal-num{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:1px solid var(--border);flex-shrink:0;background:var(--bg2);border-radius:6px;}
.cal-num.today{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,142,247,.3);}
.cal-day-name{font-size:13px;font-weight:600;}
.cal-day-date{font-size:10px;color:var(--muted);}
.cal-slots{padding:8px 12px;display:flex;flex-direction:column;gap:6px;}
.cal-empty{padding:12px;text-align:center;font-size:12px;color:var(--muted);}

/* ── SLOT ── */
.slot{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--bg3);border:1px solid var(--border);cursor:pointer;transition:all .12s;border-left-width:3px;border-radius:6px;}
.slot:hover{border-color:var(--accent);background:var(--bg2);}
.slot.s-pending{border-left-color:var(--yellow);}
.slot.s-approved{border-left-color:var(--green);}
.slot.s-rejected{border-left-color:var(--red);opacity:.55;}
.slot.s-active{border-left-color:var(--accent);background:var(--accent-l);}
.slot-body{flex:1;min-width:0;}
.slot-loc{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.slot-type{font-size:10px;color:var(--muted);}
.slot-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap;}
.slot-time{font-size:11px;color:var(--text2);font-family:var(--mono);}
.slot-sales-ct{font-size:11px;color:var(--green);font-weight:700;}
.slot-amb{font-size:10px;font-weight:700;}
.slot-st{font-size:10px;color:var(--muted);}
.live-tag{font-size:9px;font-weight:700;color:var(--accent);background:var(--accent-l);border:1px solid #1e3a6a;padding:2px 6px;flex-shrink:0;border-radius:4px;animation:pulse-border 1.5s infinite;}
@keyframes pulse-border{0%,100%{opacity:1}50%{opacity:.6}}

/* ── MODAL ── */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);}
@media(min-width:600px){.modal-ov{align-items:center;}}
.modal-ov.open{display:flex;}
.modal{background:var(--bg2);border-top:1px solid var(--border);padding:20px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-height:92vh;overflow-y:auto;animation:slideUp .18s ease;border-radius:12px 12px 0 0;}
@media(min-width:600px){.modal{border:1px solid var(--border);border-radius:10px;max-width:480px;padding:24px;animation:fadeIn .16s ease;}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.modal-title{font-size:15px;font-weight:700;color:var(--text);}
.modal-close{background:var(--bg3);border:1px solid var(--border);color:var(--muted);width:28px;height:28px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s;border-radius:var(--r);}
.modal-close:hover{border-color:var(--red);color:var(--red);}

/* ── DETAIL ── */
.dbox{background:var(--bg3);border:1px solid var(--border);padding:12px 14px;margin-bottom:14px;border-radius:6px;}
.drow{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:12px;}
.drow+.drow{border-top:1px solid var(--border);}
.dk2{color:var(--muted);flex-shrink:0;margin-right:10px;}
.dv{font-weight:600;text-align:right;color:var(--text);}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;font-size:10px;font-weight:700;white-space:nowrap;border:1px solid;border-radius:20px;}
.badge::before{content:'';width:4px;height:4px;border-radius:50%;flex-shrink:0;}
.bdp{background:var(--yellow-l);color:var(--yellow);border-color:#3a2a07;}.bdp::before{background:var(--yellow);}
.bda{background:var(--green-l);color:var(--green);border-color:#0d3a1a;}.bda::before{background:var(--green);}
.bdr{background:var(--red-l);color:var(--red);border-color:#3a0f0f;}.bdr::before{background:var(--red);}
.bdx{background:var(--accent-l);color:var(--accent);border-color:#1e3a6a;}.bdx::before{background:var(--accent);}

/* ── TIMER ── */
.timer-card{background:linear-gradient(135deg,var(--accent-l),var(--bg3));border:1px solid #1e3a6a;border-left:4px solid var(--accent);padding:18px;margin-bottom:16px;border-radius:8px;}
.tc-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.tc-dot{width:7px;height:7px;background:var(--red);border-radius:50%;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.tc-loc{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:10px;}
.tc-timer{font-family:var(--mono);font-size:42px;font-weight:500;letter-spacing:2px;margin-bottom:14px;line-height:1;color:var(--text);}
.tc-sc-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.tc-sc-val{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--green);}
.tc-sc-lbl{font-size:11px;color:var(--text2);}
.tc-add-sale{width:100%;padding:10px;border:1px solid var(--accent);background:var(--accent-l);color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;transition:all .12s;margin-bottom:8px;border-radius:var(--r);}
.tc-add-sale:hover{background:var(--accent);color:#fff;}
.tc-end{width:100%;padding:8px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;border-radius:var(--r);}
.tc-end:hover{border-color:var(--red);color:var(--red);}

/* ── SALE ITEMS ── */
.sale-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg3);border:1px solid var(--border);margin-bottom:6px;border-radius:6px;}
.sale-receipt{width:40px;height:40px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;border-radius:4px;}

.reg-no{background:var(--bg3);color:var(--muted);border-color:var(--border);}

/* ── PHOTO ── */
.photo-area{border:2px dashed var(--border2);padding:16px;text-align:center;cursor:pointer;transition:all .12s;position:relative;overflow:hidden;background:var(--bg3);border-radius:var(--r);}
.photo-area:hover{border-color:var(--accent);}
.photo-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
#photo-preview{width:100%;max-height:150px;object-fit:cover;margin-top:10px;display:none;border-radius:4px;}

/* ── TOGGLE ── */
.toggle-row{display:flex;gap:6px;}
.tog-opt{flex:1;padding:9px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;text-align:center;font-size:12px;font-weight:700;transition:all .12s;color:var(--muted);border-radius:var(--r);}
.tog-opt.sel{border-color:var(--green);background:var(--green-l);color:var(--green);}

/* ── TABLE ── */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:440px;}
th{text-align:left;padding:8px 10px;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--bg3);white-space:nowrap;}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text);}
tr:last-child td{border:none;}
tbody tr:hover td{background:var(--bg3);}
tr.clickable{cursor:pointer;}

/* ── MISC ── */
.qa-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.ap-row{padding:10px 0;border-bottom:1px solid var(--border);}
.ap-row:last-child{border:none;}
.ap-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.ap-title{font-size:12px;font-weight:700;color:var(--text);}
.ap-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.ap-btns{display:flex;gap:5px;flex-shrink:0;}
.locked-bar{background:var(--yellow-l);border:1px solid #3a2a07;border-left:3px solid var(--yellow);color:var(--yellow);padding:9px 12px;font-size:12px;margin-bottom:14px;border-radius:var(--r);}
.next-card{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);padding:14px;margin-bottom:14px;border-radius:8px;}
.acc-row{background:var(--bg2);border:1px solid var(--border);padding:14px;margin-bottom:10px;border-radius:8px;}
.acc-name{font-size:13px;font-weight:700;color:var(--text);}
.acc-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.acc-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

/* ── USER MANAGER (admin panel) ── */
.um-user{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.um-user:last-child{border:none;}
.um-info{flex:1;}
.um-name{font-size:13px;font-weight:700;color:var(--text);}
.um-email{font-size:11px;color:var(--muted);margin-top:1px;}
.um-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.role-pill{padding:3px 9px;font-size:10px;font-weight:700;border-radius:20px;border:1px solid;}
.role-coordinator{background:#1a2a4a;color:var(--accent);border-color:#1e3a6a;}
.role-ambassador{background:var(--green-l);color:var(--green);border-color:#0d3a1a;}

/* ── TOAST ── */
#toast{position:fixed;bottom:calc(var(--nav-h) + 10px);left:50%;transform:translateX(-50%) translateY(14px);z-index:9999;background:var(--bg3);color:var(--text);padding:9px 18px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4);opacity:0;transition:all .24s;pointer-events:none;max-width:90vw;text-align:center;border-radius:var(--r);border:1px solid var(--border);}
@media(min-width:768px){#toast{bottom:16px;}}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.terr{background:var(--red-l);border-color:var(--red);color:var(--red);}
#toast.twarn{background:var(--yellow-l);border-color:var(--yellow);color:var(--yellow);}
#toast.tgreen{background:var(--green-l);border-color:var(--green);color:var(--green);}

/* ── LOADING ── */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:10000;}
.loading-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:ldot .8s infinite alternate;}
@keyframes ldot{from{opacity:.2;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.loading-dots{display:flex;gap:6px;}
.loading-dots span:nth-child(2){animation-delay:.15s;}
.loading-dots span:nth-child(3){animation-delay:.3s;}

@media print{.topbar,.bnav,.sidebar,.btn,#toast,.modal-ov{display:none!important;}.main-wrap{margin:0!important;}}
</style>

<!-- ═══════════════════════════════════════════════════
     FIREBASE GUIDE — jak skonfigurować Firebase
     ═══════════════════════════════════════════════════

  1. Idź na https://console.firebase.google.com
  2. "Add project" → nazwa np. "brand-tool"
  3. W projekcie: "Build" → "Firestore Database" → "Create database" → Start in test mode
  4. "Build" → "Authentication" → "Get started" → włącz "Email/Password"
  5. Kliknij ikonę zębatki (Settings) → "Project settings" → "Your apps" → dodaj Web App
  6. Skopiuj firebaseConfig i wklej na górze tego pliku (w miejscu TWOJ_API_KEY etc.)
  7. W Firestore stwórz kolekcję "users" i dodaj dokument z ID = UID Twojego konta:
     {
       firstName: "Admin",
       lastName: "Koordynator",
       email: "admin@mojafirma.pl",
       role: "coordinator",
       status: "active",
       color: "#4f8ef7",
       svId: null,
       createdAt: (timestamp)
     }
  8. WAŻNE - Firestore Rules (opcjonalnie dla bezpieczeństwa):
     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         match /{document=**} {
           allow read, write: if request.auth != null;
         }
       }
     }

  FALLBACK: Jeśli Firebase NIE jest skonfigurowany, aplikacja działa w trybie demo
  z danymi lokalnymi (localStorage). Idealne do testów przed podpięciem bazy!
     ═══════════════════════════════════════════════════ -->

<script>
// ═══════════════════════════════════════════════════════
// KONFIGURACJA ADMINA
// ═══════════════════════════════════════════════════════
const ADMIN_EMAIL   = 'admin@mojafirma.pl';  // ← zmień na swój e-mail
const ADMIN_PASS    = 'admin123';             // ← zmień na swoje hasło (tylko tryb demo)
const ACCESS_CODE   = 'TEAM2024';            // ← kod rejestracyjny dla ambasadorów
const RATE_PER_HOUR = 25;                    // ← stawka godzinowa w PLN

// ═══════════════════════════════════════════════════════
// LOCAL STORAGE FALLBACK (używany gdy Firebase nie skonfigurowany)
// ═══════════════════════════════════════════════════════
const LS_KEY = 'brandtool_v3';
function saveLocal(){try{localStorage.setItem(LS_KEY, JSON.stringify(DB));}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem(LS_KEY);if(r)return JSON.parse(r);}catch(e){}return null;}

const SHOP_TYPES = ['Zabka','Biedronka','Lidl','Rossmann','Empik','Carrefour','Action','Media Markt','Inne','Akcja Lotna'];

let DB = {
  users: [],
  pendingAccounts: [],
  locations: [
    {id:'L1', address:'ul. Woloska 12, Warszawa',    shopType:'Zabka',   note:''},
    {id:'L2', address:'Al. Jerozolimskie 44, Warszawa', shopType:'Biedronka', note:''},
    {id:'L3', address:'ul. Marszalkowska 5, Warszawa', shopType:'Akcja Lotna', note:''},
  ],
  mechanisms: [
    {id:'M1', name:'Probka produktu',    active:true},
    {id:'M2', name:'Karta lojalnosciowa', active:true},
    {id:'M3', name:'Rejestracja aplikacji', active:true},
  ],
  actions: [],
  nextId: 100,
};

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
const DAYS = ['Poniedzialek','Wtorek','Sroda','Czwartek','Piatek','Sobota','Niedziela'];
function uid(){const id='X'+(DB.nextId++);saveLocal();return id;}
function getMon(off=0){const d=new Date(),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);const m=new Date(d);m.setDate(diff);m.setHours(0,0,0,0);m.setDate(m.getDate()+off*7);return m;}
function getWeek(off=0){const m=getMon(off);return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return d;});}
function dk(d){return d.toISOString().slice(0,10);}
function fmtD(d){return d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'});}
function isToday(d){return dk(d)===dk(new Date());}
function t2m(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function diffH(s,e){return(t2m(e)-t2m(s))/60;}
function fmtSec(s){return`${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`;}
function pad(n){return String(n).padStart(2,'0');}
function nowStr(){const n=new Date();return`${pad(n.getHours())}:${pad(n.getMinutes())}`;}
function getU(id){return DB.users.find(u=>u.id===id);}
function getL(id){return DB.locations.find(l=>l.id===id);}
function getM(id){return DB.mechanisms.find(m=>m.id===id);}
function fullName(u){return u?u.firstName+' '+u.lastName:'?';}
function ini(u){return u?(u.firstName[0]+u.lastName[0]).toUpperCase():'?';}
function slbl(s,active){if(active)return'Aktywna';return{pending:'Oczekuje',approved:'Zatwierdzona',rejected:'Odrzucona'}[s]||s;}
function sdc(s,active){return active?'x':s==='pending'?'p':s==='approved'?'a':'r';}
function bdcls(s,active){return active?'bdx':s==='pending'?'bdp':s==='approved'?'bda':'bdr';}
function canEditNextWeek(){return new Date().getDay()>=3;}
function toast(msg,type='ok'){const el=document.getElementById('toast');el.textContent=msg;el.className='show t'+type;clearTimeout(el._t);el._t=setTimeout(()=>el.className='',3200);}

let CU=null, weekOff=0, timerInt=null, saleRegVal=true, salePhotoData=null, currentPanel='';
let FIREBASE_MODE = false;

// ═══════════════════════════════════════════════════════
// FIREBASE SYNC HELPERS
// ═══════════════════════════════════════════════════════
async function fbSave(collection, docId, data) {
  if (!FIREBASE_MODE) { saveLocal(); return; }
  try {
    const {db, doc, setDoc} = window._FB;
    await setDoc(doc(db, collection, docId), data);
  } catch(e) { console.error('FB save error:', e); saveLocal(); }
}

async function fbGet(collName) {
  if (!FIREBASE_MODE) return null;
  try {
    const {db, collection, getDocs} = window._FB;
    const snap = await getDocs(collection(db, collName));
    return snap.docs.map(d => ({id: d.id, ...d.data()}));
  } catch(e) { console.error('FB get error:', e); return null; }
}

async function fbDelete(collName, docId) {
  if (!FIREBASE_MODE) { saveLocal(); return; }
  try {
    const {db, doc, deleteDoc} = window._FB;
    await deleteDoc(doc(db, collName, docId));
  } catch(e) { console.error('FB delete error:', e); }
}

async function loadFromFirebase() {
  const [users, locations, mechanisms, actions, pending] = await Promise.all([
    fbGet('users'), fbGet('locations'), fbGet('mechanisms'),
    fbGet('actions'), fbGet('pendingAccounts')
  ]);
  if (users)      DB.users           = users;
  if (locations)  DB.locations       = locations.length ? locations : DB.locations;
  if (mechanisms) DB.mechanisms      = mechanisms.length ? mechanisms : DB.mechanisms;
  if (actions)    DB.actions         = actions;
  if (pending)    DB.pendingAccounts = pending;
}

async function saveUser(u) { await fbSave('users', u.id, u); saveLocal(); }
async function saveAction(a) { await fbSave('actions', a.id, a); saveLocal(); }
async function saveLocation(l) { await fbSave('locations', l.id, l); saveLocal(); }
async function saveMechanism(m) { await fbSave('mechanisms', m.id, m); saveLocal(); }
async function savePending(p) { await fbSave('pendingAccounts', p.id, p); saveLocal(); }
async function delAction(id) { await fbDelete('actions', id); DB.actions=DB.actions.filter(a=>a.id!==id); saveLocal(); }
async function delUser(id) { await fbDelete('users', id); DB.users=DB.users.filter(u=>u.id!==id); saveLocal(); }
async function delPending(id) { await fbDelete('pendingAccounts', id); DB.pendingAccounts=DB.pendingAccounts.filter(p=>p.id!==id); saveLocal(); }

// ═══════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════
function switchAuthTab(tab){
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('auth-login-panel').style.display  = tab==='login'    ? 'block' : 'none';
  document.getElementById('auth-register-panel').style.display = tab==='register' ? 'block' : 'none';
  if(tab==='register') populateSVSelect();
}

function populateSVSelect(){
  const sel = document.getElementById('reg-sv');if(!sel)return;
  const coords = DB.users.filter(u=>u.role==='coordinator'&&u.status==='active');
  sel.innerHTML = `<option value="">Wybierz koordynatora...</option>` +
    coords.map(c=>`<option value="${c.id}">${fullName(c)}</option>`).join('');
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pass  = document.getElementById('login-pass').value;
  const err   = document.getElementById('login-err');
  err.className = 'alert alert-err';

  if (FIREBASE_MODE) {
    try {
      const {auth, signInWithEmailAndPassword, db, doc, getDoc} = window._FB;
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      const uid  = cred.user.uid;
      const snap = await getDoc(doc(db, 'users', uid));
      if (!snap.exists()) {
        err.innerHTML = 'Nie znaleziono profilu uzytkownika w bazie';
        err.className = 'alert alert-err show'; return;
      }
      const uData = {id: uid, ...snap.data()};
      if (uData.status === 'pending')  { err.innerHTML='Konto czeka na zatwierdzenie'; err.className='alert alert-err show'; return; }
      if (uData.status === 'blocked')  { err.innerHTML='Konto zostalo zablokowane';    err.className='alert alert-err show'; return; }
      CU = uData;
      await loadFromFirebase();
      enterApp();
    } catch(e) {
      err.innerHTML = 'Nieprawidlowy e-mail lub haslo';
      err.className = 'alert alert-err show';
    }
  } else {
    // DEMO MODE
    const u = DB.users.find(u=>u.email.toLowerCase()===email && u.pass===pass);
    if (!u)                  { err.innerHTML='Nieprawidlowy e-mail lub haslo';  err.className='alert alert-err show'; return; }
    if (u.status==='pending'){ err.innerHTML='Konto czeka na zatwierdzenie';     err.className='alert alert-err show'; return; }
    if (u.status==='blocked'){ err.innerHTML='Konto zostalo zablokowane';        err.className='alert alert-err show'; return; }
    CU = u;
    enterApp();
  }
}

async function doRegister(){
  const first = document.getElementById('reg-first').value.trim();
  const last  = document.getElementById('reg-last').value.trim();
  const email = document.getElementById('reg-email').value.trim().toLowerCase();
  const pass  = document.getElementById('reg-pass').value;
  const svId  = document.getElementById('reg-sv').value;
  const code  = document.getElementById('reg-code').value.trim().toUpperCase();
  const err   = document.getElementById('reg-err');
  const ok    = document.getElementById('reg-ok');
  err.className = 'alert alert-err'; ok.className = 'alert alert-ok';

  if (!first||!last)             { err.innerHTML='Podaj imie i nazwisko';       err.className='alert alert-err show'; return; }
  if (!email||!email.includes('@')){ err.innerHTML='Podaj prawidlowy e-mail';   err.className='alert alert-err show'; return; }
  if (pass.length<6)             { err.innerHTML='Haslo min. 6 znakow';         err.className='alert alert-err show'; return; }
  if (!svId)                     { err.innerHTML='Wybierz koordynatora';        err.className='alert alert-err show'; return; }
  if (code !== ACCESS_CODE)      { err.innerHTML='Nieprawidlowy kod dostepu';   err.className='alert alert-err show'; return; }
  if (DB.users.find(u=>u.email.toLowerCase()===email)){ err.innerHTML='E-mail juz zarejestrowany'; err.className='alert alert-err show'; return; }

  const p = {id:'PA'+Date.now(), firstName:first, lastName:last, email, pass, role:'ambassador', svId, status:'pending', color:'#4f8ef7', createdAt:Date.now()};
  DB.pendingAccounts.push(p);
  await savePending(p);
  updateNotifDot();
  ok.innerHTML = 'Konto utworzone — czeka na zatwierdzenie przez koordynatora.';
  ok.className = 'alert alert-ok show';
  ['reg-first','reg-last','reg-email','reg-pass','reg-code'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
}

function enterApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.cssText='display:flex;flex-direction:column;';
  const av=document.getElementById('topbar-av');
  av.textContent=ini(CU);

function buildCalDay(day, idx, actions, isCoord, locked){
  const dateKey=dk(day), todHd=isToday(day)?'today-hd':'', todN=isToday(day)?'today':'';
  const mm=String(day.getMonth()+1).padStart(2,'0');
  const addFn=isCoord?`openCoordAddAction('${dateKey}')`:`openAddAction('${dateKey}')`;
  const addDis=(!isCoord&&(locked||actions.length>=2))?'disabled':'';
  let h=`<div class="cal-day"><div class="cal-hd ${todHd}"><div class="cal-hd-l"><div class="cal-num ${todN}">${day.getDate()}</div><div><div class="cal-day-name">${DAYS[idx]}</div><div class="cal-day-date">${mm}.${day.getFullYear()}</div></div></div><button class="btn btn-sm btn-primary" ${addDis} onclick="${addFn}">+ Dodaj</button></div>`;
  if(!actions.length){ h+=`<div class="cal-empty">Brak akcji</div>`; }
  else{
    h+=`<div class="cal-slots">`;
    actions.forEach(a=>{
      const l=getL(a.locationId),u=getU(a.ambassadorId),active=a.startedAt&&!a.endedAt,sales=(a.sales||[]).length;
      h+=`<div class="slot s-${sdc(a.status,active)}" onclick="openDetail('${a.id}')"><div class="slot-body"><div class="slot-loc">${l?.address||'?'}</div><div class="slot-type">${l?.shopType||''}</div><div class="slot-meta"><span class="slot-time">${a.startTime}–${a.endTime}</span>${sales>0?`<span class="slot-sales-ct">${sales} sprzed.</span>`:''}${isCoord?`<span class="slot-amb" style="color:${u?.color||'#888'}">${fullName(u)}</span>`:''}<span class="slot-st">${slbl(a.status,active)}</span></div></div>${active?`<span class="live-tag">LIVE</span>`:''}</div>`;
    });
    h+=`</div>`;
  }
  return h+`</div>`;
}

function onLocChg(){const v=document.getElementById('al')?.value;const s=document.getElementById('nloc-sec');if(s)s.style.display=v==='__new__'?'block':'none';}

async function submitAddAction(dateKey, ambId){
  const locSel=document.getElementById('al').value;
  const numV=document.getElementById('an').value;
  const s=document.getElementById('as').value;
  const e=document.getElementById('ae2').value;
  const err=document.getElementById('ae'); const inf=document.getElementById('ai');
  err.className='alert alert-err'; inf.className='alert alert-info';
  const h=diffH(s,e);
  if(h<1||h>4){err.innerHTML=`Akcja musi trwac min. 1h i maks. 4h (${h.toFixed(1)}h)`;err.className='alert alert-err show';return;}
  if(t2m(e)<=t2m(s)){err.innerHTML='Godzina zakonczenia musi byc po starcie';err.className='alert alert-err show';return;}
  let locId=locSel;
  if(locSel==='__new__'){const addr=document.getElementById('nla')?.value.trim();const type=document.getElementById('nlt')?.value;const note=document.getElementById('nln')?.value.trim();if(!addr){err.innerHTML='Podaj adres lokalizacji';err.className='alert alert-err show';return;}locId=uid();const newLoc={id:locId,address:addr,shopType:type,note};DB.locations.push(newLoc);await saveLocation(newLoc);}
  const conflict=DB.actions.find(a=>a.date===dateKey&&a.locationId===locId&&!(t2m(e)<=t2m(a.startTime)||t2m(s)>=t2m(a.endTime)));
  if(conflict){const u2=getU(conflict.ambassadorId);inf.innerHTML=`Uwaga: ${fullName(u2)} pracuje na tym punkcie w ${conflict.startTime}–${conflict.endTime}`;inf.className='alert alert-info show';}
  const existing=DB.actions.filter(a=>a.ambassadorId===ambId&&a.date===dateKey);
  if(existing.length>=2){err.innerHTML='Maks. 2 akcje dziennie';err.className='alert alert-err show';return;}
  const newAction={id:uid(),ambassadorId:ambId,locationId:locId,date:dateKey,startTime:s,endTime:e,status:'pending',sales:[],actionNum:parseInt(numV),startedAt:null,endedAt:null,endReason:null};
  DB.actions.push(newAction);
  await saveAction(newAction);
  closeModal(); toast('Akcja dodana — czeka na zatwierdzenie','tok');
  showPanel(CU.role==='coordinator'?'coord-schedule':'amb-schedule');
}

async function setActionStatus(id, st){

async function confirmDeleteAction(id){
  if(!confirm('Usunac ta akcje?'))return;

  closeModal(); toast('Usunieto','twarn');
  showPanel(CU.role==='coordinator'?'coord-schedule':'amb-schedule');
}

async function startAction(id){
  const a=DB.actions.find(x=>x.id===id);if(!a)return;
  a.startedAt=Date.now();
  await saveAction(a);
  closeModal(); toast('Akcja rozpoczeta ▶','tgreen');

}

function openEndActionModal(actionId){
  const a=DB.actions.find(x=>x.id===actionId);if(!a)return;

  document.getElementById('modal-ttl').textContent='Zakoncz akcje';
  document.getElementById('modal-body').innerHTML=`
    <div style="background:var(--yellow-l);border:1px solid #3a2a07;border-left:3px solid var(--yellow);padding:9px 12px;font-size:12px;margin-bottom:14px;border-radius:var(--r)">Planowe zakonczenie: <strong>${a.endTime}</strong>${earlyEnd?` — <strong style="color:var(--yellow)">Kończysz wczesniej</strong>`:''}</div>
    ${earlyEnd?`<div class="fg"><label class="fl">Powod wczesniejszego zakonczenia *</label><select class="fc" id="end-reason-sel"><option value="">Wybierz powod...</option><option>Osiagnieto cel sprzedazowy</option><option>Brak klientow</option><option>Problem z punktem sprzedazy</option><option>Choroba / zle samopoczucie</option><option>Decyzja koordynatora</option><option>Inne</option></select></div><div class="fg" id="end-other-wrap" style="display:none"><label class="fl">Opisz powod</label><input type="text" class="fc" id="end-reason-txt" placeholder="Wpisz powod..."></div>`:`<div class="fg"><label class="fl">Notatka (opcjonalna)</label><input type="text" class="fc" id="end-note" placeholder="np. plan zrealizowany"></div>`}
    <div class="btn-row"><button class="btn btn-red" style="flex:1" onclick="submitEndAction('${actionId}',${earlyEnd})">■ Tak, zakoncz</button><button class="btn btn-ghost" onclick="closeModal()">Anuluj</button></div>`;
  document.getElementById('end-reason-sel')?.addEventListener('change',function(){const w=document.getElementById('end-other-wrap');if(w)w.style.display=this.value==='Inne'?'block':'none';});
  openModal();
}

async function submitEndAction(actionId, earlyEnd){
  const a=DB.actions.find(x=>x.id===actionId);if(!a)return;
  let reason='';
  if(earlyEnd){const sel=document.getElementById('end-reason-sel');if(!sel?.value){toast('Wybierz powod zakonczenia','terr');return;}reason=sel.value==='Inne'?(document.getElementById('end-reason-txt')?.value||'Inne'):sel.value;}
  else{reason=document.getElementById('end-note')?.value||'';}
  a.endedAt=Date.now(); a.endReason=reason;
  await saveAction(a);
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  closeModal(); toast('Akcja zakonczona ■','twarn');
  showPanel('amb-stats');
}

function selSaleResult(v){saleRegVal=v;document.getElementById('tog-yes').className='tog-opt'+(v?' sel':'');document.getElementById('tog-no').className='tog-opt'+(!v?' sel':'');document.getElementById('sale-details').style.display=v?'block':'none';}

function handlePhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{salePhotoData=ev.target.result;const prev=document.getElementById('photo-preview');const ph=document.getElementById('photo-ph');if(prev){prev.src=salePhotoData;prev.style.display='block';}if(ph)ph.style.display='none';};r.readAsDataURL(f);}

async function submitSale(actionId){
  const mechId=document.getElementById('sale-mech')?.value;
  const err=document.getElementById('sale-err');err.className='alert alert-err';
  const sold=document.getElementById('tog-yes')?.classList.contains('sel');
  if(sold&&!mechId){err.innerHTML='Wybierz mechanizm sprzedazy';err.className='alert alert-err show';return;}
  if(sold&&!salePhotoData){err.innerHTML='Dodaj zdjecie paragonu';err.className='alert alert-err show';return;}
  const a=DB.actions.find(x=>x.id===actionId);if(!a)return;
  if(!a.sales)a.sales=[];
  a.sales.push({id:uid(),mechanismId:mechId||null,registered:saleRegVal,receiptData:salePhotoData,sold,ts:Date.now()});
  await saveAction(a);
  closeModal(); toast(`Sprzedaz zapisana ✓ Lacznie: ${a.sales.length}`,'tgreen');
  showPanel('amb-actions');
}

async function approveAccount(pendingId){
  const p=DB.pendingAccounts.find(x=>x.id===pendingId);if(!p)return;
  const newUser={...p, id:'U'+Date.now(), status:'active'};
  DB.users.push(newUser);
  await saveUser(newUser);
  await delPending(pendingId);
  buildNav(); updateNotifDot();
  toast(`✓ Konto ${p.firstName} ${p.lastName} zatwierdzone`,'tgreen');
  showPanel('coord-accounts');
}

async function rejectAccount(pendingId){
  await delPending(pendingId);
  buildNav(); updateNotifDot();
  toast('Konto odrzucone','terr');
  showPanel('coord-accounts');
}

async function toggleBlockUser(userId){
  const u=DB.users.find(x=>x.id===userId);if(!u)return;
  u.status=u.status==='active'?'blocked':'active';
  await saveUser(u);
  toast(u.status==='active'?'Odblokowano ✓':'Zablokowano ■','twarn');
  showPanel('coord-accounts');
}

async function confirmDeleteUser(userId){
  if(!confirm('Usunac konto tego ambasadora? Jego akcje pozostana w bazie.'))return;
  await delUser(userId);
  toast('Konto usuniete','twarn');
  showPanel('coord-accounts');
}

function renderCoordTeam(){
  const ambs=DB.users.filter(u=>u.role==='ambassador'&&u.svId===CU.id&&u.status==='active');
  const wk=new Set(getWeek(0).map(dk));

  ambs.forEach(u=>{const tw=DB.actions.filter(a=>a.ambassadorId===u.id&&wk.has(a.date));const ph=tw.reduce((s,a)=>s+diffH(a.startTime,a.endTime),0);const rh=tw.filter(a=>a.endedAt).reduce((s,a)=>s+(a.endedAt-a.startedAt)/3600000,0);const sales=tw.reduce((s,a)=>s+(a.sales?.length||0),0);const active=DB.actions.find(a=>a.ambassadorId===u.id&&a.startedAt&&!a.endedAt);
    h+=`<div class="card" style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div class="av" style="background:${u.color}22;color:${u.color};border-color:${u.color}44;width:36px;height:36px;flex-shrink:0;font-size:11px">${(u.firstName[0]+u.lastName[0]).toUpperCase()}</div><div style="flex:1"><div style="font-size:13px;font-weight:700">${fullName(u)}</div><div style="font-size:10px;color:var(--muted)">${u.email}</div></div>${active?`<span class="live-tag">LIVE</span>`:''}<button class="btn btn-ghost btn-sm" onclick="openAddAction('${dk(new Date())}','${u.id}')">+ Akcja</button></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="text-align:center"><div style="font-size:16px;font-weight:700;font-family:var(--mono)">${ph.toFixed(1)}</div><div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Plan h</div></div><div style="text-align:center"><div style="font-size:16px;font-weight:700;font-family:var(--mono);color:var(--green)">${rh.toFixed(1)}</div><div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Real. h</div></div><div style="text-align:center"><div style="font-size:16px;font-weight:700;font-family:var(--mono);color:var(--green)">${sales}</div><div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Sprzedaze</div></div><div style="text-align:center"><div style="font-size:16px;font-weight:700;font-family:var(--mono);color:var(--yellow)">${(rh*RATE_PER_HOUR).toFixed(0)}</div><div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Wypl. zl</div></div></div></div>`;});

async function submitMech(){const n=document.getElementById('mn')?.value.trim();if(!n){toast('Podaj nazwe','terr');return;}const m={id:uid(),name:n,active:true};DB.mechanisms.push(m);await saveMechanism(m);closeModal();toast('Dodano ✓','tgreen');showPanel('coord-mechanisms');}

function renderCoordUsers(){
  const allAmbs = DB.users.filter(u=>u.role==='ambassador');

  let h=`<div class="section-hd hd-row"><div><div class="page-title">Zarzadzanie uzytkownikami 🛡️</div><div class="page-sub">Dodawaj, edytuj i usuwaj konta</div></div><button class="btn btn-primary btn-sm" onclick="openAddUserModal()">+ Dodaj uzytkownika</button></div>`;

  h+=`<div class="card" style="margin-bottom:14px"><div class="card-hd"><div class="card-title">Koordynatorzy (${allCoords.length})</div></div>`;
  allCoords.forEach(u=>{h+=buildUserRow(u);});

  return `<div class="um-user">

      <div class="um-name">${fullName(u)} ${isSelf?'<span style="font-size:10px;color:var(--accent)">(Ty)</span>':''}</div>
      <div class="um-email">${u.email}${sv?` — Koord: ${fullName(sv)}`:''}</div>
    </div>
    <div class="um-controls">
      <span class="role-pill ${u.role==='coordinator'?'role-coordinator':'role-ambassador'}">${u.role==='coordinator'?'Koordynator':'Ambasador'}</span>
      <span class="badge ${u.status==='active'?'bda':'bdr'}">${u.status==='active'?'Aktywny':'Zablok.'}</span>
      ${!isSelf?`<button class="btn btn-ghost btn-xs" onclick="openEditUserModal('${u.id}')">Edytuj</button>
      <button class="btn btn-ghost btn-xs" onclick="toggleBlockUser('${u.id}')">${u.status==='active'?'Blok.':'Odblok.'}</button>

function toggleSvField(){
  const role=document.getElementById('au-role')?.value;
  const wrap=document.getElementById('au-sv-wrap');
  if(wrap)wrap.style.display=role==='ambassador'?'block':'none';
}

function selColor(c){
  document.getElementById('au-color').value=c;
  document.querySelectorAll('[id^="col-"]').forEach(el=>el.style.borderColor='transparent');
  const key=c.replace('#','');
  const el=document.getElementById('col-'+key);
  if(el)el.style.borderColor='#fff';
}

async function submitAddUser(){
  const first=document.getElementById('au-first').value.trim();
  const last=document.getElementById('au-last').value.trim();
  const email=document.getElementById('au-email').value.trim().toLowerCase();
  const pass=document.getElementById('au-pass').value;
  const role=document.getElementById('au-role').value;
  const svId=document.getElementById('au-sv')?.value||null;
  const color=document.getElementById('au-color').value||'#4f8ef7';
  const err=document.getElementById('au-err'); err.className='alert alert-err';

  if(!first||!last){err.innerHTML='Podaj imie i nazwisko';err.className='alert alert-err show';return;}
  if(!email||!email.includes('@')){err.innerHTML='Podaj prawidlowy e-mail';err.className='alert alert-err show';return;}
  if(pass.length<6){err.innerHTML='Haslo min. 6 znakow';err.className='alert alert-err show';return;}
  if(role==='ambassador'&&!svId){err.innerHTML='Wybierz koordynatora dla ambasadora';err.className='alert alert-err show';return;}
  if(DB.users.find(u=>u.email.toLowerCase()===email)){err.innerHTML='Ten e-mail jest juz zarejestrowany';err.className='alert alert-err show';return;}

  const newUser={id:'U'+Date.now(), firstName:first, lastName:last, email, pass, role, svId:role==='ambassador'?svId:null, status:'active', color, createdAt:Date.now()};
  DB.users.push(newUser);
  await saveUser(newUser);
  closeModal(); toast(`✓ Uzytkownik ${fullName(newUser)} dodany`,'tgreen');
  buildNav(); showPanel('coord-users');
}

  closeModal(); toast('Zaktualizowano ✓','tgreen'); buildNav(); showPanel('coord-users');
}

// ═══════════════════════════════════════════════════════
// COORD REPORT
// ═══════════════════════════════════════════════════════
function renderCoordReport(){
  const ambs=DB.users.filter(u=>u.role==='ambassador'&&u.status==='active');
  const days=getWeek(0); const wk=new Set(days.map(dk));
  let tH=0,tS=0,tP=0;
  const rows=ambs.map(u=>{const tw=DB.actions.filter(a=>a.ambassadorId===u.id&&wk.has(a.date));const rh=tw.filter(a=>a.endedAt).reduce((s,a)=>s+(a.endedAt-a.startedAt)/3600000,0);const s=tw.reduce((sv,a)=>sv+(a.sales?.length||0),0);const p=rh*RATE_PER_HOUR;tH+=rh;tS+=s;tP+=p;return{u,n:tw.length,rh,s,p};});
  let h=`<div class="section-hd hd-row"><div><div class="page-title">Raport tygodniowy 📋</div><div class="page-sub">${fmtD(days[0])} – ${fmtD(days[6])}</div></div><div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" onclick="exportExcel()">📥 Excel</button><button class="btn btn-ghost btn-sm" onclick="window.print()">🖨 Drukuj</button></div></div>`;
  h+=`<div class="stats-grid"><div class="stat-card"><div class="stat-lbl">Lacznie h</div><div class="stat-val">${tH.toFixed(1)}</div></div><div class="stat-card"><div class="stat-lbl">Sprzedaze</div><div class="stat-val" style="color:var(--green)">${tS}</div></div><div class="stat-card"><div class="stat-lbl">Wyplaty</div><div class="stat-val" style="color:var(--yellow);font-size:20px">${tP.toFixed(0)} zl</div></div><div class="stat-card"><div class="stat-lbl">Ambasadorzy</div><div class="stat-val">${ambs.length}</div></div></div>`;
  h+=`<div class="card"><div class="card-title">Podsumowanie zespolu</div><div class="tw"><table><thead><tr><th>Imie i nazwisko</th><th>Akcje</th><th>Godz.</th><th>Sprzedaze</th><th>Wyplata</th></tr></thead><tbody>`;
  rows.forEach(({u,n,rh,s,p})=>{h+=`<tr><td style="font-weight:700;color:${u.color}">${fullName(u)}</td><td style="font-family:var(--mono)">${n}</td><td style="font-family:var(--mono)">${rh.toFixed(1)}h</td><td style="color:var(--green);font-weight:700">${s}</td><td style="color:var(--yellow);font-weight:700">${p.toFixed(2)} zl</td></tr>`;});
  h+=`<tr style="background:var(--bg3);font-weight:700"><td>RAZEM</td><td></td><td style="font-family:var(--mono)">${tH.toFixed(1)}h</td><td style="color:var(--green)">${tS}</td><td style="color:var(--yellow)">${tP.toFixed(2)} zl</td></tr></tbody></table></div></div>`;
  return h;
}

// ═══════════════════════════════════════════════════════
// EXCEL EXPORT
// ═══════════════════════════════════════════════════════
function exportExcel(){
  if(typeof XLSX==='undefined'){toast('Biblioteka XLSX niedostepna','terr');return;}
  const wb=XLSX.utils.book_new();
  const aR=[['ID','Ambasador','E-mail','Data','Od','Do','Lokalizacja','Typ','Status','Sprzedaze','Godz. realiz.','Powod']];
  DB.actions.forEach(a=>{const u=getU(a.ambassadorId);const l=getL(a.locationId);const rh=a.endedAt&&a.startedAt?((a.endedAt-a.startedAt)/3600000).toFixed(2):'';aR.push([a.id,fullName(u),u?.email||'',a.date,a.startTime,a.endTime,l?.address||'',l?.shopType||'',slbl(a.status,false),(a.sales||[]).length,rh,a.endReason||'']);});
  const ws1=XLSX.utils.aoa_to_sheet(aR);XLSX.utils.book_append_sheet(wb,ws1,'Akcje');
  const sR=[['ID','Data','Ambasador','Lokalizacja','Mechanizm','Zarejestrowany']];
  DB.actions.forEach(a=>{const u=getU(a.ambassadorId);const l=getL(a.locationId);(a.sales||[]).forEach(s=>{const m=getM(s.mechanismId);sR.push([s.id,a.date,fullName(u),l?.address||'',m?.name||'',s.registered?'Tak':'Nie']);});});
  const ws2=XLSX.utils.aoa_to_sheet(sR);XLSX.utils.book_append_sheet(wb,ws2,'Sprzedaze');
  XLSX.writeFile(wb,`BrandTool_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Plik Excel pobrany ✓','tgreen');
}

// ═══════════════════════════════════════════════════════
// NOTIFICATIONS
// ═══════════════════════════════════════════════════════
function renderNotifications(){
  const pendingAcc=CU.role==='coordinator'?DB.pendingAccounts.filter(p=>p.svId===CU.id):[];
  const rejected=CU.role==='ambassador'?DB.actions.filter(a=>a.ambassadorId===CU.id&&a.status==='rejected'):[];
  let h=`<div class="section-hd"><div class="page-title">Powiadomienia 🔔</div></div>`;
  if(!pendingAcc.length&&!rejected.length){h+=`<div class="card" style="text-align:center;padding:32px;color:var(--muted)">Brak powiadomien</div>`;return h;}
  pendingAcc.forEach(p=>{h+=`<div class="card" style="margin-bottom:10px;border-left:3px solid var(--yellow)"><div style="font-size:12px;font-weight:700">👤 Nowy ambasador chce dolaczyc</div><div style="font-size:11px;color:var(--muted);margin-top:4px">${p.firstName} ${p.lastName} — ${p.email}</div><div class="btn-row"><button class="btn btn-green btn-sm" onclick="approveAccount('${p.id}')">✓ Zatwierdz</button><button class="btn btn-red btn-sm" onclick="rejectAccount('${p.id}')">✕ Odrzuc</button></div></div>`;});
  rejected.forEach(a=>{const l=getL(a.locationId);h+=`<div class="card" style="margin-bottom:10px;border-left:3px solid var(--red)"><div style="font-size:12px;font-weight:700">❌ Akcja odrzucona</div><div style="font-size:11px;color:var(--muted);margin-top:4px">${l?.shopType} — ${a.date} ${a.startTime}–${a.endTime}</div></div>`;});
  return h;
}

window.addEventListener('firebase-ready', async () => {
  const FB = window._FB;
  FIREBASE_MODE = FB.ok;

  if (FIREBASE_MODE) {
    // Firebase mode: czekaj na auth state
    FB.onAuthStateChanged(FB.auth, async (firebaseUser) => {
      document.getElementById('loading-screen').style.display='none';
      if (firebaseUser) {
        // Już zalogowany z poprzedniej sesji
        try {
          const snap = await FB.getDoc(FB.doc(FB.db, 'users', firebaseUser.uid));
          if (snap.exists()) {
            CU = {id: firebaseUser.uid, ...snap.data()};
            if (CU.status === 'active') {
              await loadFromFirebase();
              document.getElementById('auth-screen').style.display='none';
              enterApp();
              return;
            }
          }
        } catch(e){}
      }
      document.getElementById('auth-screen').style.display='flex';
    });
  } else {
    // Demo mode: localStorage
    document.getElementById('loading-screen').style.display='none';
    const saved = loadLocal();
    if (saved) {
      DB = saved;
    }
    initDemoData();
    document.getElementById('auth-screen').style.display='flex';
  }
});

// Fallback jeśli Firebase nie załaduje się
setTimeout(()=>{
  if(document.getElementById('loading-screen').style.display!=='none'){
    document.getElementById('loading-screen').style.display='none';
    FIREBASE_MODE = false;
    const saved=loadLocal();if(saved)DB=saved;
    initDemoData();
    document.getElementById('auth-screen').style.display='flex';
  }
},3000);
</script>
