    <div class="fg"><label class="fl">E-mail</label><div class="f-static">${u.email}</div></div>
    <div class="fg"><label class="fl">Rola</label><select class="fc" id="eu-role" onchange="toggleEditSvField()"><option value="ambassador" ${u.role==='ambassador'?'selected':''}>Ambasador</option><option value="coordinator" ${u.role==='coordinator'?'selected':''}>Koordynator</option></select></div>
    <div class="fg" id="eu-sv-wrap" ${u.role!=='ambassador'?'style="display:none"':''}><label class="fl">Koordynator</label><select class="fc" id="eu-sv"><option value="">Wybierz...</option>${coords.map(c=>`<option value="${c.id}" ${c.id===u.svId?'selected':''}>${fullName(c)}</option>`).join('')}</select></div>
    <div class="fg"><label class="fl">Kolor</label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:2px">${['#4f8ef7','#22c55e','#f59e0b','#f05252','#a855f7','#06b6d4','#ec4899','#84cc16'].map(c=>`<div onclick="selColorEdit('${c}')" id="ecol-${c.replace('#','')}" style="width:28px;height:28px;background:${c};border-radius:6px;cursor:pointer;border:2px solid ${c===u.color?'#fff':'transparent'};transition:all .12s"></div>`).join('')}</div><input type="hidden" id="eu-color" value="${u.color}"></div>
    <div class="fg"><label class="fl">Status</label><select class="fc" id="eu-status"><option value="active" ${u.status==='active'?'selected':''}>Aktywny</option><option value="blocked" ${u.status==='blocked'?'selected':''}>Zablokowany</option></select></div>
    <div class="btn-row"><button class="btn btn-primary" style="flex:1" onclick="submitEditUser('${userId}')">Zapisz</button><button class="btn btn-ghost" onclick="closeModal()">Anuluj</button></div>`;
  openModal();
}

function toggleEditSvField(){const role=document.getElementById('eu-role')?.value;const wrap=document.getElementById('eu-sv-wrap');if(wrap)wrap.style.display=role==='ambassador'?'block':'none';}
function selColorEdit(c){document.getElementById('eu-color').value=c;document.querySelectorAll('[id^="ecol-"]').forEach(el=>el.style.borderColor='transparent');const el=document.getElementById('ecol-'+c.replace('#',''));if(el)el.style.borderColor='#fff';}

async function submitEditUser(userId){
  const u=DB.users.find(x=>x.id===userId);if(!u)return;
  const first=document.getElementById('eu-first').value.trim();
  const last=document.getElementById('eu-last').value.trim();
  const role=document.getElementById('eu-role').value;
  const svId=document.getElementById('eu-sv')?.value||null;
  const color=document.getElementById('eu-color').value||u.color;
  const status=document.getElementById('eu-status').value;
  const err=document.getElementById('eu-err');err.className='alert alert-err';
  if(!first||!last){err.innerHTML='Podaj imię i nazwisko';err.className='alert alert-err show';return;}
  if(role==='ambassador'&&!svId){err.innerHTML='Wybierz koordynatora';err.className='alert alert-err show';return;}
  u.firstName=first;u.lastName=last;u.role=role;u.svId=role==='ambassador'?svId:null;u.color=color;u.status=status;
  await saveUser(u);closeModal();toast('Zaktualizowano','tgreen');buildNav();showPanel('coord-users');
}

function renderCoordReport(){
  const ambs=DB.users.filter(u=>u.role==='ambassador'&&u.status==='active');
  const days=getWeek(0);const wk=new Set(days.map(dk));
  let tH=0,tS=0,tP=0;
  const rows=ambs.map(u=>{const tw=DB.actions.filter(a=>a.ambassadorId===u.id&&wk.has(a.date));const rh=tw.filter(a=>a.endedAt).reduce((s,a)=>s+(a.endedAt-a.startedAt)/3600000,0);const s=tw.reduce((sv,a)=>sv+(a.sales?.length||0),0);const p=rh*RATE_PER_HOUR;tH+=rh;tS+=s;tP+=p;return{u,n:tw.length,rh,s,p};});
  let h=`<div class="section-hd hd-row"><div><div class="page-title">Raport tygodniowy</div><div class="page-sub">${fmtD(days[0])} – ${fmtD(days[6])}</div></div><div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" onclick="exportExcel()">Excel</button><button class="btn btn-ghost btn-sm" onclick="window.print()">Drukuj</button></div></div>`;
  h+=`<div class="stats-grid"><div class="stat-card"><div class="stat-lbl">Łącznie h</div><div class="stat-val">${tH.toFixed(1)}</div></div><div class="stat-card"><div class="stat-lbl">Sprzedaże</div><div class="stat-val" style="color:var(--green)">${tS}</div></div><div class="stat-card"><div class="stat-lbl">Wypłaty</div><div class="stat-val" style="color:var(--yellow);font-size:20px">${tP.toFixed(0)} zł</div></div><div class="stat-card"><div class="stat-lbl">Ambasadorzy</div><div class="stat-val">${ambs.length}</div></div></div>`;
  h+=`<div class="card"><div class="card-title">Podsumowanie</div><div class="tw"><table><thead><tr><th>Imię i nazwisko</th><th>Akcje</th><th>Godz.</th><th>Sprzedaże</th><th>Wypłata</th></tr></thead><tbody>`;
  rows.forEach(({u,n,rh,s,p})=>{h+=`<tr><td style="font-weight:700;color:${u.color}">${fullName(u)}</td><td style="font-family:var(--mono)">${n}</td><td style="font-family:var(--mono)">${rh.toFixed(1)}h</td><td style="color:var(--green);font-weight:700">${s}</td><td style="color:var(--yellow);font-weight:700">${p.toFixed(2)} zł</td></tr>`;});
  h+=`<tr style="background:var(--bg3);font-weight:700"><td>RAZEM</td><td></td><td>${tH.toFixed(1)}h</td><td style="color:var(--green)">${tS}</td><td style="color:var(--yellow)">${tP.toFixed(2)} zł</td></tr></tbody></table></div></div>`;
  return h;
}

function renderCoordSettings(){
  const myCode=CU.accessCode||'TEAM2024';
  let h=`<div class="section-hd"><div class="page-title">Ustawienia</div></div>`;
  h+=`<div class="card" style="margin-bottom:14px"><div class="card-hd"><div class="card-title">Twoje dane</div></div><div class="dbox"><div class="drow"><span class="dk2">Imię i nazwisko</span><span class="dv">${fullName(CU)}</span></div><div class="drow"><span class="dk2">E-mail</span><span class="dv" style="font-family:var(--mono);font-size:11px">${CU.email}</span></div><div class="drow"><span class="dk2">Rola</span><span class="badge role-coordinator">Koordynator</span></div></div><div class="btn-row"><button class="btn btn-ghost btn-sm" onclick="openEditProfileModal()">Edytuj dane</button></div></div>`;
  h+=`<div class="card" style="margin-bottom:14px"><div class="card-hd"><div class="card-title">Stawka godzinowa</div></div><div class="fg"><div style="display:flex;gap:8px;align-items:center"><input type="number" class="fc" id="rate-inp" value="${RATE_PER_HOUR}" min="1" max="999" style="width:100px"><span style="color:var(--text2);font-size:13px">zł / godzinę</span><button class="btn btn-primary" onclick="saveRate()">Zapisz</button></div></div></div>`;
  return h;
}

function openEditProfileModal(){
  document.getElementById('modal-ttl').textContent='Edytuj profil';
  document.getElementById('modal-body').innerHTML=`
    <div id="ep-err" class="alert alert-err"></div>
    <div class="fr"><div class="fg"><label class="fl">Imię</label><input type="text" class="fc" id="ep-first" value="${CU.firstName}"></div><div class="fg"><label class="fl">Nazwisko</label><input type="text" class="fc" id="ep-last" value="${CU.lastName}"></div></div>
    <div class="fg"><label class="fl">Kolor</label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${['#4f8ef7','#22c55e','#f59e0b','#f05252','#a855f7','#06b6d4','#ec4899','#84cc16'].map(c=>`<div onclick="selColorEdit('${c}')" id="ecol-${c.replace('#','')}" style="width:28px;height:28px;background:${c};border-radius:6px;cursor:pointer;border:2px solid ${c===CU.color?'#fff':'transparent'};transition:all .12s"></div>`).join('')}</div><input type="hidden" id="eu-color" value="${CU.color}"></div>
    <div class="btn-row"><button class="btn btn-primary" style="flex:1" onclick="submitEditProfile()">Zapisz</button><button class="btn btn-ghost" onclick="closeModal()">Anuluj</button></div>`;
  openModal();
}

async function submitEditProfile(){
  const first=document.getElementById('ep-first').value.trim();
  const last=document.getElementById('ep-last').value.trim();
  const color=document.getElementById('eu-color').value||CU.color;
  const err=document.getElementById('ep-err');err.className='alert alert-err';
  if(!first||!last){err.innerHTML='Podaj imię i nazwisko';err.className='alert alert-err show';return;}
  CU.firstName=first;CU.lastName=last;CU.color=color;
  const u=DB.users.find(x=>x.id===CU.id);
  if(u){u.firstName=first;u.lastName=last;u.color=color;await saveUser(u);}
  document.getElementById('topbar-av').textContent=ini(CU);
  document.getElementById('topbar-av').style.cssText=`background:${color}22;color:${color};border:1px solid ${color}44`;
  document.getElementById('topbar-nm').textContent=fullName(CU);
  closeModal();toast('Profil zaktualizowany');showPanel('coord-settings');
}

function saveRate(){const val=parseInt(document.getElementById('rate-inp')?.value);if(!val||val<1){toast('Podaj prawidłową stawkę','terr');return;}RATE_PER_HOUR=val;toast('Stawka zapisana');}

function renderNotifications(){
  const pendingAcc=DB.pendingAccounts;
  const rejected=CU.role==='ambassador'?DB.actions.filter(a=>a.ambassadorId===CU.id&&a.status==='rejected'):[];
  let h=`<div class="section-hd"><div class="page-title">Powiadomienia</div></div>`;
  if(!pendingAcc.length&&!rejected.length){h+=`<div class="card" style="text-align:center;padding:32px;color:var(--muted)">Brak powiadomień</div>`;return h;}
  pendingAcc.forEach(p=>{h+=`<div class="card" style="margin-bottom:10px;border-left:3px solid var(--yellow)"><div style="font-size:12px;font-weight:700">Nowy ambasador chce dołączyć</div><div style="font-size:11px;color:var(--muted);margin-top:4px">${p.firstName} ${p.lastName} — ${p.email}</div><div class="btn-row"><button class="btn btn-green btn-sm" onclick="approveAccount('${p.id}')">Zatwierdź</button><button class="btn btn-red btn-sm" onclick="rejectAccount('${p.id}')">Odrzuć</button></div></div>`;});
  rejected.forEach(a=>{const l=getL(a.locationId);h+=`<div class="card" style="margin-bottom:10px;border-left:3px solid var(--red)"><div style="font-size:12px;font-weight:700">Akcja odrzucona</div><div style="font-size:11px;color:var(--muted);margin-top:4px">${l?.shopType} — ${a.date} ${a.startTime}–${a.endTime}</div></div>`;});
  return h;
}

// EXCEL
// ═══════════════════════════════════════════
function exportExcel(){
  if(typeof XLSX==='undefined'){toast('Biblioteka XLSX niedostępna','terr');return;}
  const wb=XLSX.utils.book_new();
  const aR=[['ID','Ambasador','E-mail','Data','Od','Do','Lokalizacja','Typ','Status','Sprzedaże','Godz. realiz.','Powód']];
  DB.actions.forEach(a=>{const u=getU(a.ambassadorId);const l=getL(a.locationId);const rh=a.endedAt&&a.startedAt?((a.endedAt-a.startedAt)/3600000).toFixed(2):'';aR.push([a.id,fullName(u),u?.email||'',a.date,a.startTime,a.endTime,l?.address||'',l?.shopType||'',slbl(a.status,false),(a.sales||[]).length,rh,a.endReason||'']);});
  const ws1=XLSX.utils.aoa_to_sheet(aR);XLSX.utils.book_append_sheet(wb,ws1,'Akcje');
  // Stock sheet
  const stR=[['ID','Użytkownik','Produkt','Marka','Otwarta','Wkładów','Data otwarcia','Termin','Dodano']];
  DB.stock.forEach(s=>{const u=getU(s.userId);const p=getProd(s.productId);stR.push([s.id,fullName(u),p?.name||'',p?.brand||'',s.isOpen?'Tak':'Nie',s.sticksLeft||'',s.openedAt||'',s.expiresAt||'',s.addedAt||'']);});
  const ws2=XLSX.utils.aoa_to_sheet(stR);XLSX.utils.book_append_sheet(wb,ws2,'Magazyn');
  XLSX.writeFile(wb,`BrandTool_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Plik Excel pobrany','tgreen');
}

function openModal(){document.getElementById('modal-ov').classList.add('open');document.body.style.overflow='hidden';}
function closeModal(){document.getElementById('modal-ov').classList.remove('open');document.body.style.overflow='';}
function closeModalBg(e){if(e.target===document.getElementById('modal-ov'))closeModal();}

// INIT
// ═══════════════════════════════════════════
function initDemoData(){
  if(!DB.users.find(u=>u.email===ADMIN_EMAIL)){
    DB.users.unshift({id:'U1',firstName:'Admin',lastName:'Koordynator',email:ADMIN_EMAIL,pass:ADMIN_PASS,role:'coordinator',svId:null,status:'active',color:'#4f8ef7',createdAt:Date.now()-9e8});
  }
  if(!DB.users.find(u=>u.email==='anna@brand.pl')){
    DB.users.push({id:'U2',firstName:'Anna',lastName:'Nowak',email:'anna@brand.pl',pass:'1234',role:'ambassador',svId:'U1',status:'active',color:'#22c55e',createdAt:Date.now()-7e8});
    DB.users.push({id:'U3',firstName:'Marta',lastName:'Wiśniewska',email:'marta@brand.pl',pass:'1234',role:'ambassador',svId:'U1',status:'active',color:'#f59e0b',createdAt:Date.now()-6e8});
  }
  if(!DB.actions.length){
    const today=new Date();
    function dkN(n){const d=new Date(today);d.setDate(d.getDate()+n);return dk(d);}
    const day=today.getDay(),m=day===0?-6:1-day;
    [{a:'U2',l:'L1',dt:dkN(m),s:'09:00',e:'13:00',st:'approved'},{a:'U3',l:'L2',dt:dkN(m),s:'10:00',e:'14:00',st:'approved'},{a:'U2',l:'L3',dt:dkN(m+1),s:'14:00',e:'17:00',st:'pending'},{a:'U3',l:'L1',dt:dkN(m+2),s:'09:00',e:'12:00',st:'rejected'}].forEach(x=>DB.actions.push({id:uid(),ambassadorId:x.a,locationId:x.l,date:x.dt,startTime:x.s,endTime:x.e,status:x.st,sales:[],actionNum:1,startedAt:null,endedAt:null,endReason:null}));
    // Demo stock
    if(!DB.stock.length){
      const today2=dk(new Date());
      const exp=new Date();exp.setDate(exp.getDate()+PACK_EXPIRY_DAYS);
      const expStr=dk(exp);
      [
        {id:uid(),userId:'U2',productId:'ID_RED',isOpen:false,isConsumed:false,sticksLeft:20,openedAt:null,expiresAt:null,addedAt:today2},
        {id:uid(),userId:'U2',productId:'ID_GOLD',isOpen:true,isConsumed:false,sticksLeft:15,openedAt:today2,expiresAt:expStr,addedAt:today2},
        {id:uid(),userId:'U2',productId:'IS_ICE',isOpen:false,isConsumed:false,sticksLeft:20,openedAt:null,expiresAt:null,addedAt:today2},
        {id:uid(),userId:'U3',productId:'IS_POLAR',isOpen:true,isConsumed:false,sticksLeft:8,openedAt:today2,expiresAt:expStr,addedAt:today2},
      ].forEach(s=>DB.stock.push(s));
    }
    saveLocal();
  }
}

window.addEventListener('firebase-ready',async()=>{
  const FB=window._FB;
  FIREBASE_MODE=FB.ok;
  if(FIREBASE_MODE){
    FB.onAuthStateChanged(FB.auth,async(firebaseUser)=>{
      document.getElementById('loading-screen').style.display='none';
      if(firebaseUser){
        try{
          const snap=await FB.getDoc(FB.doc(FB.db,'users',firebaseUser.uid));
          if(snap.exists()){
            CU={id:firebaseUser.uid,...snap.data()};
            if(CU.status==='active'){await loadFromFirebase();document.getElementById('auth-screen').style.display='none';enterApp();return;}
          }
        }catch(e){}
      }
      document.getElementById('auth-screen').style.display='flex';
    });
  }else{
    document.getElementById('loading-screen').style.display='none';
    const saved=loadLocal();if(saved)DB=saved;
    if(!DB.stock)DB.stock=[];
    initDemoData();
    document.getElementById('auth-screen').style.display='flex';
  }
});

setTimeout(()=>{
  if(document.getElementById('loading-screen').style.display!=='none'){
    document.getElementById('loading-screen').style.display='none';
    FIREBASE_MODE=false;
    const saved=loadLocal();if(saved)DB=saved;
    if(!DB.stock)DB.stock=[];
    initDemoData();
    document.getElementById('auth-screen').style.display='flex';
  }
},3000);
</script>
