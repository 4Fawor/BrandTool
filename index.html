
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brand Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* CIEMNY MOTYW */
  --bg:#121212;
  --bg2:#1e1e1e;
  --white:#242424;
  --border:#333333;
  --border2:#444444;
  --text:#e0e0e0;
  --text2:#b0b0b0;
  --muted:#777777;
  --accent:#3b82f6;
  --accent-l:#1e293b;
  --accent-d:#2563eb;
  --green:#22c55e;
  --green-l:#14532d;
  --red:#ef4444;
  --red-l:#451a1a;
  --yellow:#f59e0b;
  --yellow-l:#45310d;
  --r:6px;
  --font:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --topbar-h:52px;
  --nav-h:58px;
  --sidebar-w:200px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100%;font-size:13px;line-height:1.5;}
button,select,input,textarea{font-family:var(--font);font-size:13px; color: var(--text);}
img{max-width:100%;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--border2); border-radius: 10px;}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.auth-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:28px 24px;width:100%;max-width:400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);}
.brand-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.brand-mark{width:32px;height:32px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;letter-spacing:-.3px; border-radius: 4px;}
.brand-name{font-size:18px;font-weight:700;letter-spacing:-.3px;color:var(--text);}
.auth-hint{font-size:12px;color:var(--muted);margin-bottom:22px;padding-left:42px;}
.auth-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;}
.auth-tab{flex:1;padding:8px 12px;border:none;background:none;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
.auth-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* FORMS */
.fg{margin-bottom:12px;}
.fl{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
.fc{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:var(--r);font-size:13px;transition:border-color .15s;-webkit-appearance:none;}
.fc:focus{outline:none;border-color:var(--accent);}
.fc::placeholder{color:var(--muted);}
.fc[disabled]{opacity:.5;cursor:not-allowed;background:var(--bg2);}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fhint{font-size:11px;color:var(--muted);margin-top:3px;}
.f-static{padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-weight:600;color:var(--text2);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 14px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .12s;white-space:nowrap;}
.btn:active{opacity:.85;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover:not(:disabled){background:var(--accent-d);}
.btn-green{background:var(--green);color:#fff;}.btn-green:hover:not(:disabled){background:#15803d;}
.btn-red{background:var(--red);color:#fff;}.btn-red:hover:not(:disabled){background:#b91c1c;}
.btn-ghost{background:var(--white);border:1px solid var(--border);color:var(--text2);}.btn-ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-xs{padding:3px 8px;font-size:11px;}
.btn-block{width:100%;justify-content:center;}

/* APP SHELL */
#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:200;height:var(--topbar-h);background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;}
.tb-name{font-size:14px;font-weight:700;color:var(--text);}
.tb-spacer{flex:1;}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 9px;cursor:pointer;font-size:11px;font-weight:600;transition:all .12s;}
.logout-btn:hover{border-color:var(--red);color:var(--red);}

/* SIDEBAR & NAV */
.sidebar{display:none;position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--sidebar-w);background:var(--white);border-right:1px solid var(--border);padding:10px 8px;overflow-y:auto;z-index:100;}
.snav-btn{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:7px 8px;cursor:pointer;color:var(--text2);font-size:12px;font-weight:500;text-align:left;margin-bottom:1px;transition:all .12s; border-radius: 4px;}
.snav-btn:hover{background:var(--bg);color:var(--text);}
.snav-btn.active{background:var(--accent-l);color:var(--accent);font-weight:700;}

.bnav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--white);border-top:1px solid var(--border);display:flex;padding:4px 6px calc(4px + env(safe-area-inset-bottom));}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;cursor:pointer;padding:4px 2px;color:var(--muted);font-size:9px;font-weight:600;position:relative;}
.bnav-btn.active{color:var(--accent);}

/* CARD */
.card{background:var(--white);border:1px solid var(--border);padding:16px; border-radius: 4px;}
.card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}

/* CALENDAR & SLOTS */
.cal-day{background:var(--white);border:1px solid var(--border); border-radius: 4px; overflow: hidden;}
.cal-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);}
.cal-hd.today-hd{background:var(--accent-l); border-bottom-color: var(--accent-d);}
.cal-num{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:1px solid var(--border);flex-shrink:0;background:var(--bg); border-radius: 4px;}
.cal-num.today{background:var(--accent);color:#fff;border-color:var(--accent);}

.slot{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);cursor:pointer;transition:border-color .12s;border-left-width:3px; border-radius: 4px;}
.slot:hover{border-color:var(--accent);}
.slot.s-active{background:var(--accent-l); border-left-color: var(--accent);}

/* MODAL */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;align-items:flex-end;justify-content:center; backdrop-filter: blur(4px);}
.modal{background:var(--white);border:1px solid var(--border);padding:18px 16px; width:100%; max-width:460px; border-radius: 8px 8px 0 0;}
@media(min-width:600px){.modal{border-radius: 8px; margin-bottom: 0;}}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;font-size:10px;font-weight:700;white-space:nowrap;border:1px solid; border-radius: 2px;}
.bdp{background:var(--yellow-l);color:var(--yellow);border-color:var(--yellow);}.bdp::before{background:var(--yellow);}
.bda{background:var(--green-l);color:var(--green);border-color:var(--green);}.bda::before{background:var(--green);}
.bdr{background:var(--red-l);color:var(--red);border-color:var(--red);}.bdr::before{background:var(--red);}

/* STATS */
.stat-card{background:var(--white);border:1px solid var(--border);padding:12px 14px; border-radius: 4px;}
.stat-val{font-size:22px;font-weight:700;color: var(--accent);}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav-h) + 8px);left:50%;transform:translateX(-50%) translateY(12px);z-index:9999;background:var(--accent);color:#fff;padding:8px 16px;border-radius: 4px;font-size:12px;font-weight:600;}

@media(min-width:768px){.sidebar{display:block;}.bnav{display:none!important;}.main-wrap{margin-left:var(--sidebar-w);}}
</style>
</head>
<body>

<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand-row"><div class="brand-mark">BT</div><div class="brand-name">Brand Tool</div></div>
    <div class="auth-hint">Platforma dla ambasadorów marki</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">Logowanie</button>
      <button class="auth-tab" onclick="switchAuthTab('register')">Rejestracja</button>
    </div>
    <div id="auth-login-panel">
      <div id="login-err" class="alert alert-err"></div>
      <div class="fg"><label class="fl">E-mail</label><input type="email" class="fc" id="login-email" placeholder="twoj@email.pl" autocomplete="email"></div>
      <div class="fg"><label class="fl">Hasło</label><input type="password" class="fc" id="login-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn btn-primary btn-block" onclick="doLogin()">Zaloguj się</button>
    </div>
    <div id="auth-register-panel" style="display:none">
      <div id="reg-err" class="alert alert-err"></div>
      <div id="reg-ok" class="alert alert-ok"></div>
      <div class="fr">
        <div class="fg"><label class="fl">Imię</label><input type="text" class="fc" id="reg-first" placeholder="Anna"></div>
        <div class="fg"><label class="fl">Nazwisko</label><input type="text" class="fc" id="reg-last" placeholder="Nowak"></div>
      </div>
      <div class="fg"><label class="fl">E-mail</label><input type="email" class="fc" id="reg-email" placeholder="twoj@email.pl"></div>
      <div class="fg"><label class="fl">Hasło</label><input type="password" class="fc" id="reg-pass" placeholder="min. 6 znaków"></div>
      <div class="fg"><label class="fl">Koordynator</label><select class="fc" id="reg-sv"><option value="">Wybierz koordynatora...</option></select></div>
      <div class="fg"><label class="fl">Kod dostępu</label><input type="text" class="fc" id="reg-code" placeholder="np. TEAM2024" style="text-transform:uppercase"></div>
      <div class="fhint" style="margin-top:-8px;margin-bottom:12px">Kod otrzymujesz od koordynatora. Konto wymaga zatwierdzenia.</div>
      <button class="btn btn-primary btn-block" onclick="doRegister()">Utwórz konto</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="tb-logo"><div class="tb-mark">BT</div><div class="tb-name">Brand Tool</div></div>
    <div class="tb-spacer"></div>
    <div class="tb-right">
      <button class="notif-btn" id="notif-btn" onclick="showPanel('notifications')" title="Powiadomienia">
        🔔<span class="notif-dot" id="notif-dot" style="display:none"></span>
      </button>
      <div class="av" id="topbar-av"></div>
      <span class="tb-username" id="topbar-nm"></span>
      <button class="logout-btn" onclick="logout()">Wyloguj</button>
    </div>
  </div>
  <div class="sidebar" id="sidebar"></div>
  <div class="bnav" id="bnav"></div>
  <div class="main-wrap"><div class="page" id="main-content"></div></div>
</div>

<div id="toast"></div>

<div class="modal-ov" id="modal-ov" onclick="closeModalBg(event)">
  <div class="modal" id="modal-box">
    <div class="modal-hd">
      <div class="modal-title" id="modal-ttl"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const LS_KEY='brandtool_v2';
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){}}
function loadDB(){try{const r=localStorage.getItem(LS_KEY);if(r)return JSON.parse(r);}catch(e){}return null;}

const ACCESS_CODE='TEAM2024';
const SHOP_TYPES=['Żabka','Biedronka','Lidl','Rossmann','Empik','Carrefour','Action','Media Markt','Inne','Akcja Lotna'];

let DB={
  users:[
    {id:'U1',firstName:'Kamila',lastName:'Kowalska',email:'koord@brand.pl',pass:'1234',role:'coordinator',svId:null,status:'active',color:'#3b82f6',createdAt:Date.now()-9e8},
    {id:'U2',firstName:'Anna',lastName:'Nowak',email:'anna@brand.pl',pass:'1234',role:'ambassador',svId:'U1',status:'active',color:'#3b82f6',createdAt:Date.now()-7e8},
    {id:'U3',firstName:'Marta',lastName:'Wiśniewska',email:'marta@brand.pl',pass:'1234',role:'ambassador',svId:'U1',status:'active',color:'#22c55e',createdAt:Date.now()-6e8},
    {id:'U4',firstName:'Piotr',lastName:'Zając',email:'piotr@brand.pl',pass:'1234',role:'ambassador',svId:'U1',status:'active',color:'#f59e0b',createdAt:Date.now()-5e8},
  ],
  pendingAccounts:[],
  locations:[
    {id:'L1',address:'ul. Wołoska 12, Warszawa',shopType:'Żabka',note:''},
    {id:'L2',address:'Al. Jerozolimskie 44, Warszawa',shopType:'Biedronka',note:''},
    {id:'L3',address:'ul. Marszałkowska 5, Warszawa',shopType:'Akcja Lotna',note:''},
  ],
  mechanisms:[
    {id:'M1',name:'Próbka produktu',active:true},
    {id:'M2',name:'Karta lojalnościowa',active:true},
    {id:'M3',name:'Rejestracja aplikacji',active:true},
  ],
  actions:[],
  nextId:100,
};

const DAYS=['Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota','Niedziela'];
function uid(){const id='X'+(DB.nextId++);save();return id;}
function getMon(off=0){const d=new Date(),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);const m=new Date(d);m.setDate(diff);m.setHours(0,0,0,0);m.setDate(m.getDate()+off*7);return m;}
function getWeek(off=0){const m=getMon(off);return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return d;});}
function dk(d){return d.toISOString().slice(0,10);}
function fmtD(d){return d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'});}
function isToday(d){return dk(d)===dk(new Date());}
function t2m(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function diffH(s,e){return(t2m(e)-t2m(s))/60;}
function fmtSec(s){return`${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`;}
function pad(n){return String(n).padStart(2,'0');}
function nowStr(){const n=new Date();return`${pad(n.getHours())}:${pad(n.getMinutes())}`;}
function getU(id){return DB.users.find(u=>u.id===id);}
function getL(id){return DB.locations.find(l=>l.id===id);}
function getM(id){return DB.mechanisms.find(m=>m.id===id);}
function fullName(u){return u?u.firstName+' '+u.lastName:'?';}
function ini(u){return u?(u.firstName[0]+u.lastName[0]).toUpperCase():'?';}
function slbl(s,active){if(active)return'Aktywna';return{pending:'Oczekuje',approved:'Zatwierdzona',rejected:'Odrzucona'}[s]||s;}
function sdc(s,active){return active?'x':s==='pending'?'p':s==='approved'?'a':'r';}
function bdcls(s,active){return active?'bdx':s==='pending'?'bdp':s==='approved'?'bda':'bdr';}
function canEditNextWeek(){return new Date().getDay()>=3;}

function toast(msg,type='ok'){const el=document.getElementById('toast');el.textContent=msg;el.className='show t'+type;clearTimeout(el._t);el._t=setTimeout(()=>el.className='',3200);}

let CU=null,weekOff=0,timerInt=null,saleRegVal=true,salePhotoData=null,currentPanel='';

/* AUTH */
function switchAuthTab(tab){
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('auth-login-panel').style.display=tab==='login'?'block':'none';
  document.getElementById('auth-register-panel').style.display=tab==='register'?'block':'none';
  if(tab==='register')populateSVSelect();
}
function populateSVSelect(){
  const sel=document.getElementById('reg-sv');if(!sel)return;
  const coords=DB.users.filter(u=>u.role==='coordinator'&&u.status==='active');
  sel.innerHTML=`<option value="">Wybierz koordynatora...</option>`+coords.map(c=>`<option value="${c.id}">${fullName(c)}</option>`).join('');
}
function doLogin(){
  const email=document.getElementById('login-email').value.trim().toLowerCase();
  const pass=document.getElementById('login-pass').value;
  const err=document.getElementById('login-err');
  err.className='alert alert-err';
  const u=DB.users.find(u=>u.email.toLowerCase()===email&&u.pass===pass);
  if(!u){err.innerHTML='Nieprawidłowy e-mail lub hasło';err.className='alert alert-err show';return;}
  if(u.status==='pending'){err.innerHTML='Konto czeka na zatwierdzenie przez koordynatora';err.className='alert alert-err show';return;}
  if(u.status==='blocked'){err.innerHTML='Konto zostało zablokowane';err.className='alert alert-err show';return;}
  CU=u;
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.cssText='display:flex;flex-direction:column;';
  const av=document.getElementById('topbar-av');
  av.textContent=ini(CU);av.style.cssText=`background:${CU.color}22;color:${CU.color};border:1px solid ${CU.color}44`;
  document.getElementById('topbar-nm').textContent=fullName(CU);
  buildNav();updateNotifDot();
  showPanel(CU.role==='coordinator'?'coord-dashboard':'amb-dashboard');
}
function doRegister(){
  const first=document.getElementById('reg-first').value.trim();
  const last=document.getElementById('reg-last').value.trim();
  const email=document.getElementById('reg-email').value.trim().toLowerCase();
  const pass=document.getElementById('reg-pass').value;
  const svId=document.getElementById('reg-sv').value;
  const code=document.getElementById('reg-code').value.trim().toUpperCase();
  const err=document.getElementById('reg-err');const ok=document.getElementById('reg-ok');
  err.className='alert alert-err';ok.className='alert alert-ok';
  if(!first||!last){err.innerHTML='Podaj imię i nazwisko';err.className='alert alert-err show';return;}
  if(!email||!email.includes('@')){err.innerHTML='Podaj prawidłowy e-mail';err.className='alert alert-err show';return;}
  if(pass.length<6){err.innerHTML='Hasło musi mieć min. 6 znaków';err.className='alert alert-err show';return;}
  if(!svId){err.innerHTML='Wybierz koordynatora';err.className='alert alert-err show';return;}
  if(code!==ACCESS_CODE){err.innerHTML='Nieprawidłowy kod dostępu';err.className='alert alert-err show';return;}
  if(DB.users.find(u=>u.email.toLowerCase()===email)){err.innerHTML='Ten e-mail jest już zarejestrowany';err.className='alert alert-err show';return;}
  DB.pendingAccounts.push({id:'PA'+Date.now(),firstName:first,lastName:last,email,pass,role:'ambassador',svId,status:'pending',color:'#3b82f6',createdAt:Date.now()});
  save();updateNotifDot();
  ok.innerHTML='Konto zostało utworzone i czeka na zatwierdzenie.';ok.className='alert alert-ok show';
  ['reg-first','reg-last','reg-email','reg-pass','reg-code'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
}
function logout(){
  CU=null;weekOff=0;if(timerInt){clearInterval(timerInt);timerInt=null;}
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('login-email').value='';
  document.getElementById('login-pass').value='';
  document.getElementById('login-err').className='alert alert-err';
}

/* NAV */
const AMB_TABS=[{id:'amb-dashboard',ico:'📊',lbl:'Dashboard'},{id:'amb-actions',ico:'⚡',lbl:'Akcje'},{id:'amb-schedule',ico:'📅',lbl:'Grafik'},{id:'amb-stats',ico:'📈',lbl:'Statystyki'}];
const COORD_TABS=[{id:'coord-dashboard',ico:'📊',lbl:'Dashboard'},{id:'coord-schedule',ico:'📅',lbl:'Grafik'},{id:'coord-approvals',ico:'✅',lbl:'Zatwierdzenia'},{id:'coord-accounts',ico:'👥',lbl:'Konta'},{id:'coord-team',ico:'🏆',lbl:'Zespół'},{id:'coord-mechanisms',ico:'⚙️',lbl:'Mechanizmy'},{id:'coord-report',ico:'📑',lbl:'Raport'}];

function buildNav(){
  const tabs=CU.role==='coordinator'?COORD_TABS:AMB_TABS;
  const pAcc=DB.pendingAccounts.filter(p=>p.svId===CU.id).length;
  const pAct=DB.actions.filter(a=>a.status==='pending').length;
  document.getElementById('bnav').innerHTML=tabs.slice(0,4).map(t=>{
    const bdg=(t.id==='coord-accounts'&&pAcc)||(t.id==='coord-approvals'&&pAct)?`<span class="bnav-bdg">${t.id==='coord-accounts'?pAcc:pAct}</span>`:'';
    return`<button class="bnav-btn" id="bn-${t.id}" onclick="showPanel('${t.id}')"><span class="bnav-ico">${t.ico}</span>${t.lbl}${bdg}</button>`;
  }).join('');
  let s=`<div class="snav-section">Menu</div>`;
  tabs.forEach(t=>{
    const bdg=(t.id==='coord-accounts'&&pAcc)||(t.id==='coord-approvals'&&pAct)?`<span class="snav-badge">${t.id==='coord-accounts'?pAcc:pAct}</span>`:'';

function buildCalDay(day,idx,actions,isCoord,locked){
  const dateKey=dk(day);
  const todHd=isToday(day)?'today-hd':'';
  const todN=isToday(day)?'today':'';
  const mm=String(day.getMonth()+1).padStart(2,'0');
  const addFn=isCoord?`openCoordAddAction('${dateKey}')`:`openAddAction('${dateKey}')`;
  const addDis=(!isCoord&&(locked||actions.length>=2))?'disabled':'';
  let h=`<div class="cal-day"><div class="cal-hd ${todHd}"><div class="cal-hd-l"><div class="cal-num ${todN}">${day.getDate()}</div><div><div class="cal-day-name">${DAYS[idx]}</div><div class="cal-day-date">${mm}.${day.getFullYear()}</div></div></div><button class="btn btn-sm btn-primary" ${addDis} onclick="${addFn}">+ Dodaj</button></div>`;
  if(!actions.length){h+=`<div class="cal-empty">Brak akcji</div>`;}
  else{
    h+=`<div class="cal-slots">`;
    actions.forEach(a=>{
      const l=getL(a.locationId);const u=getU(a.ambassadorId);const active=a.startedAt&&!a.endedAt;const sc=sdc(a.status,active);const sales=(a.sales||[]).length;
      h+=`<div class="slot s-${sdc(a.status,active)}" onclick="openDetail('${a.id}')"><div class="slot-body"><div class="slot-loc">${l?.address||'?'}</div><div class="slot-type">${l?.shopType||''}</div><div class="slot-meta"><span class="slot-time">${a.startTime}–${a.endTime}</span>${sales>0?`<span class="slot-sales-ct"> · ${sales} sprzedaży`:''}${isCoord?` · <span class="slot-amb" style="color:${u?.color||'#666'}">${fullName(u)}</span>`:''}${sales>0?'</span>':''}<span class="slot-st"> · ${slbl(a.status,active)}</span></div></div>${active?`<span class="live-tag">LIVE</span>`:''}</div>`;
    });
    h+=`</div>`;
  }
  return h+`</div>`;
}

function renderAmbDashboard(){
  const mine=DB.actions.filter(a=>a.ambassadorId===CU.id);

  const approved=tw.filter(a=>a.status==='approved').length;

  const todayKey=dk(new Date());
  const upcoming=mine.filter(a=>a.status==='approved'&&a.date>=todayKey&&!a.startedAt&&!a.endedAt).sort((a,b)=>a.date.localeCompare(b.date)||(t2m(a.startTime)-t2m(b.startTime)));
  const next=upcoming[0];
  let h=`<div class="section-hd"><div class="page-title">Witaj, ${CU.firstName}</div><div class="page-sub">Bieżący tydzień — ${fmtD(getWeek(0)[0])} – ${fmtD(getWeek(0)[6])}</div></div>`;
  if(active){h+=`<div id="ti-inject">${buildTimerCard(active.id)}</div>`;setTimeout(()=>startTimerUI(active.id),80);}
  if(!active&&next){
    const loc=getL(next.locationId);

  }
